# The Tauri desktop client — the shipped macOS and Linux client, on the shared
# shed-core. Deliberately its OWN cargo workspace (note the empty
# `[workspace]` table) so WebKitGTK + Tauri deps are NEVER absorbed into ../../../crates'
# workspace: `make core-test` / `core-lint` stay WebKit-free. shed-core /
# shed-app are pulled in as plain path deps (that does not make this a member of
# core's workspace). See plans/tauri-phase-a.md.
[package]
name = "shed-desktop-tauri"
version = "0.11.0"
edition = "2021"
publish = false

# Standalone workspace root: stops cargo walking up to adopt (or be adopted by)
# core's workspace. Its Cargo.lock is committed for reproducible CI.
[workspace]

[lib]
name = "shed_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "tray-icon" backs the menu-bar/tray (B1 — macOS rich popover / Linux native menu).
tauri = { version = "2", features = ["tray-icon"] }
# The shared protocol + app-logic crates (cross-workspace path deps — this links
# them; it does not make this crate a member of core's workspace).
shed-core = { path = "../../../crates/shed-core" }
shed-app = { path = "../../../crates/shed-app" }
# Toolkit-free shed-only desktop runtime (plan 038): hosts, craze, lanes,
# slash, and the orderly shutdown. This crate is the Tauri adapter over it.
shed-desktop-core = { path = "../../../crates/shed-desktop-core" }
# Lane and RC DTOs (`RcKind` for `rc.inject_test`, `LaneCreateRequest` for
# `craze.create`). Transitive through shed-desktop-core; named here because
# the IPC doors name the types.
shed-lane = { path = "../../../crates/shed-lane" }
# Craze adapter. The desktop reaches it through shed-desktop-core; linked
# directly so the crate is an explicit part of this shell (plan 038 U3).
shed-craze = { path = "../../../crates/shed-craze" }
# Roost reach, bootstrap, and the wrapped `tab_open_fenced`. The desktop
# reaches it through shed-desktop-core; linked directly for the same reason
# as shed-craze. No direct `roost-ipc` — shed-roost is the only crate that
# names those wire types.
shed-roost = { path = "../../../crates/shed-roost" }
# "signal" backs the orderly shutdown's signal thread (plan 026 §3.3).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
# Advisory file lock for the single-instance guard (flock, keyed to the socket
# dir — hermetic, unlike an identifier-scoped plugin).
fs2 = "0.4"
# Launch-at-login (B4): the `auto-launch` crate under a Tauri plugin (macOS
# LaunchAgent / Linux `.desktop` autostart — NOT SMAppService). Cross-platform, so
# not target-gated. The React toggle drives our own guarded `loginitem_*` commands,
# NOT the plugin's JS API, so a test-mode write can't slip past the guard.
tauri-plugin-autostart = "2"
# Anchors the macOS menu-bar popover window at the tray icon (B1b). The "tray-icon"
# feature enables the tray-relative `Position::TrayCenter`; it needs a real tray
# click forwarded to cache the tray rect (the hermetic `tray.show` falls back to a
# fixed position). Cross-platform crate; the popover itself is macOS-only.
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
# The app's log file (#414, `applog.rs`): the shed crates' `tracing` events
# (and roost-ipc's, only with SHED_TAURI_LOG=debug, reached through shed-roost)
# are written by a `fmt` layer into the same rotating file as the app's own
# lines. `tracing` is already in the lock (the facade those crates use); naming
# it here is what lets this crate build the subscriber. Default features off:
# no ANSI colours, no `log` bridge, no env-filter regex — `fmt` (which brings
# `registry`) and `std` are
# all the layer and its `Targets` filter need. The subscriber lives HERE, never
# in ../../../crates (crates/CLAUDE.md's workspace boundary: that workspace stays
# subscriber-free).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

# macOS-only: objc2 for the AppKit glue the updater and the IPC code use (pure Rust,
# no Swift toolchain). Target-gated so the Linux/WebKitGTK build never pulls it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSApp.activate before a Sparkle check (updater.rs) — the crate's own Gap 1: on a
# tray/accessory app the Sparkle window can appear behind/unfocused. objc2-app-kit
# 0.3 is already transitively in the lock (the sparkle-updater crate pulls it); we
# depend on it directly for the `NSApplication` activation glue.
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }
# Real Sparkle updater (macOS only). Exact pin — young third-party
# crate, deliberate bumps only. Registered ONLY outside test mode (lib.rs), so the
# harness never instantiates an updater. build.rs links the staged Sparkle.framework
# (make sparkle-framework prereq); Linux never compiles it (mac-only target dep).
tauri-plugin-sparkle-updater = "=0.2.4"
# macOS-only tauri features, unioned into the base `tauri` features:
#  - image-png: `Image::from_bytes` for the menu-bar template tray icon (tray.rs).
#  - macos-private-api: a TRANSPARENT popover window — needed for both its rounded
#    corners AND the native `Popover` vibrancy material.
#    Private CoreAnimation API — fine for the DMG/Sparkle distribution (would matter
#    only for the App Store, not a target).
# Both kept off the Linux build (it uses the colored icon + a native menu, no popover).
tauri = { version = "2", features = ["image-png", "macos-private-api"] }

[dev-dependencies]
tempfile = "3"
# `tauri::test` — the mock runtime, so a test drives a `#[tauri::command]` through
# Tauri's own argument extraction (plan 026 §3.5: an argument a command does not
# declare is dropped without a word, and only that layer can show it). `test = []`
# in tauri's manifest: no package is added to the lock, and the shipped binary
# never compiles it (a dev-dependency feature reaches test builds only).
tauri = { version = "2", features = ["test"] }

# A debug build is what the harness drives; keep it reasonably snappy.
#
# `opt-level = 1` stays (the harness drives this build, and an unoptimized
# WebKitGTK client is noticeably sluggish). The debug-info settings match
# `crates/Cargo.toml` — see its profile comment for the measurements; this
# workspace is separate on purpose, so the tuning has to be repeated rather than
# inherited.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies are not stepped through; their debug info is pure disk — and this
# crate's dep tree (Tauri + WebKitGTK + Sparkle) is the largest of the three.
debug = false
