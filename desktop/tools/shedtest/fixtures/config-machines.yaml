# Seed shed config for the machine-targets E2E (plan 012 S4). Same single mock
# host as config.yaml, plus a `machines:` section.
#
# In test mode the app reaches every machine's hub on SHED_TAURI_MACHINE_HUB_PORT
# directly (a `FixedPort`), so `host`/`user` here are never dialled — no ssh is
# spawned. What matters is the SHAPE: two machines, so the suite covers both the
# reachable and the unreachable case in one launch.
#
# THREE machines, one per health band, because the sidebar and the pane both
# claim an ordering (reachable → connecting → offline) that two bands cannot
# prove:
#   * `mini3`  — a hub that answers        → reachable
#   * `sleepy` — no hub at all             → connecting (never reached)
#   * `flaky`  — a hub that answers, then  → offline (reached once, gone now)
#                the harness stops it
# None of them is special to the app; all three entries are identical, and the
# difference is entirely in what the harness serves.
servers:
    mock:
        host: 127.0.0.1
        http_port: 8080
        ssh_port: 2222
default_server: mock
sheds: {}
machines:
    mini3:
        host: 127.0.0.1
        user: nobody
    sleepy:
        host: 127.0.0.1
        user: nobody
    flaky:
        host: 127.0.0.1
        user: nobody
