# Seed shed config for the gx agent-lane E2E (plan 017 §3.5).
#
# A copy of `config-lane.yaml`'s shape rather than a share of it: the two suites
# run their own app instances against their own fakes, and a shared config file
# would make one suite's machine list the other's problem the first time either
# needed a second entry.
#
# ONE machine, deliberately — the gx cells are about what happens on a row that
# carries an `agent_lane` stamp, not about health bands.
#
# In test mode the app reaches `mini3`'s `roost-session` on the Unix socket
# SHED_TAURI_ROOST_SOCKETS names (a `LocalSession`), so `host`/`user` are never
# dialled and no ssh is spawned. That mapping is ALSO what makes the machine
# `ReachKind::Local`, which is what puts the gx credential read on the LOCAL
# path: files under `$SHED_TAURI_GX_HOME`, never a probe over a shell. One cell
# asserts that from the outside, by walking the app's process tree.
servers:
    mock:
        host: 127.0.0.1
        http_port: 8080
        ssh_port: 2222
default_server: mock
sheds: {}
machines:
    mini3:
        host: 127.0.0.1
        user: nobody
