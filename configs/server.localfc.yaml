# Shed Server Firecracker-focused Configuration
#
# Use this for testing 9P local-dir and credential mounts on Firecracker:
#   sudo shed-server serve --config ./configs/server.localfc.yaml
#
# Mirrors the macOS VZ config (server.localmac.yaml) with the same
# credential layout to verify feature parity.

name: localfc-dev

http_port: 8080
ssh_port: 2222

credentials:
  # Claude Code - credentials and settings
  claude:
    source: /home/charliek/.shed/mounts/claude
    target: /home/shed/.claude
    readonly: false

  codex:
    source: /home/charliek/.shed/mounts/codex
    target: /home/shed/.codex
    readonly: false

  opencode_data:
    source: /home/charliek/.shed/mounts/opencode/share
    target: /home/shed/.local/share/opencode
    readonly: false

  opencode_state:
    source: /home/charliek/.shed/mounts/opencode/state
    target: /home/shed/.local/state/opencode
    readonly: false

  # GitHub CLI - credentials and config
  gh:
    source: /home/charliek/.shed/mounts/gh
    target: /home/shed/.config/gh
    readonly: false

# Environment file with GIT_SSH_COMMAND for SSH key access
env_file: /home/charliek/.shed/env

log_level: debug

extensions:
  enabled:
    - ssh-agent
    - aws-credentials
    - docker-credentials

default_backend: firecracker

firecracker:
  default_image: ghcr.io/charliek/shed-fc-full:v0.5.9
  image_aliases:
    base: ghcr.io/charliek/shed-fc-base:v0.5.9
    extensions: ghcr.io/charliek/shed-fc-extensions:v0.5.9
    full: ghcr.io/charliek/shed-fc-full:v0.5.9
  pull_policy: missing
  instance_dir: /var/lib/shed/firecracker/instances
  socket_dir: /var/run/shed/firecracker
  default_cpus: 2
  default_memory_mb: 4096
  default_disk_gb: 20
  vsock_base_cid: 100
  console_port: 1024
  health_port: 1025
  notify_port: 1026
  start_timeout: 90s
  stop_timeout: 10s
  bridge_name: shed-br0
  bridge_cidr: 172.30.0.1/24
  tap_prefix: shed-tap
