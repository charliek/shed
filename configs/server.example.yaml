# Shed Server Configuration
#
# Copy this file to one of the following locations:
#   - ./server.yaml (current directory)
#   - ~/.config/shed/server.yaml
#   - /etc/shed/server.yaml

# Server identity - used in API responses and logging. It also names this
# server's nftables tables for isolated sheds (shed_<name>, non-alphanumerics
# as _), so two servers on one host need names that differ after that.
name: my-server

# Network configuration
http_port: 8080
ssh_port: 2222

# bind_address — the interface every listener (HTTP, HTTPS, SSH) binds.
# Defaults to loopback (127.0.0.1): shed is a local-development tool unless
# explicitly exposed. Set a routable address ("0.0.0.0"/"*" = all IPv4,
# "::" = all interfaces, or a specific LAN/tailnet IP) to reach it off-box.
# In OPEN mode (no TLS) a non-loopback bind also requires
# allow_insecure_exposure: true; token mode (auth.mode: token) needs no ack.
bind_address: 127.0.0.1

# Backend configuration
# Valid values: vz (macOS/arm64), firecracker (Linux), detect (auto-select)
# "detect" picks vz on macOS Apple Silicon and firecracker on Linux.
default_backend: detect

# Host directories to mount into sheds (formerly "credentials"): every shed by
# default; per shed with `shed create --mounts none|all|a,b`.
# Each entry creates a directory mount from host to VM
# Paths support ~ expansion
# (The deprecated key "credentials" is still accepted as a fallback.)
mounts:
  claude:
    source: ~/.claude
    target: /home/shed/.claude
    readonly: false  # Needs write access for token refresh

  opencode:
    source: ~/.config/opencode
    target: /home/shed/.config/opencode
    readonly: true

  gh:
    source: ~/.config/gh
    target: /home/shed/.config/gh
    readonly: true

# Environment file path
# Each line should be in format: KEY=value
# These variables are passed to the in-VM `git clone` of a create's repo (not
# to sessions or hooks), and never to a service client's sheds.
env_file: ~/.shed/env

# Identity directory: SSH host key, TLS cert, mtls client CA, GitHub key cache.
# Default /etc/shed as root, ~/.shed otherwise; set it for a second server on
# the same host. See docs/reference/configuration.md#tls-and-network-surface
# state_dir: /etc/shed

# --- Authentication and service clients ---
# auth.mode: open (default) | token | mtls. See docs/guides/security-configuration.md.
# Service clients (orchestrators that create, exec in and delete only their own
# sheds) need mtls. Issue a client's certificate on this host with
# `shed-server client issue <name>`. See docs/guides/orchestrated-sheds.md and
# docs/reference/configuration.md#service-clients
# auth:
#   mode: mtls
#   ssh:
#     github_users: [your-github-user]
#   clients:
#     nocturn:
#       cert_max_ttl: 2160h          # longest certificate `client issue` signs
#       policy:
#         name_prefix: "nocturn-"    # required
#         max_sheds: 4               # required
#         max_age: 30h               # required: older owned sheds are deleted
#         network: isolated          # default isolated; must be open on vz
#         server_mounts: []          # default: no server mounts
#         images: []                 # default: only the default image
#         caps: {cpus: 4, memory_mb: 8192}

# --- HTTPS exec limits (POST /api/sheds/{name}/exec) ---
# See docs/reference/configuration.md#https-exec
# exec:
#   max_stdin_bytes: 1048576
#   max_timeout: 1h
#   max_concurrent_per_shed: 8

# --- Audit log (audit.jsonl next to egress-audit.jsonl) ---
# Always on when auth.clients is set. exec_argv: "" logs argv[0] and the
# argument count; "full" logs every argument. See
# docs/reference/configuration.md#audit-log
# audit:
#   enabled: false
#   exec_argv: ""

# --- Network profiles (isolated is Firecracker only) ---
# isolated: the internet and nothing else (not the host, other sheds, the
# LAN, the tailnet or cloud metadata). Needs the nft binary and shed-server
# running as root (the deb's unit does); vz supports only open. Per shed:
# `shed create --network isolated`. See docs/reference/security.md#network-profiles
# network:
#   default_profile: open      # open | isolated
#   allow_cidrs: []            # IPv4 ranges isolated sheds may still reach (forwarded only)

# Terminal configuration (optional)
# The base images include ncurses-term which handles most terminal types.
# These settings are only needed for exotic terminals not in ncurses-term.
# terminal:
#   # Default TERM value when normalization is needed (usually not required)
#   fallback_term: xterm-256color
#   # Explicit TERM mappings for specific terminals
#   term_mappings:
#     some-exotic-term: xterm-256color

# Logging level: debug, info, warn, error
log_level: info

# Extensions to enable in VMs
# Each entry is a namespace name matching a manifest in /etc/shed-extensions.d/
# The agent activates corresponding systemd units at VM startup.
# extensions:
#   enabled:
#     - ssh-agent
#     - aws-credentials

# Git behaviour for in-VM clones
# extra_known_hosts: lines appended to ~/.ssh/known_hosts before `git clone`
# runs over SSH. GitHub's published host keys are always included; this list
# extends them. Generate entries with `ssh-keyscan <host>` on a trusted machine.
# git:
#   extra_known_hosts:
#     - "gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf"

# --- Images and the server version ---
# When default_image / image_aliases are omitted, a released shed-server
# pulls the rootfs images published in lockstep with its own version —
# ghcr.io/charliek/shed-<backend>-{base,extensions,full}:vX.Y.Z. Upgrading
# the server is all it takes to move to the new images; no config edit.
#
# To pin a custom or mirrored ref while still tracking the server version,
# use the ${shed.version} token — it expands to the running server's tag
# (e.g. v0.6.2) at load:
#
#   default_image: myregistry.example.com/shed-vz-full:${shed.version}
#
# (A dev/dirty build has no matching published image, so on a source build
# the token is rejected and an unset default errors — pin an explicit ref.)

# --- VZ Backend (macOS Apple Silicon) ---
# vz:
#   vfkit_path: vfkit
#   kernel_path: ~/Library/Application Support/shed/vz/vmlinux
#   initrd_path: ~/Library/Application Support/shed/vz/initrd.img
#   # default_image / image_aliases omitted -> synthesized from the server
#   # version (see "Images and the server version" above). Set them only to
#   # override the registry/variant.
#   pull_policy: missing   # missing (default) | always | never
#   images_dir: ~/Library/Application Support/shed/vz/
#   instance_dir: ~/Library/Application Support/shed/vz/instances
#   socket_dir: ~/.shed/vz/sockets

# --- Firecracker Backend (Linux with KVM) ---
# firecracker:
#   kernel_path: /var/lib/shed/firecracker/vmlinux
#   # default_image / image_aliases omitted -> synthesized from the server
#   # version (see "Images and the server version" above).
#   pull_policy: missing   # missing (default) | always | never
#   images_dir: /var/lib/shed/firecracker/images

# --- Egress control (opt-in; Level-1 cooperative HTTP(S)_PROXY) ---
# Off by default. Set enabled: true to start a shed-egress-proxy child; sheds
# then opt in with `--egress <profiles>`. default: [] means existing sheds are
# unaffected. Level 1 is cooperative, NOT a security boundary — see
# docs/reference/egress.md for the policy language and the bypass inventory.
# The profiles below are starter examples (real-world sandbox allowlists), not
# guaranteed-complete safe defaults; run a shed in `audit` first, then tighten.
# Compose per shed, e.g. `shed create web --egress github,package-registries`.
egress:
  enabled: false
  port_range: "20000-30000"
  default: []
  profiles:
    audit: { mode: audit }                 # allow + log everything (guards still deny)

    ai-agents:                             # Anthropic + OpenAI API & telemetry
      allow: [api.anthropic.com, statsig.anthropic.com, statsig.com, sentry.io,
              api.openai.com, auth.openai.com, chatgpt.com]

    github:                                # clone + API + actions + GHCR (apex AND wildcard)
      allow: [github.com, api.github.com, codeload.github.com,
              objects.githubusercontent.com, raw.githubusercontent.com,
              "*.actions.githubusercontent.com", pkg-containers.githubusercontent.com,
              ghcr.io]

    package-registries:                    # npm, PyPI, Go, Rust, RubyGems, Maven
      allow: [registry.npmjs.org, pypi.org, files.pythonhosted.org,
              proxy.golang.org, sum.golang.org, index.golang.org,
              crates.io, index.crates.io, static.crates.io,
              rubygems.org, index.rubygems.org,
              repo.maven.apache.org, repo1.maven.org]

    os-updates:                            # Debian/Ubuntu apt (ports.ubuntu.com = Apple-Silicon arm64)
      allow: [deb.debian.org, security.debian.org, archive.ubuntu.com,
              security.ubuntu.com, ports.ubuntu.com, keyserver.ubuntu.com]

    containers:                            # Docker Hub + GHCR + Quay + MCR
      allow: [registry-1.docker.io, auth.docker.io,
              production.cloudflare.docker.com, production.cloudfront.docker.com,
              ghcr.io, pkg-containers.githubusercontent.com,
              quay.io, cdn.quay.io, mcr.microsoft.com]
