# Shed Server Configuration
#
# Copy this file to one of the following locations:
#   - ./server.yaml (current directory)
#   - ~/.config/shed/server.yaml
#   - /etc/shed/server.yaml

# Server identity - used in API responses and logging
name: my-server

# Network configuration
http_port: 8080
ssh_port: 2222

# Backend configuration
# Valid values: vz (macOS/arm64), firecracker (Linux), detect (auto-select)
# "detect" picks vz on macOS Apple Silicon and firecracker on Linux.
default_backend: detect

# Credentials to mount into VMs
# Each entry creates a directory mount from host to VM
# Paths support ~ expansion
credentials:
  claude:
    source: ~/.claude
    target: /home/shed/.claude
    readonly: false  # Needs write access for token refresh

  opencode:
    source: ~/.config/opencode
    target: /home/shed/.config/opencode
    readonly: true

  gh:
    source: ~/.config/gh
    target: /home/shed/.config/gh
    readonly: true

# Environment file path
# Each line should be in format: KEY=value
# These variables are injected into all VMs
env_file: ~/.shed/env

# Terminal configuration (optional)
# The base images include ncurses-term which handles most terminal types.
# These settings are only needed for exotic terminals not in ncurses-term.
# terminal:
#   # Default TERM value when normalization is needed (usually not required)
#   fallback_term: xterm-256color
#   # Explicit TERM mappings for specific terminals
#   term_mappings:
#     some-exotic-term: xterm-256color

# Logging level: debug, info, warn, error
log_level: info

# Extensions to enable in VMs
# Each entry is a namespace name matching a manifest in /etc/shed-extensions.d/
# The agent activates corresponding systemd units at VM startup.
# extensions:
#   enabled:
#     - ssh-agent
#     - aws-credentials

# Git behaviour for in-VM clones
# extra_known_hosts: lines appended to ~/.ssh/known_hosts before `git clone`
# runs over SSH. GitHub's published host keys are always included; this list
# extends them. Generate entries with `ssh-keyscan <host>` on a trusted machine.
# git:
#   extra_known_hosts:
#     - "gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf"

