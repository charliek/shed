# Shed Server macOS Development Configuration
#
# Use this for local development on Apple Silicon:
#   shed-server serve --config ./configs/server.localmac.yaml

name: localmac-dev

http_port: 8080
ssh_port: 2222

credentials:
  claude:
    source: ~/.shed/mounts/claude
    target: /home/shed/.claude
    readonly: false

  codex:
    source: ~/.shed/mounts/codex
    target: /home/shed/.codex
    readonly: false

  opencode_data:
    source: ~/.shed/mounts/opencode/share
    target: /home/shed/.local/share/opencode
    readonly: false

  opencode_state:
    source: ~/.shed/mounts/opencode/state
    target: /home/shed/.local/state/opencode
    readonly: false

  # Disabled - ephemeral cache that auto-regenerates on first opencode launch
  # opencode_cache:
  #   source: ~/.shed/mounts/opencode/cache
  #   target: /home/shed/.cache/opencode
  #   readonly: false

  gh:
    source: ~/.shed/mounts/gh
    target: /home/shed/.config/gh
    readonly: false

env_file: ~/.shed/env

log_level: debug

extensions:
  enabled:
    - ssh-agent
    - aws-credentials
    - docker-credentials

default_backend: vz

vz:
  vfkit_path: vfkit
  kernel_path: ~/Library/Application Support/shed/vz/vmlinux
  initrd_path: ~/Library/Application Support/shed/vz/initrd.img
  # default_image / image_aliases values are Docker refs (resolved and pulled
  # on first use), e.g.:
  #   default_image: ghcr.io/charliek/shed-vz-full:v0.5.9
  # See docs/reference/configuration.md for the ref-keyed image model.

  default_image: ghcr.io/charliek/shed-vz-full:v0.5.0-dev
  image_aliases:
    base: ghcr.io/charliek/shed-vz-base:v0.5.0-dev
    extensions: ghcr.io/charliek/shed-vz-extensions:v0.5.0-dev
    full: ghcr.io/charliek/shed-vz-full:v0.5.0-dev
  pull_policy: missing
  
  instance_dir: ~/Library/Application Support/shed/vz/instances
  socket_dir: ~/.shed/vz/sockets
  default_cpus: 2
  default_memory_mb: 4096
  default_disk_gb: 20
  console_port: 1024
  health_port: 1025
  notify_port: 1026
  start_timeout: 60s
  stop_timeout: 10s
