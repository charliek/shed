# Shed Server — Parallel Dev Configuration (macOS / VZ)
#
# Runs ALONGSIDE the brew-installed `my-server` shed-server on the same
# host. Different ports, different state-dirs (its own state_dir for its
# identity, below), separate images_dir.
# Used by `make dev-server-up` + `make test-integration-dev` for testing
# server-side changes against the developer's source tree without
# restarting (and disrupting) the brew shed-server.
#
# Launch directly:
#   bin/shed-server serve --config configs/server.dev-parallel.mac.yaml
#
# Register it with the CLI once, after the first `make dev-server-up`
# (first contact is over SSH, which enrols a client certificate):
#   shed server add localhost --ssh-port 12222 --name my-server-dev
#
# See docs/development/testing.md for the full workflow.

name: my-server-dev

# Offset from brew's 8080/2222 so both can run simultaneously. http_port is
# not served in mtls mode; it is kept so a reconfigured open-mode run
# (tests/integration/fixtures/devcontrol.py: dev_config) stays off 8080.
http_port: 18080
ssh_port: 12222
# The mtls listener (the only one serving clients); offset from brew's 8443.
https_port: 18443

# Loopback (also the v0.7.4 default) — the suite drives this dev server over
# localhost, so it stays on-box. Set explicitly to document intent.
bind_address: 127.0.0.1

default_backend: vz
log_level: debug

# mtls, the one enforced mode shed-server has; the dev servers and the
# integration suite run it. The shed-mobile app key is allowlisted so the
# mobile client can enrol too.
auth:
  mode: mtls
  ssh:
    github_users: [charliek]
    authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBaqTm38OGnpaLoZdZGDEBupr/2C0lcFmdcxevD+wUJI shed-mobile

# The dev server's OWN identity directory: its SSH host key (host_key), TLS
# certificate and key (tls_cert.pem, tls_key.pem), the mtls client CA
# (ca_cert.pem, ca_key.pem), the user-list upgrade marker (users-upgrade.json),
# the GitHub account-id pins (github_pins.json) and the GitHub key cache
# (github_keys/). Without it the dev server resolves the default, ~/.shed --
# the brew-installed server's directory on the same Mac -- and shares its host
# key and TLS pin, signs client certificates with its CA, and removes or writes
# its upgrade marker and pins. It sits in ~/.shed/dev/ (the dev targets'
# scratch area) and NOT under the blob directories in the vz block below, so
# SHED_DEV_STATE_DIR, which moves those to another volume, never moves it.
# shed-server creates it (mode 0700) on first start. The first start with it
# makes a new host key, TLS certificate and client CA: re-add the
# my-server-dev CLI entry once (docs/development/testing.md).
state_dir: ~/.shed/dev/state

# LOCAL (uncommitted) mounts for mobile testing so agent logins persist across
# dev-server sheds. CAVEAT: these are the SAME host dirs the brew server
# mounts — do not run a brew shed and a dev shed that both actively use the
# same tool at the same time (concurrent writers to one host dir).
mounts:
  claude:
    source: ~/.shed/mounts/claude
    target: /home/shed/.claude
    readonly: false
  codex:
    source: ~/.shed/mounts/codex
    target: /home/shed/.codex
    readonly: false
  opencode_data:
    source: ~/.shed/mounts/opencode/share
    target: /home/shed/.local/share/opencode
    readonly: false
  opencode_state:
    source: ~/.shed/mounts/opencode/state
    target: /home/shed/.local/state/opencode
    readonly: false
  gh:
    source: ~/.shed/mounts/gh
    target: /home/shed/.config/gh
    readonly: false
  # Linux cursor-agent tokens live OUTSIDE ~/.cursor, in ~/.config/cursor — mount
  # ONLY this. That much is a fact about cursor and still holds.
  #
  # The reason for the "ONLY" is gone, in two steps. The rc hub's cursor preseed
  # wrote a hook relay into ~/.cursor/hooks.json and skipped that write whenever
  # ~/.cursor sat on a different device than $HOME, so mounting ~/.cursor here
  # used to silently kill the hook feed. That preseed (internal/ext/rc/
  # preseed_cursor.go) went in plan 014 with the cursor lane (c5e1012); the hub
  # that hosted it went in plan 022/S6 (shed#328). Nothing breaks today if
  # ~/.cursor is mounted — but nothing needs it either, and a narrower mount is
  # the better default, so this is kept as-is rather than widened on the
  # strength of a rationale that no longer applies.
  cursor_config:
    source: ~/.shed/mounts/cursor-config
    target: /home/shed/.config/cursor
    readonly: false

# Intentionally NO extensions block: dev sheds enable no guest extensions.

vz:
  vfkit_path: vfkit

  # Pin to the latest release's images so the dev binary uses the
  # release-shaped upper-template fast path (sub-100 ms rootfs phase).
  # Bump in lockstep with shed releases; see docs/reference/images.md.
  default_image: ghcr.io/charliek/shed-vz-full:v0.8.0
  image_aliases:
    base: ghcr.io/charliek/shed-vz-base:v0.8.0
    full: ghcr.io/charliek/shed-vz-full:v0.8.0
  pull_policy: missing

  # Separate state-dirs under `shed-dev/` so prune from the brew server
  # never touches the dev server's blobs (the v0.5.7 prune behavior
  # walks ONLY the configured server's instance_dir + snapshots_dir).
  images_dir:    ~/Library/Application Support/shed-dev/vz
  instance_dir:  ~/Library/Application Support/shed-dev/vz/instances
  snapshots_dir: ~/Library/Application Support/shed-dev/vz/snapshots
  uppers_dir:    ~/Library/Application Support/shed-dev/vz/uppers
  socket_dir:    ~/.shed-dev/vz/sockets

  default_cpus: 2
  default_memory_mb: 4096
  default_disk_gb: 20
  console_port: 1024
  notify_port: 1026
  tcp_proxy_port: 1028
  start_timeout: 60s
  stop_timeout: 10s
