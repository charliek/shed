# Shed Server — Parallel Dev Configuration (macOS / VZ)
#
# Runs ALONGSIDE the brew-installed `my-server` shed-server on the same
# host. Different ports, different state-dirs, separate images_dir.
# Used by `make dev-server-up` + `make test-integration-dev` for testing
# server-side changes against the developer's source tree without
# restarting (and disrupting) the brew shed-server.
#
# Launch directly:
#   bin/shed-server serve --config configs/server.dev-parallel.mac.yaml
#
# Add this entry to ~/.shed/config.yaml so the CLI can reach it:
#   servers:
#     my-server-dev:
#       host: localhost
#       http_port: 18080
#       ssh_port: 12222
#
# See docs/development/testing.md for the full workflow.

name: my-server-dev

# Offset from brew's 8080/2222 so both can run simultaneously.
http_port: 18080
ssh_port: 12222
# Token-mode TLS listener; offset from brew's default 8443.
https_port: 18443

# Loopback (also the v0.7.4 default) — the suite drives this dev server over
# localhost, so it stays on-box. Set explicitly to document intent.
bind_address: 127.0.0.1

default_backend: vz
log_level: debug

# LOCAL (uncommitted) mobile-testing overrides: token mode + the shed-mobile
# app key so the pinned-HTTPS mobile client can mint tokens and connect.
auth:
  mode: token
  ssh:
    github_users: [charliek]
    authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBaqTm38OGnpaLoZdZGDEBupr/2C0lcFmdcxevD+wUJI shed-mobile

# LOCAL (uncommitted) mounts for mobile testing so agent logins persist across
# dev-server sheds. CAVEAT: these are the SAME host dirs the brew server
# mounts — do not run a brew shed and a dev shed that both actively use the
# same tool at the same time (concurrent writers to one host dir).
mounts:
  claude:
    source: ~/.shed/mounts/claude
    target: /home/shed/.claude
    readonly: false
  codex:
    source: ~/.shed/mounts/codex
    target: /home/shed/.codex
    readonly: false
  opencode_data:
    source: ~/.shed/mounts/opencode/share
    target: /home/shed/.local/share/opencode
    readonly: false
  opencode_state:
    source: ~/.shed/mounts/opencode/state
    target: /home/shed/.local/state/opencode
    readonly: false
  gh:
    source: ~/.shed/mounts/gh
    target: /home/shed/.config/gh
    readonly: false
  cursor:
    source: ~/.shed/mounts/cursor
    target: /home/shed/.cursor
    readonly: false
  # Linux cursor-agent tokens live OUTSIDE ~/.cursor:
  cursor_config:
    source: ~/.shed/mounts/cursor-config
    target: /home/shed/.config/cursor
    readonly: false

# Intentionally NO extensions block:
#   Same reason as credentials. Dev sheds don't need
#   ssh-agent / docker-credentials brokering.

vz:
  vfkit_path: vfkit

  # Pin to the latest release's images so the dev binary uses the
  # release-shaped upper-template fast path (sub-100 ms rootfs phase).
  # Bump in lockstep with shed releases; see docs/reference/images.md.
  default_image: ghcr.io/charliek/shed-vz-full:v0.8.0
  image_aliases:
    base: ghcr.io/charliek/shed-vz-base:v0.8.0
    extensions: ghcr.io/charliek/shed-vz-extensions:v0.8.0
    full: ghcr.io/charliek/shed-vz-full:v0.8.0
  pull_policy: missing

  # Separate state-dirs under `shed-dev/` so prune from the brew server
  # never touches the dev server's blobs (the v0.5.7 prune behavior
  # walks ONLY the configured server's instance_dir + snapshots_dir).
  images_dir:    ~/Library/Application Support/shed-dev/vz
  instance_dir:  ~/Library/Application Support/shed-dev/vz/instances
  snapshots_dir: ~/Library/Application Support/shed-dev/vz/snapshots
  uppers_dir:    ~/Library/Application Support/shed-dev/vz/uppers
  socket_dir:    ~/.shed-dev/vz/sockets

  default_cpus: 2
  default_memory_mb: 4096
  default_disk_gb: 20
  console_port: 1024
  notify_port: 1026
  tcp_proxy_port: 1028
  start_timeout: 60s
  stop_timeout: 10s
