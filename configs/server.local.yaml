# Shed Server Development Configuration
#
# Use this for local development and testing:
#   shed-server serve --config ./configs/server.dev.yaml

name: localhost-dev

http_port: 8080
ssh_port: 2222

default_image: shed-base:latest

credentials:
  # Claude Code - credentials and settings
  claude:
    source: /home/charliek/.shed/mounts/claude
    target: /home/shed/.claude
    readonly: false
    exclude:
      - "debug/*"
      - "file-history/*"
      - "plans/*"
      - "backups/*"
      - "cache/*"
      - "tasks/*"
      - "todos/*"
      - "paste-cache/*"
      - "shell-snapshots/*"
      - "session-env/*"
      - "downloads/*"
      - "telemetry/*"

  # Codex CLI - credentials and config
  codex:
    source: /home/charliek/.shed/mounts/codex
    target: /home/shed/.codex
    readonly: false
    exclude:
      - "sessions/*"
      - "archived_sessions/*"
      - "vendor_imports/*"
      - "log/*"
      - "tmp/*"
      - "shell_snapshots/*"
      - "sqlite/*"
      - "*.sqlite"
      - "*.sqlite-shm"
      - "*.sqlite-wal"
      - "models_cache.json"

  # OpenCode - data and state directories
  opencode_data:
    source: /home/charliek/.shed/mounts/opencode/share
    target: /home/shed/.local/share/opencode
    readonly: false
    exclude:
      - "*.db"
      - "*.db-shm"
      - "*.db-wal"
      - "log/*"
      - "storage/*"

  opencode_state:
    source: /home/charliek/.shed/mounts/opencode/state
    target: /home/shed/.local/state/opencode
    readonly: false

  # Disabled - ephemeral cache that auto-regenerates on first opencode launch
  # opencode_cache:
  #   source: /home/charliek/.shed/mounts/opencode/cache
  #   target: /home/shed/.cache/opencode
  #   readonly: false

  # GitHub CLI - credentials and config
  gh:
    source: /home/charliek/.shed/mounts/gh
    target: /home/shed/.config/gh
    readonly: false

# Environment file with GIT_SSH_COMMAND for SSH key access
env_file: /home/charliek/.shed/env

# Debug logging for development
log_level: debug

enabled_backends:
  - docker
  - firecracker
default_backend: firecracker

firecracker:
  base_rootfs: ghcr.io/charliek/shed-fc-base:v0.1.0
  instance_dir: /var/lib/shed/firecracker/instances
  socket_dir: /var/run/shed/firecracker
  default_cpus: 2
  default_memory_mb: 4096
  default_disk_gb: 20
  vsock_base_cid: 100
  console_port: 1024
  health_port: 1025
  notify_port: 1026
  start_timeout: 30s
  stop_timeout: 10s
  bridge_name: shed-br0
  bridge_cidr: 172.30.0.1/24
  tap_prefix: shed-tap
