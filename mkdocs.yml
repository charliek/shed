# =============================================================================
# Documentation Style Guidelines
# =============================================================================
# - Professional, direct tone (no marketing language)
# - Tables for all CLI options and configuration fields
# - Code blocks with language hints (yaml, bash, json, go)
# - Use admonitions sparingly (only for important notes/warnings)
# - Examples should be copy-pasteable
# - Keep pages focused and concise - one topic per page
# - No deep troubleshooting guides - keep it minimal but useful
# =============================================================================

site_name: shed
site_description: 'Lightweight tool for managing persistent, containerized development environments'
site_author: 'shed Contributors'
site_url: 'https://charliek.github.io/shed/'

repo_name: charliek/shed
repo_url: https://github.com/charliek/shed
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site-build

dev_addr: '127.0.0.1:7070'

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.share
    - header.autohide
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.footer
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/server

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/quick-start.md
      - macOS Quickstart: getting-started/macos-quickstart.md
      - Linux Quickstart: getting-started/linux-quickstart.md
      - Developer Setup:
          - macOS (VZ): getting-started/vz-setup.md
          - Firecracker (Linux): getting-started/fc-setup.md
      - Upgrades:
          - v0.4 → v0.5: upgrades/v0.4-to-v0.5.md
          - v0.5.1 → v0.5.2: upgrades/v0.5.1-to-v0.5.2.md
          - v0.5.7 → v0.5.8: upgrades/v0.5.7-to-v0.5.8.md
          - v0.6 → v0.7: upgrades/v0.6-to-v0.7.md
          - v0.7.0 → v0.7.1: upgrades/v0.7.0-to-v0.7.1.md
  - Tutorials:
      - Build Your Own Image: tutorials/build-your-own-image.md
      - Provisioning a Gradle Project: tutorials/gradle-provisioning.md
      - Provisioning a TypeScript Project: tutorials/typescript-provisioning.md
      - Provisioning a Python Project: tutorials/python-provisioning.md
  - Guides:
      - Security Configuration: guides/security-configuration.md
      - Public VPS Deployment: guides/vps-deployment.md
  - Reference:
      - CLI: reference/cli.md
      - Configuration: reference/configuration.md
      - Security: reference/security.md
      - Egress Control: reference/egress.md
      - Snapshots: reference/snapshots.md
      - Disk Management: reference/disk-management.md
      - Storage Model: reference/storage-model.md
      - Tunnels: reference/tunnels.md
      - File Sync: reference/sync.md
      - Provisioning: reference/provisioning.md
      - Firecracker Operations: reference/fc-operations.md
      - VZ Operations (macOS): reference/vz-operations.md
      - Images: reference/images.md
      - Build Tools: reference/build-tools.md
      - Extensions: reference/extensions.md
      - HTTP API: reference/api.md
  - Discovery:
      - Lazy Rootfs Streaming: discovery/lazy-rootfs-streaming.md
      - Proxy Integration: discovery/proxy_integration_design.md
      - Runtime Optimization Backlog: discovery/runtime-optimization-backlog.md
  - Development:
      - Setup: development/setup.md
      - Testing: development/testing.md
      - Architecture: development/architecture.md
      - In-shed Build Debugging: development/in-shed-build-debugging.md
  - Roadmap: ROADMAP.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/charliek/shed
