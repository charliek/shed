[package]
name = "shed-broker-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "shed-broker-harness — a TEST-ONLY process that hosts the desktop app's embedded credential broker (shed-app's `broker` feature) for the wire harness under tests/host-agent-diff. It ships in no release: no goreleaser config, bundle script, deb or workflow builds it, and `tests/not_shipped.rs` fails if any crate depends on it or it becomes a default member."

[[bin]]
name = "shed-broker-harness"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The app's embedded broker, exactly as the desktop app links it. This crate is a
# workspace member but NOT a default member: a plain `cargo build`/`cargo test`
# must not turn on shed-app's `broker` feature for the whole workspace through
# feature unification.
shed-app = { path = "../shed-app", features = ["broker"] }
# The status snapshot builder and the log sink the bridge takes.
shed-broker = { path = "../shed-broker" }
# The approval frames the bridge sends and the decision types it takes.
shed-core = { path = "../shed-core" }
tokio = { workspace = true, features = ["net", "io-util", "signal", "sync", "time", "rt-multi-thread", "macros"] }
serde_json = { workspace = true }

[dev-dependencies]
# Throwaway control-socket directories for the control-server tests.
tempfile = "3"
