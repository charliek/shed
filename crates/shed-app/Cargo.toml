[package]
name = "shed-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "shed-app — the display-free shed-server application layer (Backend, AuthModeRegistry). Desktop-only; zero roost-ipc, zero shed-lane."

[lib]
name = "shed_app"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
shed-core = { path = "../shed-core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
# The `tracing` facade only — used for config-refusal warnings in `backend.rs`.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Concurrent per-host list_sheds via futures::future::join_all.
futures = "0.3"
# Flexible ISO-8601 parse/format (`timefmt`). `clock` disabled: no
# iana-time-zone/libc pull.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
httpmock = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["net"] }
