[package]
name = "shed-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "shed-app — the display-free app-logic layer (the shed-core-backed Backend + pull create store) shared by the GTK and Tauri clients (and, later, the Swift app via FFI). No UI or env-prefix coupling; depends only on the pure shed-core protocol crate."

[lib]
name = "shed_app"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
shed-core = { path = "../shed-core" }
# The embeddable broker core — ONLY under the non-default `broker` feature (leg 3a.2).
# It carries the heavy leaf deps (aws-sdk-*/notify/saphyr-parser); keeping it optional
# means a default `shed-app` (and the mac FFI build) never links them.
shed-broker = { path = "../shed-broker", optional = true }
# The graduated one-shot RC engine (plan 010 H2) — ONLY under the non-default `rc`
# feature; `lib.rs` re-exports it as `shed_app::rc_engine` so the desktop keeps
# its pre-graduation paths.
shed-rc-engine = { path = "../shed-rc-engine", optional = true }
# `net` (UnixStream) + `io-util` (buffered line reader) for the host-agent UDS
# client, on top of the workspace's rt/macros/sync/time.
tokio = { workspace = true, features = ["net", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
# roost's SSH client-bridge transport + the `messages` params/results the roost
# one-shots take and return (`roost.rs`). Rev-pinned in the workspace manifest —
# see the long comment there.
roost-ipc = { workspace = true }
# The `tracing` FACADE only — no subscriber, no `tracing-subscriber`. The roost
# observer loop has two things worth saying that are neither an `Err` nor an
# update (a resync, and somebody else taking the interactive lease), and a
# `println!` from a library the desktop and mobile both link is not an option.
# Adds no crate to the lock: `roost-ipc` already brings the same facade into
# this crate's graph, so a client that installs no subscriber pays nothing.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Concurrent per-host list_sheds via futures::future::join_all.
futures = "0.3"
# Flexible ISO-8601 parse/format for approval expiry + wire `ts` (Swift's
# DateFormatting). `clock` disabled — "now" comes from the injectable Clock seam,
# not chrono, so no iana-time-zone/libc pull.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# getpeereid(2) for the host-agent socket peer-UID check (A1 — the server must
# run as us). Unix-only; the clients are Unix (Linux + macOS).
libc = "0.2"

[features]
# The Remote-Control layer: `rc.rs` (process/SSH spawning via `tokio/process`)
# plus the graduated engine crate re-exported as `rc_engine`. NON-default so a
# featureless consumer of `shed-app` (e.g. the mac FFI build, which has no RC
# pane) never compiles either; the Tauri client enables it. `make test` must
# pass `--features rc` or the rc unit tests are cfg'd out.
rc = ["dep:shed-rc-engine", "tokio/process"]
# The engine's test doubles (`rc_engine::fake` — the fake tmux runner + the env
# table), reachable through this crate's re-export for a consumer of
# `shed_app::rc_engine`. Its one consumer was `sx`'s dispatch tests, so since
# the plan 016 sunset NOTHING enables this feature; it is left in place because
# the `rc` surface it belongs to is S6's to demolish (charliek/shed#328), and
# removing a feature nobody enables is churn either way.
# Forwards to the graduated crate's feature (the `?` keeps the dep optional —
# enabling test-support alone must not drag the engine in without `rc`).
# NON-default and named `test-support` so it is unmistakable: a consumer enabling
# it in `[dependencies]` (rather than `[dev-dependencies]`) is doing it wrong —
# the module is `#[cfg]`'d in only under `test` or this feature, so a shipped
# binary never carries it.
test-support = ["shed-rc-engine?/test-support"]
# The in-process broker bridge (`broker_bridge.rs`): the embedded host-agent replacement
# backed by `shed-broker`. NON-default (mirrors `rc`) so a featureless `shed-app` stays
# broker-free — `cargo test --features broker` runs its unit tests.
broker = ["dep:shed-broker"]

[dev-dependencies]
httpmock = { workspace = true }
# Temp dirs/sockets for the `broker` bridge tests (config synthesis + the mode-detect
# UDS matrix) and the roost reach tests (the fake-`ssh` scratch dir). Dev-only —
# never in the default lib dep graph.
tempfile = "3"
# shed-core's in-process fake roost-session (`roost::testing::FakeRoost`), exposed
# by its test-only `test-support` feature. A dev-dependency (resolver v2) so the
# feature is enabled for `cargo test -p shed-app` and NEVER for a shipped build —
# the same resolver-v2 dev-dependency-only pattern this crate's own `test-support`
# forwarding above uses for `rc_engine::fake`.
shed-core = { path = "../shed-core", features = ["test-support"] }
