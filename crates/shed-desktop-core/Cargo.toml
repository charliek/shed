[package]
name = "shed-desktop-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
shed-core = { path = "../shed-core" }
shed-lane = { path = "../shed-lane" }
shed-roost = { path = "../shed-roost" }
shed-craze = { path = "../shed-craze" }
shed-app = { path = "../shed-app" }
# Plan 039: the source's answers are built from delivery.toml's providers
# (the runtime that serves them is A6's). Neither crate reaches another
# workspace crate but shed-provision.
shed-provision = { path = "../shed-provision" }
shed-provision-providers = { path = "../shed-provision-providers" }
# The source runtime (plan 039 A6): the delivery stream client, the per-server
# tasks, discovery from the shed CLI config, this machine's identity and the
# credential store. No YAML parser (isolation rule 6).
shed-source = { path = "../shed-source" }
# The disk reader's non-blocking open and the command runner's kill.
libc = "0.2"
async-trait.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "process", "io-util", "macros"] }
# The `tracing` facade only (no subscriber).
tracing = { version = "0.1", default-features = false, features = ["std"] }
uuid.workspace = true

[dev-dependencies]
# The cold-launch mint test (`control_mint_tests.rs`): the bootstrap seam
# (`test-support`), an in-process mTLS server and its throwaway CA.
shed-source = { path = "../shed-source", features = ["test-support"] }
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
base64 = { workspace = true }
shed-roost = { path = "../shed-roost", features = ["test-support"] }
shed-lane = { path = "../shed-lane", features = ["test-support"] }
shed-craze = { path = "../shed-craze", features = ["test-support"] }
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "process", "sync"] }
