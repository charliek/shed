[package]
name = "shed-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `net` (UnixStream/TcpStream) + `io-util` (`copy_bidirectional` for the loopback-TCP
# pump in `roost::conn`) + `process` (the local `roost-session identify` the bootstrap
# source ladder's sibling rung runs, `roost::bootstrap::source`) on top of the
# workspace's rt/macros/sync/time. These are BUILD-time features now, not just
# dev-time: `roost::conn` and `roost::bootstrap` need them in the shipped lib.
# `process` is ALSO unified in by `roost-ipc`, so naming it here adds no crate to
# the lock — it is named because shed-core calls `tokio::process` directly, and a
# feature a crate depends on by unification is a feature that disappears the day
# the dependency stops needing it. Unification with `roost-ipc` still supplies
# `fs` and `signal`, which shed-core does not use itself.
tokio = { workspace = true, features = ["net", "io-util", "process"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
# Pane classifier + claude.ai URL extraction for the RC module (rc.rs). Already
# in the workspace lock tree (via httpmock), so no new crates are pulled.
regex = "1"
# The roost IPC wire (`roost` module). Git, rev-pinned — see the long comment on
# the workspace dependency in ../Cargo.toml for why the rev lives in a manifest.
roost-ipc = { workspace = true }
# `getuid(2)` for the `/tmp/roost-session-<uid>` socket fallback (`roost::paths`).
# Already in the tree via roost-ipc; named here because we call it directly.
libc = "0.2"

[features]
# The in-process fake roost-session (`roost::testing`) exported for ANOTHER crate's
# tests — `shed-app`'s roost watcher/reach tests. NON-default and named
# `test-support` so it is unmistakable: the module is `#[cfg]`'d in only under
# `test` or this feature, so a shipped binary never carries it. Mirrors the same
# feature on `shed-app` / `shed-rc-engine`.
test-support = []

[dev-dependencies]
httpmock = { workspace = true }
# The in-process mtls test server (src/testtls.rs): a real rustls listener that
# demands a client certificate, plus a raw-socket alert emitter used to derive
# the auth-failure classifier's error shapes empirically. Test-only — resolver
# v2 keeps these features out of the shipped build.
tokio-rustls = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
