[package]
name = "shed-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "shed-core — pure Rust shed-server protocol client, TLS/mTLS auth, config reader, and wire DTOs. Zero roost-ipc, zero machines:."

[lints]
workspace = true

[dependencies]
shed-lane = { path = "../shed-lane" }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
# TLS fingerprint validation (`token.rs`).
regex = "1"
# `O_NONBLOCK` FIFO guard (`identityfile.rs`).
libc = "0.2"

[dev-dependencies]
httpmock = { workspace = true }
# The in-process mtls test server (src/testtls.rs): a real rustls listener that
# demands a client certificate, plus a raw-socket alert emitter used to derive
# the auth-failure classifier's error shapes empirically. Test-only — resolver
# v2 keeps these features out of the shipped build.
tokio-rustls = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
