[package]
name = "shed-provision"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "shed-provision — the provision contract's documents and validation (tests/provision-contract/v1), the Provider and Reader traits, the only rules, the answer builder, fingerprints and redacted previews. No workspace crate, no tokio, no reqwest, and no file or process access of its own."

[lib]
name = "shed_provision"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# Contract content: padded standard base64 with zero padding bits.
base64 = { workspace = true }
# Fingerprints: HMAC-SHA256 under a key the caller keeps.
sha2 = { workspace = true }
hmac = { workspace = true }
# The redacted preview is handed to a shell as JSON.
serde = { workspace = true }
