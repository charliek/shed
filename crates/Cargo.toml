# shed Rust workspace — isolated pure-Rust client crates.
# Conventions mirror ../roost (workspace, lints, release profile). Consumed by the
# Tauri client (its own standalone workspace in ../desktop/tauri/src-tauri) and by
# shed-mobile (via FRB).
[workspace]
resolver = "2"
members = [
    "shed-lane",
    "shed-core",
    "shed-roost",
    "shed-craze",
    "shed-app",
    "shed-desktop-core",
    "shedctl",
    "shed-broker",
    "shed-broker-harness",
    "shed-provision",
    "shed-provision-providers",
]
# Every member but `shed-broker-harness` (below) is a default member: a plain
# `cargo build` / `cargo test` (and `make core-test`) builds every other crate
# here. shedctl (the headless CLI driver for the shed-desktop IPC socket) has
# no GUI-toolkit dependency, so it gets Mac `cargo test` coverage too. The Tauri
# client (WebKitGTK) lives in its OWN workspace so its heavy deps never enter
# this one.
#
# Crate boundaries (plan 038 D1, enforced by `shed-core/tests/crate_isolation.rs`):
#   - `shed-lane`: pure leaf (agent-lane contract, RC DTOs, craze argv ladder,
#     lane_view, slash_menu, craze_rows, backoff, shell_quote, time). Zero
#     shed-core, zero roost-ipc, zero reqwest, zero chrono.
#   - `shed-core`: pure shed-server protocol client, TLS/mTLS auth, config
#     reader (servers: only), wire DTOs. Depends on `shed-lane`; zero roost-ipc.
#   - `shed-roost`: the SOLE direct `roost-ipc` consumer in `crates/` (roost
#     client/model/bootstrap/reach/spawn_gate/ssh_endpoint).
#   - `shed-craze`: craze agent-lane adapter over NDJSON JSON-RPC. Depends on
#     `shed-lane` only; zero shed-core, zero roost-ipc, zero reqwest, zero chrono.
#   - `shed-app`: desktop-only shed-server app layer (Backend, Coordinator,
#     AuditStore, AuthModeRegistry, optional EmbeddedBroker). Zero roost-ipc,
#     zero shed-lane.
#   - `shed-desktop-core`: toolkit-free shed-only desktop runtime (ShedId,
#     ShedHosts, ShedCraze, ShedLanes, slash, shutdown). Uses default-features
#     `shed-app` ONLY (never `broker`), zero GUI toolkits, zero direct roost-ipc.
#   - `shed-provision` (plan 039): the provision contract's documents and
#     rules, the Provider/Reader traits, the answer builder. Zero workspace
#     crates, zero tokio/reqwest, no file or process access of its own.
#   - `shed-provision-providers`: the five providers and delivery.toml.
#     Depends on `shed-provision` only; no YAML parser.
#
# The opencode adapter crate (plan 015) was removed in plan 038 — craze is the sole agent
# lane. `shed-gx` (plan 017) was retired in plan 025; `sx` and `shed-rc-engine`
# were retired in plans 016 and 022.
#
# `shed-broker-harness` (plan 037) is a member but NOT a default member: a
# TEST-ONLY binary that hosts the desktop app's embedded broker for the wire
# harness (tests/broker-wire). It builds shed-app with `broker`, so were it a
# default member, a plain `cargo build`/`cargo test` would turn that feature on
# for the whole workspace by feature unification and hide dead code in the
# default build. Name it with `-p`; `make -C desktop core-lint` lints it on its
# own leg. It ships in no release (its `tests/not_shipped.rs`).
default-members = [
    "shed-lane",
    "shed-core",
    "shed-roost",
    "shed-craze",
    "shed-app",
    "shed-desktop-core",
    "shedctl",
    "shed-broker",
    "shed-provision",
    "shed-provision-providers",
]

[workspace.package]
version = "0.10.1"
edition = "2021"
# 1.97 is `roost-ipc`'s own MSRV (roost's `[workspace.package] rust-version`);
# this workspace cannot claim to build on less than what its dependency needs.
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
needless_collect = "warn"
needless_pass_by_value = "warn"

[workspace.dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
futures-util = "0.3"
async-trait = "0.1"
# rustls with the ring provider to match reqwest's rustls-tls stack (so cargo
# unifies one provider); used for the leaf-cert pinning verifier.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
# HMAC over sha2 0.10 (shed-provision's fingerprints); 0.12 is the line that
# matches sha2 0.10's digest, and is already in both lock trees.
hmac = "0.12"
# delivery.toml (shed-provision-providers), read as toml's spanned document
# (`toml::de::DeTable`) so every settings error is located without quoting
# the file. Pure Rust; the TOML reader, not a YAML one: saphyr-parser stays
# confined to shed-broker.
toml = { version = "1", default-features = false, features = ["std", "parse"] }
uuid = { version = "1", features = ["v4"] }
httpmock = "0.7"
# Client-certificate enrollment (shed-core's `csr` module): P-256 keypair + CSR
# generation, pure Rust on the ring backend rustls already pulls in.
# `default-features = false` + `ring` deliberately omits rcgen's `pem` (its own
# base64 wrapper — shed-core encodes PEM itself) and never enables `aws_lc_rs`
# (a C/asm stack that must not enter this dependency-clean workspace).
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
# Standard-alphabet base64 for the CSR request argument and PEM bodies. Already
# in the lock tree (reqwest/httpmock); no new transitive surface.
base64 = "0.22"
# Test-only TLS listener for the in-process mtls server tests.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The roost IPC wire (plan 013 / the Roost Pivot): `IpcClient`, `EventStream`, the
# `messages` structs, and the `ssh` transport. The ONE git dependency in this
# workspace, and it is **rev-pinned in the manifest on purpose**: shed-mobile
# consumes `shed-roost` as a git dependency, and cargo does not inherit a
# dependency's lockfile — a `branch = "main"` pin here would let mobile resolve
# whatever `main` happened to be on the day its own lock was regenerated, against
# a crate that publishes NO Rust-API stability promise (roost
# `docs/reference/ipc-compatibility.md`; the pin is what absorbs that). With the
# rev in the manifest, mobile's lock cannot disagree, so
# `shed-mobile/scripts/check-lock-rev.sh` needs no change.
#
# Bump recipe: edit `rev` here, run `cargo update -p roost-ipc`, commit both this
# file and `Cargo.lock`. Re-read roost's `ipc-compatibility.md` on any bump that
# crosses a `SESSION_PROTOCOL_VERSION` change — `Conn::session_identify` refuses a
# mismatch by name rather than limping.
roost-ipc = { git = "https://github.com/charliek/roost", rev = "2bc71fa3848ddbf2d190aab6c4ef61ad2d432aa1" }

# **The dev profile is TUNED** (plan 012), because the default is expensive here
# in a way that shows up as failed builds rather than slow ones: a full debug
# build of this workspace ran to 18G, and a machine at 98% disk cannot link.
#
# Measured on a clean `cargo build -p shed-core --tests`, default vs this:
#
#   clean build   20.0s -> 15.5s   (-22%)
#   target size    965M ->  645M   (-33%)
#   test wall      5.17s -> 3.31s  (-36%, smaller binaries link and load faster)
#   incremental    1.09s -> 1.09s  (unchanged — the dev loop is not affected)
#
# Better on every axis, so there is no trade being made. What is GIVEN UP is
# variable inspection in a debugger; `line-tables-only` keeps function names and
# `file:line` in panics and backtraces, which is what this repo actually debugs
# with (verified: a failing assert still reports `file.rs:line:col` with a
# symbolized backtrace).
#
# Deliberately NOT `opt-level = 2` for dependencies: it saves a further 55M but
# costs ~35s on every clean build, `cargo update`, and toolchain bump. The
# test-runtime win above is link/load, not compute — in-test time was identical
# — so optimizing deps buys nothing here.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies are not stepped through; their debug info is pure disk.
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
