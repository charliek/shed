# shed-core Rust workspace — the shared shed-server protocol client + wire DTOs.
# Conventions mirror ../roost (workspace, lints, release profile). Consumed by the
# Swift app via the shed-core-ffi UniFFI wrapper, and by the Tauri client (its own
# standalone workspace in ../tauri/src-tauri) linking shed-core + shed-app directly.
[workspace]
resolver = "2"
members = ["shed-core", "shed-core-ffi", "shed-app", "shedctl", "shed-broker", "shed-host-agent", "sx"]
# All members are default members: a plain `cargo build` / `cargo test` (and
# `make core-test`) build shed-core + shed-core-ffi + shed-app + shedctl. shedctl
# (the headless Linux CLI driver for the shed-desktop IPC socket) has no GUI-toolkit
# dependency, so it gets Mac `cargo test` coverage too; the Mac bundle is unaffected
# (build-core.sh is `-p shed-core-ffi`-scoped). The Tauri client (WebKitGTK) lives
# in its OWN workspace so its heavy deps never enter this one.
#
# `sx` (the RC porcelain, plan 009) is a member AND a default member: it is a
# plain CLI on shed-core + shed-app, so it belongs in every workspace-wide build
# and test. It enables shed-app's non-default `rc` feature itself, which is why
# `cargo build -p sx` (the parity harness's build step) needs no extra flags.
default-members = ["shed-core", "shed-core-ffi", "shed-app", "shedctl", "shed-broker", "shed-host-agent", "sx"]

[workspace.package]
version = "0.8.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
needless_collect = "warn"
needless_pass_by_value = "warn"

[workspace.dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
futures-util = "0.3"
uniffi = "0.28"
async-trait = "0.1"
# rustls with the ring provider to match reqwest's rustls-tls stack (so cargo
# unifies one provider); used for the leaf-cert pinning verifier.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
httpmock = "0.7"
# Client-certificate enrollment (shed-core's `csr` module): P-256 keypair + CSR
# generation, pure Rust on the ring backend rustls already pulls in.
# `default-features = false` + `ring` deliberately omits rcgen's `pem` (its own
# base64 wrapper — shed-core encodes PEM itself) and never enables `aws_lc_rs`
# (a C/asm stack that must not enter this dependency-clean workspace).
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
# Standard-alphabet base64 for the CSR request argument and PEM bodies. Already
# in the lock tree (reqwest/httpmock); no new transitive surface.
base64 = "0.22"
# Test-only TLS listener for the in-process mtls server tests.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
