# shed config — the parity fixture for the Rust `shed_core::config` parser
# (config.rs), whose `parity_fixture_*` tests pin what it parses from this file.
# Exercises: multiple servers (sorted by name), default_server, a control token
# present + absent, api_url + a mixed-case pin (lowercased), an inline comment,
# an ignored field (added_at), and an inline empty map `{}` (all-defaults).
#
# The `secure` entry additionally carries the mtls credential keys a real entry
# gets once its server runs `auth.mode: mtls` (plan 001 D6), and the `user` the
# CLI records for it — and `mini2`, which omits `auth_mode` and `user` entirely,
# pins the absent-means-token rule and an absent user parsing to "". The `u-*`
# entries pin how a `user` that is not a plain name reads.
#
# The `machines:` block (plan 009 §3.3) is the Rust-owned native-RC-host section:
# a full entry (`localmac`), a defaults-only one (`mini2box` — host falls back to
# the entry name, ssh_port to 22, every optional to absent), and an inline empty
# map (`bare`).
default_server: mini2
servers:
    mini2:
        host: mini2
        http_port: 8080
        ssh_port: 2222
        control_token: shed_control_abc123
        added_at: 2026-05-09T01:44:44.395385-05:00
    secure:
        host: localhost
        http_port: 8080
        ssh_port: 2222
        api_url: https://localhost:8443
        tls_cert_fingerprint: SHA256:AABBCC   # mixed case -> lowercased
        auth_mode: mtls
        client_cert_file: /Users/dev/.shed/creds/secure/client.crt
        client_key_file: /Users/dev/.shed/creds/secure/client.key
        client_cert_expires_at: 2026-07-26T12:00:00Z
        user: pat
    minimal: {}
    # `user` values that are not a plain name (plan 037 §3.2.2). A bare `user:` is no
    # user (""); a nested map is USER_NOT_A_STRING (fail closed, never ""); a list, a
    # flow list or a flow map is a line the reader does not accept, so the whole entry
    # is refused (plan 037 A8: its user is USER_NOT_A_STRING, and it has no host); a
    # number is a scalar kept verbatim, which is no user name either. An unquoted `true`
    # is read as its text, as Go's reader (gopkg.in/yaml.v3 into a string) reads it:
    # the user name `true`, quoted or not.
    u-bare:
        host: ub
        user:
    u-blockmap:
        host: um
        user:
            name: pat
    u-flowlist:
        host: ufl
        user: [pat]
    u-flowmap:
        host: uf
        user: {}
    u-list:
        host: ul
        user:
            - pat
    u-listflat:
        host: ulf
        user:
        - pat
        ssh_port: 2200
    u-number:
        host: un
        user: 5
    u-true:
        host: ut
        user: true
    u-truequoted:
        host: utq
        user: "true"
machines:
    localmac:
        host: localhost
        user: charliek
        ssh_port: 2022
        rc_bin: /opt/homebrew/bin/shed-machine-rc
        known_hosts: /Users/dev/.ssh/known_hosts
    mini2box:
        user: builder
        rc_bin:                      # present-but-empty -> absent (use the default)
    bare: {}
sheds: {}
