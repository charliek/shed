# shed config — shared cross-language parity fixture.
# The Rust `shed_core::config` parser (config.rs) and the Swift `ShedConfig`
# parser (ShedConfig.swift) must produce identical results from this file.
# Exercises: multiple servers (sorted by name), default_server, a control token
# present + absent, api_url + a mixed-case pin (lowercased), an inline comment,
# an ignored field (added_at), and an inline empty map `{}` (all-defaults).
#
# The `secure` entry additionally carries the mtls credential keys a real entry
# gets once its server runs `auth.mode: mtls` (plan 001 D6). The server SET is
# unchanged on purpose: the Swift parser ignores keys it does not model, so its
# ConfigParityTests keep passing byte-for-byte while the Rust parser asserts the
# new fields — and `mini2`, which omits `auth_mode` entirely, pins the
# absent-means-token rule.
#
# The `machines:` block (plan 009 §3.3) is the Rust-owned native-RC-host section:
# a full entry (`localmac`), a defaults-only one (`mini2box` — host falls back to
# the entry name, ssh_port to 22, every optional to absent), and an inline empty
# map (`bare`). The Swift parser does not model the key at all and structurally
# ignores it (unknown top-level keys are just another entry in `top`), so
# ConfigParityTests keeps passing byte-for-byte on the SERVER assertions it owns.
default_server: mini2
servers:
    mini2:
        host: mini2
        http_port: 8080
        ssh_port: 2222
        control_token: shed_control_abc123
        added_at: 2026-05-09T01:44:44.395385-05:00
    secure:
        host: localhost
        http_port: 8080
        ssh_port: 2222
        api_url: https://localhost:8443
        tls_cert_fingerprint: SHA256:AABBCC   # mixed case -> lowercased
        auth_mode: mtls
        client_cert_file: /Users/dev/.shed/creds/secure/client.crt
        client_key_file: /Users/dev/.shed/creds/secure/client.key
        client_cert_expires_at: 2026-07-26T12:00:00Z
    minimal: {}
machines:
    localmac:
        host: localhost
        user: charliek
        ssh_port: 2022
        rc_bin: /opt/homebrew/bin/shed-machine-rc
        known_hosts: /Users/dev/.ssh/known_hosts
    mini2box:
        user: builder
        rc_bin:                      # present-but-empty -> absent (use the default)
    bare: {}
sheds: {}
