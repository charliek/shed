[package]
name = "shed-source"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "shed-source — what a machine needs to be a source (plan 039 §3.7): its identity (`<state>/broker/machine.json`), the state directory, the client-credential store, the SSH-bootstrap minter and the control-token provider (extracted from shed-broker, which re-exports them), and the delivery side: server discovery from the shed CLI config, the delivery stream client, the per-server tasks and a TokenMinter over the control-token provider. Reaches only shed-core, shed-lane and shed-provision; no YAML parser."

[lib]
name = "shed_source"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# The minter's test seams and helpers (a thread-local store root, injected clocks,
# `minter::tests`), for shed-broker's tests, which exercise the bus, supervisor and
# egress consumer against them. Enabled ONLY by shed-broker's `[dev-dependencies]`,
# so it is on in test builds and off in every shipped build (resolver 2 does not
# unify dev-dependency features into a normal build).
test-support = ["dep:tempfile", "dep:rcgen"]

[dependencies]
shed-core = { path = "../shed-core" }
# The provision contract's documents and the delivery stream's framing
# (`stream::EventReader`, `parse_request`, `Answer::to_json`). Pure: no tokio, no
# reqwest, no workspace crate of its own.
shed-provision = { path = "../shed-provision" }
# The delivery stream client (`delivery`): the stream GET and the answer POSTs, on the
# pinned TLS config shed-core builds, presenting the credential source's certificate.
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# process (the bootstrap runner shells `ssh` via tokio::process::Command), io-util
# (its stderr/stdout reads), sync (watch, the source's single flight), time and
# macros (timeouts, select!).
tokio = { workspace = true, features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time"] }
# flock() for the credential store, gethostname() for the machine name, errno codes.
libc = "0.2"
async-trait = { workspace = true }
# machine.json's random id.
uuid = { workspace = true }
# The control-token provider's coalesced (shared) in-flight mint.
futures-util = { workspace = true }
# `rustls::sign::CertifiedKey`, the assembled leaf+key a credential source arms. Same
# version + ring provider as the workspace pin, so cargo unifies one rustls build.
rustls = { workspace = true }
# The minter's `known_hosts` pin pre-check. The ecdsa/p256/p384/p521/rsa/dsa features
# give ssh-key's `known_hosts` parser the same host-key-algorithm coverage as Go's
# `x/crypto/ssh.ParseKnownHosts`; the same feature set as shed-broker's (which also
# signs with it), so cargo unifies one build.
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "ecdsa", "p256", "p384", "p521", "rsa", "dsa", "std"] }
# `test-support` only (see [features]): the helpers build throwaway stores and
# certificates.
tempfile = { version = "3", optional = true }
rcgen = { workspace = true, optional = true }

[dev-dependencies]
# `#[tokio::test(start_paused = true)]` (the minter's refusal backoff on a paused clock);
# `net` + `io-util` for the delivery client's in-process fake server.
tokio = { workspace = true, features = ["test-util", "net", "io-util"] }
tempfile = "3"
# Throwaway client certificates for the credential-store + credential-source tests.
rcgen = { workspace = true }
# The delivery client's mTLS fake (one certificate per stream).
tokio-rustls = { workspace = true }
