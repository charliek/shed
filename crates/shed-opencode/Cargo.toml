[package]
name = "shed-opencode"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "shed-opencode — the opencode adapter for the shed_core::lane agent-lane contract (plan 015). The pure fold lands in C2; the HTTP client, the ring and the reconnecting watcher follow in C3."

[lib]
name = "shed_opencode"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# The contract this crate implements (`shed_core::lane`) plus the transcript row
# type it emits (`shed_core::rc::RcFeedMessage`) and the SSE parser C3's watcher
# reads `GET /event` through.
shed-core = { path = "../shed-core" }
serde = { workspace = true }
# `raw_value` (feature-only, no new deps), for the same reason shed-broker's
# rc_hub takes it: the fold keeps a tool call's `input` as raw bytes so the
# compact-JSON detail preserves the producer's key order, and keeps an
# approval's `properties` verbatim for `LaneApproval::request_json`. A decoded
# `Value` would re-sort object keys and diverge from the hub's feed rows.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
# `net` on top of the workspace's rt-multi-thread/macros/sync/time: C3's
# `FakeOpencode` binds a loopback `TcpListener`.
tokio = { workspace = true, features = ["net"] }
reqwest = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
# The fold's time currency: opencode stamps epoch-millis, the feed row carries
# RFC3339 (`opencode_ts`). Same minimal pin (and same reason) as shed-app's and
# shed-broker's — `std` only, no `clock`/`oldtime`, so no iana-time-zone pull.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# NOT in plan 015 §3.2's dependency list, and required by it: the copied
# `sanitize_last_message` helper IS the hub's ANSI-escape stripper
# (`messages.rs:376`'s `ANSI_ESCAPE_RE`), which is a `regex`. Same pin as
# shed-core's and shed-broker's, and already in this workspace's lock — it
# already reaches this crate transitively through shed-core.
regex = "1"

[dev-dependencies]
# `rt` (the current-thread runtime) for the async tests; the lib itself only
# needs the workspace features plus `net`.
tokio = { workspace = true, features = ["rt"] }
