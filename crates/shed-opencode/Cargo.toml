[package]
name = "shed-opencode"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "shed-opencode — the opencode adapter for the shed_core::lane agent-lane contract (plan 015). The pure fold lands in C2; the HTTP client, the ring and the reconnecting watcher follow in C3."

[lib]
name = "shed_opencode"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# The contract this crate implements (`shed_core::lane`) plus the transcript row
# type it emits (`shed_core::rc::RcFeedMessage`) and the SSE parser C3's watcher
# reads `GET /event` through.
shed-core = { path = "../shed-core" }
serde = { workspace = true }
# `raw_value` (feature-only, no new deps), for the same reason shed-broker's
# rc_hub takes it: the fold keeps a tool call's `input` as raw bytes so the
# compact-JSON detail preserves the producer's key order, and keeps an
# approval's `properties` verbatim for `LaneApproval::request_json`. A decoded
# `Value` would re-sort object keys and diverge from the hub's feed rows.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
# `net` + `io-util` on top of the workspace's rt-multi-thread/macros/sync/time:
# `FakeOpencode` binds a loopback `TcpListener` and speaks HTTP/1.1 over it with
# `BufReader`/`AsyncWriteExt`. Both are already enabled by shed-core, so this
# adds no feature to the workspace's tokio build — it just stops this crate from
# depending on a sibling's feature list.
tokio = { workspace = true, features = ["net", "io-util"] }
reqwest = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
# The fold's time currency: opencode stamps epoch-millis, the feed row carries
# RFC3339 (`opencode_ts`). Same minimal pin (and same reason) as shed-app's and
# shed-broker's — `std` only, no `clock`/`oldtime`, so no iana-time-zone pull.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# UNUSED as of plan 017 C1, and deliberately still here. This crate took `regex`
# for one thing — the ANSI-escape stripper behind `sanitize_last_message` — and
# that stripper moved to `shed_core::lane::feed` when the second lane adapter
# needed it, so nothing under `src/`, `tests/` or `examples/` names `regex` any
# more (`grep -rn regex shed-opencode/` finds only this comment).
#
# Dropping the line is a lockfile change, and this workspace's `Cargo.lock` is
# not the only one that would move: the Tauri client is a SEPARATE workspace
# (`desktop/tauri/src-tauri/Cargo.lock`) that path-depends on this crate, and the
# two locks are verified in lockstep at release. So the removal belongs to the
# commit that is already regenerating both — C4 — rather than to one whose
# `cargo tree` invariants are its evidence. `regex` still reaches this crate
# transitively through shed-core either way, so nothing builds differently.
regex = "1"

[features]
# Exports `testing::FakeOpencode` — the in-process opencode double — across the
# crate boundary, the `shed_core::roost::testing::FakeRoost` pattern. Integration
# tests (`tests/*.rs`) reach the fake THROUGH this feature; `cfg(test)` would not
# cross the boundary. Test-only by construction: the module is
# `#[cfg(any(test, feature = "test-support"))]`, so a shipped binary never
# carries it.
test-support = []

[dev-dependencies]
# `rt` (the current-thread runtime) for the async tests. `test-util` is what
# `#[tokio::test(start_paused = true)]` needs: the watcher's 30 s stall window
# is asserted against a PAUSED clock, so the test proves the real constant in
# milliseconds instead of sleeping for half a minute. Both are tokio's own
# features — no package joins the lock — and `test-util` changes nothing unless
# a test explicitly pauses time.
tokio = { workspace = true, features = ["rt", "test-util"] }
# The integration tests drive the fake, which lives behind the feature.
shed-opencode = { path = ".", features = ["test-support"] }

# The manual verification tool (plan 015 §8) and the smallest proof the contract
# is usable from OUTSIDE this crate: it calls nothing but `AgentLane`. Named
# explicitly so `cargo run --example shed-opencode-lane` matches the name the
# plan and the docs use.
[[example]]
name = "shed-opencode-lane"
path = "examples/lane.rs"
