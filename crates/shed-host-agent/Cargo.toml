[package]
name = "shed-host-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "shed-host-agent — the host-side credential-broker daemon (Rust port). The daemon shell: CLI (version/status subcommands), signals, run_daemon wiring, the socket bind ceremony + read-only status UDS server, and the Surface-A desktop approval channel (desktop.rs, gated by `desktop-forwarding`). The embeddable broker core it drives lives in the sibling `shed-broker` crate."

[[bin]]
name = "shed-host-agent"
path = "src/main.rs"

[lints]
workspace = true

[features]
# The desktop approval channel (the async UDS server in `desktop.rs`) + its wire
# codec (`desktop_protocol.rs`). On by default; a headless build
# (`--no-default-features`) drops those MODULES only. The broker core (`shed-broker`)
# is always linked — the bus, backends, minter, supervisor, and the always-compiled
# audit fan-out seam do not depend on this feature; a headless build still brokers.
default = ["desktop-forwarding"]
desktop-forwarding = []

[dependencies]
# The embeddable broker core: bus + supervisor + backends + minter + config +
# discovery + approval/audit seams + socket paths/liveness + the LiveStatus snapshot
# builder. The daemon shell drives it; the desktop app (later) embeds the same crate.
shed-broker = { path = "../shed-broker" }
serde = { workspace = true }
serde_json = { workspace = true }
# net (UnixListener/UnixStream) + io-util (AsyncWriteExt/BufReader) + sync
# (mpsc/oneshot/watch) + signal (SIGTERM/SIGINT — only the daemon installs handlers)
# on top of rt-multi-thread/macros/time. The status UDS server + the desktop
# approval channel are the async surfaces the shell owns.
tokio = { workspace = true, features = ["net", "io-util", "sync", "signal", "rt-multi-thread", "macros", "time"] }
# The shared client core: the desktop wire codec (`desktop_protocol.rs`) reuses
# `shed_core::approval::protocol` for the shared framing constants.
shed-core = { path = "../shed-core" }
# The desktop server's async trait impls (`ControlTokenMinter`, gated test minters).
async-trait = { workspace = true }
# `event`-frame ids in the desktop server (`new_id` → uuid v4), matching Go's frame ids.
uuid = { workspace = true }

[dev-dependencies]
# Throwaway socket dirs for the `status` "not running" exit-code test + the socket
# bind-ceremony (`prepare_socket_path`) unit tests.
tempfile = "3"
