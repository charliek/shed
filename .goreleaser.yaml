version: 2

project_name: shed

before:
  hooks:
    - go mod tidy

builds:
  - id: shed
    binary: shed
    main: ./cmd/shed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/charliek/shed/internal/version.Version={{.Version}}
      - -X github.com/charliek/shed/internal/version.GitCommit={{.ShortCommit}}
      - -X github.com/charliek/shed/internal/version.BuildDate={{.Date}}

  - id: shed-server
    binary: shed-server
    main: ./cmd/shed-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/charliek/shed/internal/version.Version={{.Version}}
      - -X github.com/charliek/shed/internal/version.GitCommit={{.ShortCommit}}
      - -X github.com/charliek/shed/internal/version.BuildDate={{.Date}}

  - id: shed-agent
    binary: shed-agent
    main: ./cmd/shed-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/charliek/shed/internal/version.Version={{.Version}}
      - -X github.com/charliek/shed/internal/version.GitCommit={{.ShortCommit}}
      - -X github.com/charliek/shed/internal/version.BuildDate={{.Date}}

archives:
  - id: shed
    ids:
      - shed
    formats:
      - tar.gz
    name_template: "shed_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

  - id: shed-server
    ids:
      - shed-server
    formats:
      - tar.gz
    name_template: "shed-server_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

  - id: shed-agent
    ids:
      - shed-agent
    formats:
      - tar.gz
    name_template: "shed-agent_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

  - id: shed-homebrew
    ids:
      - shed
      - shed-server
    formats:
      - tar.gz
    name_template: "shed-homebrew_{{ .Os }}_{{ .Arch }}"
    files:
      - src: configs/server.example.yaml
        dst: .
        strip_parent: true

brews:
  - name: shed
    ids:
      - shed-homebrew
    repository:
      owner: charliek
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/charliek/shed"
    description: "CLI and server for managing persistent VM-based dev environments"
    license: "MIT"
    dependencies:
      - name: vfkit
        os: mac
    install: |
      bin.install "shed"
      bin.install "shed-server"
      (etc/"shed").mkpath
      (etc/"shed").install "server.example.yaml" => "server.yaml" unless (etc/"shed/server.yaml").exist?
    service: |
      run [opt_bin/"shed-server", "serve", "--config", etc/"shed/server.yaml"]
      keep_alive true
      log_path var/"log/shed-server.log"
      error_log_path var/"log/shed-server.log"
    caveats: |
      The shed-server config has been installed to:
        #{HOMEBREW_PREFIX}/etc/shed/server.yaml

      To start shed-server as a background service:
        brew services start shed

      Logs: #{var}/log/shed-server.log

      Note: shed-server requires Docker for VM image management.
    test: |
      system bin/"shed", "version"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: charliek
    name: shed
  draft: false
  prerelease: auto
  mode: replace

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
