version: 2

project_name: shed

before:
  hooks:
    - go mod tidy

builds:
  - id: shed
    binary: shed
    main: ./cmd/shed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/charliek/shed/internal/version.Version={{.Version}}
      - -X github.com/charliek/shed/internal/version.GitCommit={{.ShortCommit}}
      - -X github.com/charliek/shed/internal/version.BuildDate={{.Date}}

  - id: shed-server
    binary: shed-server
    main: ./cmd/shed-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/charliek/shed/internal/version.Version={{.Version}}
      - -X github.com/charliek/shed/internal/version.GitCommit={{.ShortCommit}}
      - -X github.com/charliek/shed/internal/version.BuildDate={{.Date}}

  - id: shed-agent
    binary: shed-agent
    main: ./cmd/shed-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/charliek/shed/internal/version.Version={{.Version}}
      - -X github.com/charliek/shed/internal/version.GitCommit={{.ShortCommit}}
      - -X github.com/charliek/shed/internal/version.BuildDate={{.Date}}

archives:
  - id: shed
    ids:
      - shed
    formats:
      - tar.gz
    name_template: "shed_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

  - id: shed-server
    ids:
      - shed-server
    formats:
      - tar.gz
    name_template: "shed-server_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

  - id: shed-agent
    ids:
      - shed-agent
    formats:
      - tar.gz
    name_template: "shed-agent_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

  - id: shed-homebrew
    ids:
      - shed
      - shed-server
    formats:
      - tar.gz
    name_template: "shed-homebrew_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

brews:
  - name: shed
    ids:
      - shed-homebrew
    repository:
      owner: charliek
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/charliek/shed"
    description: "CLI and server for managing persistent VM-based dev environments"
    license: "MIT"
    dependencies:
      - name: vfkit
        os: mac
    install: |
      bin.install "shed"
      bin.install "shed-server"
      (etc/"shed").mkpath
      unless (etc/"shed/server.yaml").exist?
        if OS.mac?
          (etc/"shed/server.yaml").write <<~YAML
            # Shed Server Configuration
            # Full reference: https://github.com/charliek/shed/blob/main/configs/server.example.yaml

            name: my-server

            http_port: 8080
            ssh_port: 2222

            default_backend: vz
            log_level: info

            # Credentials to mount into VMs
            # Using ~/.shed/mounts/ keeps host and VM configs separate.
            # credentials:
            #   claude:
            #     source: ~/.shed/mounts/claude
            #     target: /home/shed/.claude
            #     readonly: false
            #   codex:
            #     source: ~/.shed/mounts/codex
            #     target: /home/shed/.codex
            #     readonly: false
            #   opencode_data:
            #     source: ~/.shed/mounts/opencode/share
            #     target: /home/shed/.local/share/opencode
            #     readonly: false
            #   opencode_state:
            #     source: ~/.shed/mounts/opencode/state
            #     target: /home/shed/.local/state/opencode
            #     readonly: false
            #   gh:
            #     source: ~/.shed/mounts/gh
            #     target: /home/shed/.config/gh
            #     readonly: false

            # Environment file (KEY=value per line, injected into VMs)
            # env_file: ~/.shed/env

            # Extensions to enable in VMs (requires shed-host-agent)
            # extensions:
            #   enabled:
            #     - ssh-agent
            #     - aws-credentials
            #     - docker-credentials

            vz:
              vfkit_path: vfkit
              kernel_path: ~/Library/Application Support/shed/vz/vmlinux
              initrd_path: ~/Library/Application Support/shed/vz/initrd.img
              base_rootfs: ghcr.io/charliek/shed-vz-experimental:v{{ .Version }}
              images:
                base: ghcr.io/charliek/shed-vz-base:v{{ .Version }}
                experimental: ghcr.io/charliek/shed-vz-experimental:v{{ .Version }}
              instance_dir: ~/Library/Application Support/shed/vz/instances
              socket_dir: ~/.shed/vz/sockets
              default_cpus: 2
              default_memory_mb: 4096
              default_disk_gb: 20
              start_timeout: 60s
              stop_timeout: 10s
          YAML
        else
          (etc/"shed/server.yaml").write <<~YAML
            # Shed Server Configuration
            # Full reference: https://github.com/charliek/shed/blob/main/configs/server.example.yaml

            name: my-server

            http_port: 8080
            ssh_port: 2222

            default_backend: firecracker
            log_level: info

            # Credentials to mount into VMs
            # Using ~/.shed/mounts/ keeps host and VM configs separate.
            # credentials:
            #   claude:
            #     source: ~/.shed/mounts/claude
            #     target: /home/shed/.claude
            #     readonly: false
            #   codex:
            #     source: ~/.shed/mounts/codex
            #     target: /home/shed/.codex
            #     readonly: false
            #   gh:
            #     source: ~/.shed/mounts/gh
            #     target: /home/shed/.config/gh
            #     readonly: false

            # Environment file (KEY=value per line, injected into VMs)
            # env_file: ~/.shed/env

            # Extensions to enable in VMs (requires shed-host-agent)
            # extensions:
            #   enabled:
            #     - ssh-agent
            #     - aws-credentials
            #     - docker-credentials

            firecracker:
              kernel_path: /var/lib/shed/firecracker/images/vmlinux
              base_rootfs: ghcr.io/charliek/shed-fc-base:v{{ .Version }}
              images:
                base: ghcr.io/charliek/shed-fc-base:v{{ .Version }}
              instance_dir: /var/lib/shed/firecracker/instances
              socket_dir: /var/run/shed/firecracker
              default_cpus: 2
              default_memory_mb: 4096
              default_disk_gb: 20
              vsock_base_cid: 100
              start_timeout: 90s
              stop_timeout: 10s
              bridge_name: shed-br0
              bridge_cidr: 172.30.0.1/24
              tap_prefix: shed-tap
          YAML
        end
      end
    service: |
      run [opt_bin/"shed-server", "serve", "--config", etc/"shed/server.yaml"]
      keep_alive true
      log_path var/"log/shed-server.log"
      error_log_path var/"log/shed-server.log"
    caveats: |
      The shed-server config has been installed to:
        #{HOMEBREW_PREFIX}/etc/shed/server.yaml

      Edit the config to enable credential mounts and extensions,
      then start shed-server as a background service:
        brew services start shed

      Logs: #{var}/log/shed-server.log

      Note: shed-server requires Docker for VM image management.
    test: |
      system bin/"shed", "version"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: charliek
    name: shed
  draft: false
  prerelease: auto
  mode: replace

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
