[project]
name = "rc-parity"
version = "0.1.0"
description = "Go↔Rust differential harness for the one-shot RC engine: drives the real `shed-machine-rc <verb>` and `sx rc <verb>` binaries against a hermetic tmux server and asserts their wire-visible output, under a defined canonicalization, is identical — then pins it to a golden recorded from the Go (oracle) side."
requires-python = ">=3.11"
# pytest only. The binaries are driven as black-box subprocesses and the
# compared payloads are canonicalized with the stdlib `json` — no client
# library, no crypto. The hub family (plan 010) speaks loopback HTTP to the two
# resident hub daemons via the stdlib `http.client` — still no dependencies,
# and never a network beyond 127.0.0.1.
dependencies = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra --strict-markers"
markers = [
    "differential: a scenario run against BOTH implementations, asserted equal and pinned to a golden",
    "hub: the resident-daemon hub family (plan 010) — both legs, equality-then-pin since H12",
]
# Hermetic by construction: a fresh HOME + tmux server per context (one per
# implementation leg under the `isolated` flavor, one shared by both under
# `shared`), the hub kill-switch on, no network. Warnings are errors so a leaked
# subprocess pipe or an unreaped child cannot slip past silently.
filterwarnings = [
    "error",
    "default::DeprecationWarning",
]
