[project]
name = "rc-parity"
version = "0.1.0"
description = "Go↔Rust differential harness for the RC hub: runs both resident hub daemons — `shed-machine-rc serve --foreground` (the test-only oracle built from tests/rc-parity/oracle) and `shed-host-agent rc-hub` — on ephemeral loopback ports over identical hermetic tmux sessions, and asserts their wire-visible /v1 output, under a defined canonicalization, is identical — then pins it to a golden recorded from the Go (oracle) side."
requires-python = ">=3.11"
# pytest only. The binaries are driven as black-box subprocesses and the
# compared payloads are canonicalized with the stdlib `json` — no client
# library, no crypto. The suite speaks loopback HTTP to the two resident hub
# daemons via the stdlib `http.client` — still no dependencies, and never a
# network beyond 127.0.0.1.
dependencies = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra --strict-markers"
markers = [
    "hub: the resident-daemon hub family (plan 010) — both legs, equality-then-pin since H12",
]
# Hermetic by construction: a fresh HOME + tmux server per leg, the create-time
# hub kill-switch on, no network beyond each daemon's own ephemeral loopback
# port. Warnings are errors so a leaked subprocess pipe or an unreaped child
# cannot slip past silently.
filterwarnings = [
    "error",
    "default::DeprecationWarning",
]
