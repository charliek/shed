[project]
name = "host-agent-diff"
version = "0.1.0"
description = "Hermetic Go-vs-Rust differential harness for the shed-host-agent Rust port (slice 0). Spawns BOTH daemon binaries and asserts equal wire-visible output under a defined canonicalization."
requires-python = ">=3.11"
# pytest drives the daemons as black-box subprocesses and canonicalizes the compared
# payloads with the stdlib `json`. `cryptography` backs the ssh-agent fake
# (`fake_ssh_agent.py`): it real-signs the ed25519 identity deterministically and
# verifies the RSA/ECDSA `sign` blobs the local-keys backend produces (verify-not-bytes,
# per the harness plan).
dependencies = [
    "pytest>=8.0",
    "cryptography>=42",
]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra --strict-markers"
markers = [
    "differential: a scenario asserted equal across the Go and Rust daemons after normalization",
    "golden: reserved for fixture-backed decision-parity checks (owned by the Go/Rust golden runners)",
]
# Hermetic-by-construction: no network, isolated HOME + socket dir per test. Surface
# any warning as an error so a daemon that starts emitting to stdout/stderr in a way
# that changes captured output can't slip past silently.
filterwarnings = [
    "error",
    "default::DeprecationWarning",
]
