name: CI

on:
  push:
    branches: [main, 'feature/*']
  pull_request:
    branches: [main, 'feature/*']

# Least privilege: the Go jobs only checkout + build + test, the desktop legs
# only build/test, and docs only builds the site — no writes. The `changes`
# job additionally reads pull-requests (dorny needs the PR base to diff).
permissions:
  contents: read

jobs:
  # Path-filter so Go-only, desktop-only, and docs-only PRs skip the legs that
  # don't apply (imported from shed-desktop's ci.yml, rescoped for the monorepo:
  # crates/ + desktop/ prefixes). The `go` filter is a conservative negative-glob
  # (everything except the desktop/docs subtrees); the `ci` filter forces every
  # leg to run when the workflow / release scripts / Makefiles change. On
  # pull_request dorny diffs against the PR base; on push it uses the pushed
  # range (github.event.before) — the same default the old repo relied on.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter-go.outputs.go }}
      rust: ${{ steps.filter.outputs.rust }}
      desktop: ${{ steps.filter.outputs.desktop }}
      tauri: ${{ steps.filter.outputs.tauri }}
      packaging: ${{ steps.filter.outputs.packaging }}
      harness: ${{ steps.filter.outputs.harness }}
      hostagent: ${{ steps.filter.outputs.hostagent }}
      rcparity: ${{ steps.filter.outputs.rcparity }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v6
      # The go filter uses negations ("everything except desktop/crates/docs"),
      # which requires predicate-quantifier: every (a changed file counts only if
      # it matches ALL patterns). That quantifier is step-global and would break
      # the positive multi-pattern filters below (a file cannot match two
      # different globs at once), so the go filter gets its own step.
      - uses: dorny/paths-filter@v4
        id: filter-go
        with:
          predicate-quantifier: 'every'
          filters: |
            go:
              - '**'
              - '!desktop/**'
              - '!crates/**'
              - '!docs/**'
              # docs toolchain: zensical.toml plus the uv project that exists
              # only to install it. A theme bump touches pyproject.toml and
              # uv.lock and nothing else -- without these the whole Go/Swift/
              # Tauri/deb matrix runs for a docs-only change.
              - '!zensical.toml'
              - '!pyproject.toml'
              - '!uv.lock'
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
            desktop:
              - 'desktop/**'
              - 'crates/**'
            tauri:
              - 'desktop/tauri/**'
              - 'crates/**'
              - 'desktop/packaging/polkit/**'
              # tauri.conf.json bundles launcher scripts from Resources/bin,
              # and the Linux legs run inside this Dockerfile's image
              - 'desktop/Resources/**'
              - 'desktop/Dockerfile.tauri-linux'
              # the mac bundle-smoke path (Sparkle staging + bundle/sign) and the
              # Makefile that wires its targets — a change to only these must still
              # run the tauri-mac bundle smoke
              - 'desktop/scripts/fetch-sparkle.sh'
              - 'desktop/scripts/bundle-tauri-mac.sh'
              - 'desktop/Makefile'
            packaging:
              - 'desktop/packaging/**'
              - 'desktop/linux/**'
            harness:
              - 'desktop/tools/**'
              # the shedtest harness env
              - 'desktop/pyproject.toml'
              - 'desktop/uv.lock'
            hostagent:
              # The Go-vs-Rust host-agent differential leg: both daemons, their
              # shared wire contract (sdk envelope + ext/protocol payloads), the
              # harness, the committed wire reference, and the shared build
              # manifests/locks/toolchain a dependency bump would ride in on.
              - 'crates/shed-host-agent/**'
              # The daemon bin is now a thin shell over the `shed-broker` lib crate
              # (the broker core: bus, backends, minter, supervisor, config, the
              # approval/audit seams, socket paths/liveness, the LiveStatus snapshot).
              # A change there is a change to the shipped daemon's behavior, so it must
              # trigger the differential harness + the release-snapshot.
              - 'crates/shed-broker/**'
              # The Rust host-agent has a path-dep on shed-core, and the release
              # build (builder: rust) reads rust-toolchain.toml — a change to
              # either can break the shipped binary, so both must trigger the
              # differential + the release-snapshot (which is gated on this filter).
              - 'crates/shed-core/**'
              - 'crates/rust-toolchain.toml'
              - 'crates/Cargo.toml'
              - 'crates/Cargo.lock'
              - 'sdk/**'
              - 'internal/ext/protocol/**'
              - 'tests/host-agent-diff/**'
              - 'docs/development/host-agent-wire-catalog.md'
              - 'go.mod'
              - 'go.sum'
            rcparity:
              # The Go-vs-Rust RC-engine differential leg (plan 009): BOTH one-shot
              # implementations, the harness that runs them side by side, and the
              # shared build manifests a dependency bump would ride in on.
              #
              # Rust side: the ported engine (`shed-app`'s `rc` feature) over the
              # pure kernel (`shed-core::rc_agents`), plus the `sx` CLI that is the
              # binary under test. Go side: the engine (`internal/ext/rc`), its CLI
              # shell (`internal/ext/clirc`) and BOTH binaries built from them — the
              # oracle `shed-machine-rc` and the guest `shed-ext-rc`, which share the
              # same wire surface.
              - 'crates/shed-core/**'
              - 'crates/shed-app/**'
              - 'crates/sx/**'
              - 'crates/Cargo.toml'
              - 'crates/Cargo.lock'
              - 'crates/rust-toolchain.toml'
              - 'internal/ext/rc/**'
              - 'internal/ext/clirc/**'
              - 'internal/version/**'
              - 'cmd/shed-machine-rc/**'
              - 'cmd/shed-ext-rc/**'
              - 'tests/rc-parity/**'
              - 'go.mod'
              - 'go.sum'
            docs:
              - 'docs/**'
              - 'zensical.toml'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/docs.yml'
            ci:
              - '.github/workflows/**'
              - '.goreleaser*.yaml'
              - 'scripts/release/**'
              - 'Makefile'
              - 'desktop/Makefile'

  test:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      # Root module tests. The nested sdk module gets compile + vet coverage
      # from the lint job (`make lint` runs `cd sdk && go vet ./...`); we do
      # NOT run `cd sdk && go test` here because sdk/bootstrap's TestRunSuccess
      # is an SSH integration test that isn't robust on the CI runner (it drives
      # the system ssh binary against a spawned test server). Keeping sdk out of
      # the CI test command matches pre-existing behavior; the imported
      # extensions code's use of the sdk is fully compile-checked.
      - run: go test -v ./...

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1

  plugin:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Claude Code plugin manifest and skills
        run: scripts/validate-plugin.sh
      - name: Rust toolchain
        # release-scripts-test.sh exercises update-version.sh's desktop bump,
        # which regenerates both Cargo locks (crates/ + the Tauri workspace).
        run: rustup toolchain install stable --profile minimal
      - name: Release scripts self-test (release-plan.sh + update-version.sh)
        # Runs in a temp copy — never dirties the checkout. Gated go||ci like
        # the rest of this job; the `ci` filter includes scripts/release/**,
        # so any edit to the release scripts always runs this.
        run: scripts/release/release-scripts-test.sh

  release-snapshot:
    name: GoReleaser snapshot (artifact sanity)
    needs: changes
    # Also gated on `hostagent`: the SHIPPED shed-host-agent binary is now built
    # from crates/shed-host-agent/ (builder: rust), so a crates-only PR must run
    # this snapshot to prove the release build still resolves. The `hostagent`
    # filter already scopes crates/shed-host-agent/**.
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.hostagent == 'true' || needs.changes.outputs.ci == 'true' }}
    # macos-latest matches the real release runner: the shipped shed-host-agent is
    # Rust (builder: rust / cargo zigbuild — cross-builds the linux targets from
    # macOS via zig). The Go twin (cmd/shed-host-agent) was sunset (plan
    # 006-mtls-cleanup-hostagent-sunset.md); this job now builds only the Rust
    # binary, but stays on macos-latest to match the real release runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Rust + cross tooling for `builder: rust`. goreleaser's rust builder shells
      # out to `cargo zigbuild`, which needs zig + cargo-zigbuild; it auto-runs
      # `rustup target add`, but pre-adding fails fast if a target is unavailable.
      - name: Rust toolchain + zig cross tooling
        run: |
          # components: crates/rust-toolchain.toml declares rustfmt+clippy, which
          # rustup would auto-install on first cargo use in crates/ (a flaky-network
          # CI-only failure risk); install them explicitly up front.
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin \
                            aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu
          # cargo-zigbuild pinned to the locally-validated version (reproducibility).
          # zig itself is brew-current: a zig bump is a LOUD build failure caught
          # by this snapshot job before any tag (not a silent ship); pinning zig
          # harder is a tracked follow-up (see the glibc-floor note in
          # .goreleaser.host-agent.yaml).
          brew install zig
          cargo install --locked --version 0.23.0 cargo-zigbuild
      # Mirrors the release job's guard (plan 002 D5): the three configs are
      # invoked sequentially and a before-hook MUST NOT mutate a tracked file
      # (go.mod/go.sum) or a later invocation aborts on its own dirty-check. We
      # assert tidiness here instead of running `go mod tidy` in a before-hook,
      # and assert the server config's generated file stays gitignored.
      - name: Guard — tidy tree + gitignored generated config
        run: |
          go mod tidy && git diff --exit-code go.mod go.sum
          git check-ignore -q packaging/server.yaml.generated
      # First-ever CI exercise of the darwin build-tag half (internal/vz and
      # friends) on this runner — de-risks the macos release job.
      - name: Run tests
        run: go test ./...
      # Three snapshot invocations, one per split config, in the FIXED release
      # order (server → host-agent → machine-rc). All three run unconditionally
      # here — the snapshot is the pre-tag proof of every component, incl. the
      # Rust host-agent leg. Each writes its own dist/<component>/ subdir.
      - name: GoReleaser snapshot — server
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.3
          args: release --snapshot --clean -f .goreleaser.server.yaml
      - name: GoReleaser snapshot — host-agent
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.3
          args: release --snapshot --clean -f .goreleaser.host-agent.yaml
      - name: GoReleaser snapshot — machine-rc
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.3
          args: release --snapshot --clean -f .goreleaser.machine-rc.yaml
      - name: Assert release artifacts
        run: |
          set -euo pipefail
          # Each split config writes its own dist/<component>/ subdir (plan 002
          # D2); the checks below are re-pointed accordingly.
          # (i) shed-machine-rc archives: darwin+linux × amd64+arm64, each containing
          # EXACTLY the one binary (ids: selectors must keep other builds out).
          for tgz in dist/machine-rc/shed-machine-rc_*.tar.gz; do
            entries=$(tar tzf "$tgz" | grep -c .)
            bins=$(tar tzf "$tgz" | grep -c '^shed-machine-rc$')
            { [ "$entries" = "1" ] && [ "$bins" = "1" ]; } || { echo "::error::$tgz must contain exactly the shed-machine-rc binary and nothing else"; tar tzf "$tgz"; exit 1; }
          done
          for os in darwin linux; do
            for arch in amd64 arm64; do
              ls "dist/machine-rc/shed-machine-rc_${os}_${arch}.tar.gz" >/dev/null || { echo "::error::missing dist/machine-rc/shed-machine-rc_${os}_${arch}.tar.gz"; exit 1; }
            done
          done
          # (ii) per-arch shed-machine-rc .debs, named to match apt-charliek's glob.
          ls dist/machine-rc/shed-machine-rc_*_amd64.deb dist/machine-rc/shed-machine-rc_*_arm64.deb
          # (iii) ALL FOUR shed-host-agent archives (now Rust) carry the binary AND
          # the example config.
          workdir="$(mktemp -d)"
          for os in darwin linux; do
            for arch in amd64 arm64; do
              tgz="dist/host-agent/shed-host-agent_${os}_${arch}.tar.gz"
              ls "$tgz" >/dev/null || { echo "::error::missing $tgz"; exit 1; }
              tar tzf "$tgz" | grep -qx 'shed-host-agent' || { echo "::error::$tgz missing shed-host-agent binary"; tar tzf "$tgz"; exit 1; }
              tar tzf "$tgz" | grep -qx 'extensions.example.yaml' || { echo "::error::$tgz missing extensions.example.yaml"; tar tzf "$tgz"; exit 1; }
            done
          done
          # Runtime check for the DARWIN binaries. macos-latest is arm64 (Apple
          # Silicon) with no guaranteed Rosetta, so only the NATIVE arm64 binary is
          # executed (`version` — catches a present-but-broken cross-build that
          # passes `tar tzf`); the x86_64 one is validated structurally with `file`
          # (never executed, so no Rosetta dependency). Assert the arm64 binary
          # keeps its linker ad-hoc signature (matches the Go baseline — no explicit
          # codesign step; a future zig that drops it fails loudly here, pre-tag).
          tar xzf dist/host-agent/shed-host-agent_darwin_arm64.tar.gz -C "$workdir" shed-host-agent
          arm64_out="$("$workdir/shed-host-agent" version)"
          echo "darwin/arm64: $arm64_out"
          case "$arm64_out" in shed-host-agent\ *) ;; *) echo "::error::darwin/arm64 version output unexpected: $arm64_out"; exit 1;; esac
          codesign -dv "$workdir/shed-host-agent" 2>&1 | grep -q 'Signature=adhoc' || { echo "::error::arm64 shed-host-agent lost its ad-hoc signature"; codesign -dv "$workdir/shed-host-agent" 2>&1; exit 1; }
          rm -f "$workdir/shed-host-agent"
          tar xzf dist/host-agent/shed-host-agent_darwin_amd64.tar.gz -C "$workdir" shed-host-agent
          amd64_file="$(file "$workdir/shed-host-agent")"
          echo "$amd64_file" | grep -q 'Mach-O.*x86_64' || { echo "::error::darwin/amd64 is not a well-formed x86_64 Mach-O: $amd64_file"; exit 1; }
          echo "darwin/amd64: $amd64_file"
          rm -rf "$workdir"
          # (iv) plan 002 D6: per-dist exact (type, ID) allowlists — typed, so a
          # dropped ARCHIVE block is caught even when its BUILD still contributes
          # the same ID string (codex review finding). Equality proves expected-
          # present AND forbidden-absent. Plus partition invariants (deb
          # ownership, one-checksums-file-per-dist, upload-basename uniqueness
          # across dists) + brew formulas exact-set & `ruby -c` parse.
          python3 - <<'PY'
          import glob, json, os, subprocess, sys
          EXPECTED = {
              "server": {
                  "dist": "dist/server",
                  "typed_ids": {
                      "Binary": {"shed", "shed-server", "shed-egress-proxy", "shed-agent"},
                      "Archive": {"shed", "shed-server", "shed-agent", "shed-homebrew"},
                      "Linux Package": {"shed-deb"},
                  },
                  "checksums": "checksums-server.txt",
                  "formulas": {"shed.rb"},
                  "has_deb": True,
              },
              "host-agent": {
                  "dist": "dist/host-agent",
                  "typed_ids": {
                      # Rust-only shape (plan 006 C3 — the Go twin was sunset):
                      # exactly one build id, archived under the same id.
                      "Binary": {"shed-host-agent"},
                      "Archive": {"shed-host-agent"},
                      "Linux Package": set(),
                  },
                  "checksums": "checksums-host-agent.txt",
                  "formulas": {"shed-host-agent.rb"},
                  "has_deb": False,
              },
              "machine-rc": {
                  "dist": "dist/machine-rc",
                  "typed_ids": {
                      "Binary": {"shed-machine-rc"},
                      "Archive": {"shed-machine-rc"},
                      "Linux Package": {"shed-machine-rc"},
                  },
                  "checksums": "checksums-machine-rc.txt",
                  "formulas": {"shed-machine-rc.rb"},
                  "has_deb": True,
              },
          }
          ALL_CHECKSUMS = {c["checksums"] for c in EXPECTED.values()}
          def fail(m):
              print("::error::" + m); sys.exit(1)
          all_basenames = {}
          for comp, spec in EXPECTED.items():
              dist = spec["dist"]
              if not os.path.isdir(dist):
                  fail(f"{comp}: dist dir {dist} missing")
              arts = json.load(open(os.path.join(dist, "artifacts.json")))
              got = {t: set() for t in spec["typed_ids"]}
              for a in arts:
                  t = a.get("type")
                  aid = (a.get("extra") or {}).get("ID")
                  if t in got and aid:
                      got[t].add(aid)
              for t, want in spec["typed_ids"].items():
                  if got[t] != want:
                      fail(f"{comp}: {t} IDs {sorted(got[t])} != allowlist {sorted(want)}")
              debs = glob.glob(os.path.join(dist, "*.deb"))
              if spec["has_deb"] and not debs:
                  fail(f"{comp}: expected .deb artifacts, found none")
              if not spec["has_deb"] and debs:
                  fail(f"{comp}: dist must contain NO .deb, found {[os.path.basename(d) for d in debs]}")
              present = {os.path.basename(p) for p in glob.glob(os.path.join(dist, "checksums-*.txt"))}
              if present != {spec["checksums"]}:
                  fail(f"{comp}: checksums files {sorted(present)} != {{{spec['checksums']}}}")
              if present & (ALL_CHECKSUMS - {spec["checksums"]}):
                  fail(f"{comp}: contains a foreign checksums file")
              # Exact formula SET — extras are as wrong as missing ones (a stray
              # brew block would publish an unexpected formula at tag time).
              rendered = {os.path.basename(p) for p in glob.glob(os.path.join(dist, "homebrew", "Formula", "*.rb"))}
              if rendered != spec["formulas"]:
                  fail(f"{comp}: rendered formulas {sorted(rendered)} != expected {sorted(spec['formulas'])}")
              for f in spec["formulas"]:
                  fp = os.path.join(dist, "homebrew", "Formula", f)
                  r = subprocess.run(["ruby", "-c", fp], capture_output=True, text=True)
                  if r.returncode != 0:
                      fail(f"{comp}: {fp} failed `ruby -c`: {r.stderr.strip()}")
              # release-uploaded assets only (archives, debs, checksums file)
              for pat in ("*.tar.gz", "*.deb", "checksums-*.txt"):
                  for p in glob.glob(os.path.join(dist, pat)):
                      b = os.path.basename(p)
                      if b in all_basenames:
                          fail(f"upload basename {b} collides: {all_basenames[b]} and {comp}")
                      all_basenames[b] = comp
              print(f"{comp}: IDs OK; deb={'yes' if debs else 'no'}; checksums={spec['checksums']}; formulas parse OK")
          print(f"partition OK: {len(all_basenames)} unique upload basenames across three dists")
          PY
          echo "release snapshot artifacts OK"

  # ---- desktop / crates legs (imported from shed-desktop's ci.yml) ----------

  swift:
    name: swift · build · test · e2e
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
      - name: Swift toolchain
        run: swift --version
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc --version && cargo --version
      - name: Build (Rust core + Swift)
        # `make build` runs scripts/build-core.sh (staticlib + UniFFI bindings +
        # xcframework) before `swift build` — the .binaryTarget path must exist.
        run: make build
      - name: Rust core — test + clippy
        run: make core-test core-lint
      - name: Swift unit tests
        run: make test
      - name: Bundle
        run: ./scripts/bundle.sh debug
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Hermetic E2E (Rust core — default)
        # Default-on since M0: with no flag the Rust shed-core backs reads/
        # lifecycle/create. Headless GUI launch via `open`; the screenshot op
        # renders in-process so no screen-recording TCC grant is needed.
        # wait_alive asserts identify.core=rust, and a Rust-adapter construction
        # failure now fails the host loudly (no silent Swift fallback), so a
        # false-green can't slip through. Slower CI gets a wider wait budget.
        run: SHED_DESKTOP_TEST_TIMEOUT_SCALE=4 uv run --group test pytest tools/shedtest -q
      - name: Hermetic E2E (Swift fallback — SHED_DESKTOP_RUST_CORE=0)
        # The rollback escape hatch (kept ≥2 releases): the legacy Swift URLSession
        # path. wait_alive asserts identify.core=swift, so the fallback stays
        # reachable and green.
        run: SHED_DESKTOP_RUST_CORE=0 SHED_DESKTOP_TEST_TIMEOUT_SCALE=4 uv run --group test pytest tools/shedtest -q
      - name: M0 ship-gates (arm64 + cold-launch + golden cross-backend byte-diff)
        # The deferred Phase-1 safety nets for the default flip: arm64-only Mach-Os,
        # a cold-launch budget, and a BYTE-IDENTICAL Rust-vs-Swift IPC payload diff
        # (the cross-backend parity guard). Runs against the debug bundle here for a
        # continuous per-PR guard; `make m0-gates` runs the same checks on a release
        # bundle for the pre-ship size budget. A slower CI runner gets a wider
        # cold-launch budget.
        #
        # Size budget is a wider 70 MB here because this measures the *unstripped
        # debug* bundle, whose size tracks the CI Swift/Xcode toolchain (the same
        # branch is ~52 MB locally). The shipped artifact is the *release* bundle,
        # tightly gated at 20 MB by `make m0-gates` — this coarse debug tripwire only
        # needs to catch an explosion, not shave megabytes.
        run: >
          SHED_DESKTOP_TEST_TIMEOUT_SCALE=4
          SHED_DESKTOP_COLD_LAUNCH_BUDGET_S=30
          SHED_DESKTOP_SIZE_BUDGET_MB=70
          uv run --group test python tools/shedtest/m0_ship_gates.py
      - name: Real-launch smoke
        # Non-test launch on a fresh runner (undetermined notification auth) —
        # exercises the real SystemNotificationPresenter path the hermetic suite
        # can't reach. Regression guard for the v0.0.2 SIGTRAP (issue #2).
        run: ./scripts/smoke-real-launch.sh
      - name: Launch/reopen window smoke
        # Real launch path the hermetic suite gates off: a user launch opens the
        # dashboard and reopening the running app reaches it. Guards issue #4.
        run: ./scripts/smoke-launch-window.sh

  core-linux:
    name: core-linux (${{ matrix.arch }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' }}
    # Both arches on CI: ubuntu-latest was already x86_64; the arm64 leg (free on
    # public repos) covers the .deb's other target. Runs cargo directly on the
    # runner (not Docker) — same as the old repo, and faster.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustc --version && cargo --version
      - name: C toolchain (ring's crypto backend needs build-essential)
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: shed-core — test + clippy (Linux)
        # Scoped to -p shed-core so the macOS-only shed-core-ffi (uniffi) is never
        # dragged in. --all-targets runs the pinned-TLS verifier + redirect/
        # non-https fail-closed tests here; the e2e's plain-HTTP mock never
        # exercises the pin/token paths, so they stay cargo-only on Linux.
        run: |
          cargo test -p shed-core --all-targets --locked
          cargo clippy -p shed-core --all-targets --locked -- -D warnings

  # The host-agent wire-goldens leg (Phase 3 leg 3a.1; the Go twin sunset by
  # plan 006-mtls-cleanup-hostagent-sunset.md). One Linux job covers BOTH the
  # standalone Rust daemon's build+test+clippy (so it can't Mac-dev bit-rot —
  # it persists as the 3a.2 headless fallback) AND the hermetic wire harness
  # that spawns the daemon and asserts its wire-visible output against goldens
  # recorded from the last agreeing Go↔Rust run. Rust + Python on one runner
  # (the "third pytest suite").
  host-agent-diff:
    name: host-agent-diff (wire goldens)
    needs: changes
    if: ${{ needs.changes.outputs.hostagent == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustc --version && cargo --version
      - name: C toolchain (ring's crypto backend needs build-essential)
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - uses: astral-sh/setup-uv@v6
      # The broker core lives in `shed-broker` now; the bin is the daemon shell over
      # it. Both must build/test/clippy-clean for the shipped daemon to be sound.
      - name: Rust host-agent — test + clippy (Linux)
        working-directory: crates
        run: |
          cargo test -p shed-broker -p shed-host-agent --all-targets --locked
          cargo clippy -p shed-broker -p shed-host-agent --all-targets --locked -- -D warnings
      # The headless variant (surface A dropped) is the 3a.2 server/no-desktop
      # distribution — it must not bit-rot unwatched on the platform it ships to. The
      # `desktop-forwarding` feature is the BIN's; `shed-broker` has no features, so
      # `--no-default-features` reshapes only the shell.
      - name: Rust host-agent — headless (--no-default-features) test + clippy (Linux)
        working-directory: crates
        run: |
          cargo test -p shed-host-agent --all-targets --locked --no-default-features
          cargo clippy -p shed-host-agent --all-targets --locked --no-default-features -- -D warnings
      - name: Wire goldens + golden runners
        # Builds the Rust daemon binary (conftest) and runs the pytest suite
        # against the recorded goldens + the Rust golden-fixture runners.
        run: make test-host-agent-diff

  # The Go↔Rust RC-engine parity leg (plan 009 §3.6) — the FOURTH pytest suite.
  # Same organization as host-agent-diff above: one Linux job covers BOTH the
  # Rust crates' own build/test/clippy AND the differential harness that drives
  # the two binaries side by side. The cargo legs here are what close the §2.2
  # gap — no other job compiles `shed-app --features rc` or `sx` at all, so
  # without them the ported engine and the porcelain would only ever be built as
  # a side effect of the harness (no tests, no clippy).
  rc-parity:
    name: rc-parity (Go↔Rust wire goldens)
    needs: changes
    if: ${{ needs.changes.outputs.rcparity == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    # The only job in this workflow with a timeout: it drives REAL tmux sessions,
    # so a wedged pane (an agent shim that never draws, a poller that never
    # settles) is a hang rather than a failure. The whole leg runs in ~3 min
    # locally; 30 minutes is generous headroom that still fails the same day.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # Builds the Go oracle (`shed-machine-rc`) — same version as the other Go jobs.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustc --version && cargo --version
      # build-essential: ring's crypto backend (shed-core) needs a C toolchain.
      # tmux: NOT preinstalled on GitHub runners, and it is the engine's hard
      # dependency on both sides.
      - name: C toolchain + tmux
        # Bounded + retried on purpose. A stalled apt mirror (the Azure mirror
        # unreachable, archive.ubuntu.com hanging mid-fetch) once produced ZERO
        # output for 29 minutes and ate this job's whole 30-minute budget, so a
        # 2-minute infrastructure blip cancelled the job and read like a harness
        # hang. `timeout` bounds each attempt (a hang, not a failure, is the
        # observed shape — a bare retry loop would never re-enter), and the
        # step cap is the backstop.
        timeout-minutes: 8
        run: |
          set -euo pipefail
          ok=""
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get update; then ok=1; break; fi
            echo "apt-get update stalled or failed (attempt ${attempt}/3); retrying" >&2
            sleep 10
          done
          if [ -z "${ok}" ]; then
            echo "::error::apt-get update failed 3x — mirror outage?"
            exit 1
          fi
          sudo timeout 300 apt-get install -y build-essential tmux
      - name: Assert tmux >= 3.2
        # `new-session -e` (how BOTH implementations stamp session metadata)
        # arrived in tmux 3.2. The harness asserts this too, but only after
        # building both binaries — failing here makes the cause unmistakable.
        run: |
          set -euo pipefail
          raw="$(tmux -V)"
          echo "${raw}"
          major="$(printf '%s' "${raw}" | sed -E 's/^tmux[^0-9]*([0-9]+)\.([0-9]+).*/\1/')"
          minor="$(printf '%s' "${raw}" | sed -E 's/^tmux[^0-9]*([0-9]+)\.([0-9]+).*/\2/')"
          if [ "${major}" -lt 3 ] || { [ "${major}" -eq 3 ] && [ "${minor}" -lt 2 ]; }; then
            echo "::error::${raw} is below the 3.2 floor required by \`new-session -e\`"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
      # The ported engine lives behind shed-app's non-default `rc` feature and the
      # porcelain is `sx` — neither is reached by core-linux (`-p shed-core`) or by
      # host-agent-diff (`-p shed-broker -p shed-host-agent`). Both are named
      # explicitly: a filter that matched nothing would run ZERO tests silently
      # (the lesson recorded on `test-host-agent-diff` in the Makefile).
      - name: Rust engine + porcelain — test + clippy (Linux)
        working-directory: crates
        run: |
          cargo test -p shed-app --features rc --all-targets --locked
          cargo clippy -p shed-app --features rc --all-targets --locked -- -D warnings
          cargo test -p sx --all-targets --locked
          cargo clippy -p sx --all-targets --locked -- -D warnings
      - name: Go↔Rust parity harness
        # Builds BOTH implementations and runs every differential cell against the
        # committed goldens (a clean unfiltered run, so the stale-golden sweep is
        # armed).
        run: make test-rc-parity

  deb:
    name: deb
    needs: changes
    # The shipped .deb builds from the Tauri client, so a desktop/tauri/**-only
    # change must rebuild + revalidate it (alongside crates/packaging/linux).
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.packaging == 'true' || needs.changes.outputs.tauri == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustc --version && cargo --version
      - name: Tauri (WebKitGTK) build deps + nfpm
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update && sudo apt-get install -y nfpm
      - name: Node (the Vite/React frontend bundle)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/tauri/ui/package-lock.json
      - name: Frontend bundle (generate_context! needs tauri/ui/dist)
        run: cd tauri/ui && npm ci && npm run build
      - name: Build the Tauri .deb
        # build-deb.sh cargo-builds directly on the runner (not Docker) — same as
        # the old repo. Its SCRIPT_DIR is absolute, so `desktop` working-dir +
        # a relative invocation resolve REPO_ROOT=desktop, CRATES_DIR=crates.
        run: ./linux/scripts/build-deb.sh 0.0.1-ci
      - name: Install-validate in a clean container
        # apt-installs the .deb (resolving its runtime deps) in a fresh ubuntu:24.04
        # and asserts the binary launches under Xvfb + answers identify, the bundled
        # shedctl drives it, and the polkit action is present.
        run: |
          # shellcheck disable=SC2012  # controlled out/ dir, glob is safe
          ./linux/scripts/validate-deb.sh "$(ls -t out/shed-desktop_*.deb | head -1)"

  tauri-linux:
    name: tauri-linux
    needs: changes
    if: ${{ needs.changes.outputs.tauri == 'true' || needs.changes.outputs.harness == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The Docker legs' Make prereq (tauri-ui-build) runs `npm run build` on the
      # HOST, so the frontend deps must be installed here first (same as old repo).
      - name: Node (the Vite/React frontend bundle)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/tauri/ui/package-lock.json
      - name: Frontend deps
        run: cd desktop/tauri/ui && npm ci
      # The Tauri crate's Linux-only approval-seam tests (polkit/libnotify gate is
      # fail-closed: never Approved without a real auth). Docker (ubuntu:24.04),
      # same image as the render gate below; no display needed.
      - name: Tauri crate tests (Linux)
        run: make -C desktop tauri-test-linux
      # The render gate: builds the frontend + the Tauri app and runs the
      # --target tauri hermetic e2e on WebKitGTK 2.44 under Xvfb (the pinned
      # WebView = the real CSS/render gate). GitHub runners allow privileged
      # docker run for the WebKitGTK web-process sandbox.
      - name: Tauri render gate + hermetic E2E (WebKitGTK)
        run: make -C desktop tauri-build-linux

  tauri-mac:
    name: tauri-mac
    needs: changes
    if: ${{ needs.changes.outputs.tauri == 'true' || needs.changes.outputs.harness == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustc --version && cargo --version
      - name: Node (the Vite/React frontend bundle)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/tauri/ui/package-lock.json
      - name: Frontend deps
        run: cd desktop/tauri/ui && npm ci
      - name: Tauri clippy (standalone workspace)
        run: make -C desktop tauri-lint
      - uses: astral-sh/setup-uv@v6
      - name: Hermetic Tauri E2E (macOS WKWebView)
        # A wider timeout scale buys headroom on a shared CI runner (as the swift
        # + tauri-linux legs do). WKWebView needs no Xvfb; the mac screenshot op is
        # TCC-gated so it's skipped here (the WebKitGTK leg is the screenshot gate).
        run: SHED_TAURI_TEST_TIMEOUT_SCALE=4 make -C desktop e2e-tauri
      - name: Bundle smoke (Sparkle staging + ordered re-sign + plist/signing assertions)
        # The ONLY PR-time guard on the mac packaging path (the release job can't
        # run per-PR). Runs bundle-tauri-mac.sh end-to-end with the ad-hoc identity
        # (--debug; the script fetches Sparkle itself) — the raw Tauri bundler
        # output would fail strict verify without the ordered Sparkle re-sign, so
        # this exercises the real ship path. node_modules is already installed
        # ("Frontend deps" above); the tauri build's beforeBuildCommand rebuilds
        # the dist. The second bundle shares the cargo target dir (incremental).
        working-directory: desktop
        run: |
          set -euo pipefail
          die() { echo "::error::$1"; exit 1; }
          assert_bundle() {
            local expect_ver="$1"
            local app="build/ShedDesktop.app"
            local plist="${app}/Contents/Info.plist"
            [ -d "${app}" ] || die "${app} missing"
            # ShedDesktop.app named + bundle id aligned to the Swift app (so the
            # eventual Swift->Tauri hop is a same-identity in-place Sparkle update).
            local bid; bid="$(plutil -extract CFBundleIdentifier raw "${plist}")"
            [ "${bid}" = "ai.stridelabs.ShedDesktop" ] || die "CFBundleIdentifier ${bid} != ai.stridelabs.ShedDesktop"
            # CFBundleExecutable must name a real Mach-O under Contents/MacOS/.
            local exec; exec="$(plutil -extract CFBundleExecutable raw "${plist}")"
            [ -f "${app}/Contents/MacOS/${exec}" ] || die "CFBundleExecutable ${exec} not a file under Contents/MacOS/"
            file -b "${app}/Contents/MacOS/${exec}" | grep -q "Mach-O" || die "CFBundleExecutable ${exec} is not Mach-O"
            # Version stamped VERBATIM (both plist keys) — the prerelease run proves
            # a `-rc.N` suffix is NOT normalized away (else rc1->rc2 false-passes).
            local cfv cfsv
            cfv="$(plutil -extract CFBundleVersion raw "${plist}")"
            cfsv="$(plutil -extract CFBundleShortVersionString raw "${plist}")"
            [ "${cfv}" = "${expect_ver}" ] || die "CFBundleVersion ${cfv} != ${expect_ver}"
            [ "${cfsv}" = "${expect_ver}" ] || die "CFBundleShortVersionString ${cfsv} != ${expect_ver}"
            # Sparkle embedded; Downloader.xpc entitlements after the re-sign are
            # IDENTICAL to the pristine dist copy's (an EMPTY dict — Sparkle >=2.6
            # dropped the Downloader sandbox, sparkle-project/Sparkle#2511). The
            # load-bearing property: --preserve-metadata=entitlements kept the
            # dist's and never injected the app's. (Do NOT grep for app-sandbox.)
            local fw="${app}/Contents/Frameworks/Sparkle.framework"
            [ -d "${fw}" ] || die "Sparkle.framework missing"
            local bundled_dl="${fw}/Versions/B/XPCServices/Downloader.xpc"
            local dist_dl="tauri/src-tauri/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc"
            # Capture both extractions and require each to succeed with output —
            # a diff of two failed/empty streams would false-green.
            local ent_dir; ent_dir="$(mktemp -d)"
            codesign -d --entitlements :- "${bundled_dl}" > "${ent_dir}/bundled" \
              || die "codesign entitlements extraction failed: ${bundled_dl}"
            codesign -d --entitlements :- "${dist_dl}" > "${ent_dir}/dist" \
              || die "codesign entitlements extraction failed: ${dist_dl}"
            [ -s "${ent_dir}/bundled" ] || die "empty entitlements output for ${bundled_dl}"
            diff "${ent_dir}/bundled" "${ent_dir}/dist" >/dev/null \
              || die "Downloader.xpc entitlements differ from the pristine dist copy"
            rm -rf "${ent_dir}"
            # The three Sparkle keys are present, and SUPublicEDKey matches the
            # Swift app's Info.plist.template (a drift would break the EdDSA chain
            # exactly at the Swift->Tauri hop).
            local k
            for k in SUFeedURL SUPublicEDKey SUEnableAutomaticChecks; do
              plutil -extract "${k}" raw "${plist}" >/dev/null 2>&1 || die "Info.plist missing ${k}"
            done
            local app_edkey tmpl_edkey
            app_edkey="$(plutil -extract SUPublicEDKey raw "${plist}")"
            tmpl_edkey="$(plutil -extract SUPublicEDKey raw Resources/Info.plist.template)"
            [ "${app_edkey}" = "${tmpl_edkey}" ] || die "SUPublicEDKey ${app_edkey} != template ${tmpl_edkey}"
            # The ordered re-sign must produce a strictly-valid bundle.
            codesign --verify --strict "${app}" || die "codesign --verify --strict failed"
            echo "bundle smoke OK: id=${bid} exec=${exec} ver=${cfv}/${cfsv} edkey=${app_edkey}"
          }
          # 1) The configured version, stamped verbatim.
          ./scripts/bundle-tauri-mac.sh --debug
          EXPECT_VER="$(python3 -c "import json,sys; print(json.load(open('tauri/src-tauri/tauri.conf.json'))['version'])")"
          assert_bundle "${EXPECT_VER}"
          # 2) A prerelease override — proves the suffix survives Tauri's plist
          #    stamping verbatim (guards the rc1->rc2 rehearsal from a silent
          #    false "up to date"). Incremental: shares the cargo target dir.
          SHED_TAURI_CONFIG_OVERRIDE='{"version":"0.0.0-rc.1"}' ./scripts/bundle-tauri-mac.sh --debug
          assert_bundle "0.0.0-rc.1"

  docs-build:
    name: docs build
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # setup-uv publishes no moving major tag -- v9 does not resolve.
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv python install 3.13
      - run: uv sync --locked --group docs
      - run: uv run --locked zensical build --strict

  # Single required check for the `main` ruleset. `if: always()` + an explicit
  # per-job result scan is load-bearing: with the path-filter above, a leg that
  # doesn't apply is `skipped`, and a plain `needs:` gate would itself skip —
  # leaving the required check unreported and the PR unmergeable forever. Here
  # skipped counts as pass; only failure/cancelled fails the gate.
  ci-success:
    name: ci-success
    if: always()
    needs: [changes, test, lint, plugin, release-snapshot, swift, core-linux, host-agent-diff, rc-parity, deb, tauri-linux, tauri-mac, docs-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require no job failed (skipped-by-filter counts as pass)
        run: |
          results="${{ needs.changes.result }} ${{ needs.test.result }} ${{ needs.lint.result }} ${{ needs.plugin.result }} ${{ needs.release-snapshot.result }} ${{ needs.swift.result }} ${{ needs.core-linux.result }} ${{ needs.host-agent-diff.result }} ${{ needs.rc-parity.result }} ${{ needs.deb.result }} ${{ needs.tauri-linux.result }} ${{ needs.tauri-mac.result }} ${{ needs.docs-build.result }}"
          echo "job results: ${results}"
          for r in ${results}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::a required CI job did not pass (${results})"; exit 1 ;;
            esac
          done
          echo "all required jobs passed (success or skipped-by-filter)"
