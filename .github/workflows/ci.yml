name: CI

on:
  push:
    branches: [main, 'feature/*']
  pull_request:
    branches: [main, 'feature/*']

# Least privilege: the Go jobs only checkout + build + test, the desktop legs
# only build/test, and docs only builds the site — no writes. The `changes`
# job additionally reads pull-requests (dorny needs the PR base to diff).
permissions:
  contents: read

jobs:
  # Path-filter so Go-only, desktop-only, and docs-only PRs skip the legs that
  # don't apply (imported from shed-desktop's ci.yml, rescoped for the monorepo:
  # crates/ + desktop/ prefixes). The `go` filter is a conservative negative-glob
  # (everything except the desktop/docs subtrees); the `ci` filter forces every
  # leg to run when the workflow / release scripts / Makefiles change. On
  # pull_request dorny diffs against the PR base; on push it uses the pushed
  # range (github.event.before) — the same default the old repo relied on.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter-go.outputs.go }}
      rust: ${{ steps.filter.outputs.rust }}
      desktop: ${{ steps.filter.outputs.desktop }}
      tauri: ${{ steps.filter.outputs.tauri }}
      packaging: ${{ steps.filter.outputs.packaging }}
      harness: ${{ steps.filter.outputs.harness }}
      hostagent: ${{ steps.filter.outputs.hostagent }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v6
      # The go filter uses negations ("everything except desktop/crates/docs"),
      # which requires predicate-quantifier: every (a changed file counts only if
      # it matches ALL patterns). That quantifier is step-global and would break
      # the positive multi-pattern filters below (a file cannot match two
      # different globs at once), so the go filter gets its own step.
      - uses: dorny/paths-filter@v4
        id: filter-go
        with:
          predicate-quantifier: 'every'
          filters: |
            go:
              - '**'
              - '!desktop/**'
              - '!crates/**'
              - '!docs/**'
              - '!mkdocs.yml'
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
            desktop:
              - 'desktop/**'
              - 'crates/**'
            tauri:
              - 'desktop/tauri/**'
              - 'crates/**'
              - 'desktop/packaging/polkit/**'
              # tauri.conf.json bundles launcher scripts from Resources/bin,
              # and the Linux legs run inside this Dockerfile's image
              - 'desktop/Resources/**'
              - 'desktop/Dockerfile.tauri-linux'
            packaging:
              - 'desktop/packaging/**'
              - 'desktop/linux/**'
            harness:
              - 'desktop/tools/**'
              # the shedtest harness env
              - 'desktop/pyproject.toml'
              - 'desktop/uv.lock'
            hostagent:
              # The Go-vs-Rust host-agent differential leg: both daemons, their
              # shared wire contract (sdk envelope + ext/protocol payloads), the
              # harness, the committed wire reference, and the shared build
              # manifests/locks/toolchain a dependency bump would ride in on.
              - 'crates/shed-host-agent/**'
              # The Rust host-agent has a path-dep on shed-core, and the release
              # build (builder: rust) reads rust-toolchain.toml — a change to
              # either can break the shipped binary, so both must trigger the
              # differential + the release-snapshot (which is gated on this filter).
              - 'crates/shed-core/**'
              - 'crates/rust-toolchain.toml'
              - 'crates/Cargo.toml'
              - 'crates/Cargo.lock'
              - 'cmd/shed-host-agent/**'
              - 'sdk/**'
              - 'internal/ext/protocol/**'
              - 'tests/host-agent-diff/**'
              - 'docs/development/host-agent-wire-catalog.md'
              - 'go.mod'
              - 'go.sum'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/docs.yml'
            ci:
              - '.github/workflows/**'
              - '.goreleaser.yaml'
              - 'scripts/release/**'
              - 'Makefile'
              - 'desktop/Makefile'

  test:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      # Root module tests. The nested sdk module gets compile + vet coverage
      # from the lint job (`make lint` runs `cd sdk && go vet ./...`); we do
      # NOT run `cd sdk && go test` here because sdk/bootstrap's TestRunSuccess
      # is an SSH integration test that isn't robust on the CI runner (it drives
      # the system ssh binary against a spawned test server). Keeping sdk out of
      # the CI test command matches pre-existing behavior; the imported
      # extensions code's use of the sdk is fully compile-checked.
      - run: go test -v ./...

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1

  plugin:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Claude Code plugin manifest and skills
        run: scripts/validate-plugin.sh
      - name: Rust toolchain
        # release-scripts-test.sh exercises update-version.sh's desktop bump,
        # which regenerates both Cargo locks (crates/ + the Tauri workspace).
        run: rustup toolchain install stable --profile minimal
      - name: Release scripts self-test (release-plan.sh + update-version.sh)
        # Runs in a temp copy — never dirties the checkout. Gated go||ci like
        # the rest of this job; the `ci` filter includes scripts/release/**,
        # so any edit to the release scripts always runs this.
        run: scripts/release/release-scripts-test.sh

  release-snapshot:
    name: GoReleaser snapshot (artifact sanity)
    needs: changes
    # Also gated on `hostagent`: the SHIPPED shed-host-agent binary is now built
    # from crates/shed-host-agent/ (builder: rust), so a crates-only PR must run
    # this snapshot to prove the release build still resolves. The `hostagent`
    # filter already scopes crates/shed-host-agent/** (+ cmd/shed-host-agent/**).
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.hostagent == 'true' || needs.changes.outputs.ci == 'true' }}
    # macos-latest matches the real release runner. The shipped shed-host-agent is
    # Rust (builder: rust / cargo zigbuild — cross-builds the linux targets from
    # macOS via zig); the detached Go rollback ids still compile here (darwin needs
    # CGO for Touch ID). goreleaser cross-builds the Go linux ids (CGO off) fine.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Rust + cross tooling for `builder: rust`. goreleaser's rust builder shells
      # out to `cargo zigbuild`, which needs zig + cargo-zigbuild; it auto-runs
      # `rustup target add`, but pre-adding fails fast if a target is unavailable.
      - name: Rust toolchain + zig cross tooling
        run: |
          # components: crates/rust-toolchain.toml declares rustfmt+clippy, which
          # rustup would auto-install on first cargo use in crates/ (a flaky-network
          # CI-only failure risk); install them explicitly up front.
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin \
                            aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu
          # cargo-zigbuild pinned to the locally-validated version (reproducibility).
          # zig itself is brew-current: a zig bump is a LOUD build failure caught
          # by this snapshot job before any tag (not a silent ship); pinning zig
          # harder is a tracked follow-up (see .goreleaser.yaml glibc-floor note).
          brew install zig
          cargo install --locked --version 0.23.0 cargo-zigbuild
      # First-ever CI exercise of the darwin build-tag half (the Go rollback
      # shed-host-agent's touchid_darwin.go, CGO) — de-risks the macos release job.
      - name: Run tests
        run: go test ./...
      - name: GoReleaser snapshot build
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.2
          args: release --snapshot --clean
      - name: Assert release artifacts
        run: |
          set -euo pipefail
          # (i) shed-machine-rc archives: darwin+linux × amd64+arm64, each containing
          # EXACTLY the one binary (ids: selectors must keep other builds out).
          for tgz in dist/shed-machine-rc_*.tar.gz; do
            entries=$(tar tzf "$tgz" | grep -c .)
            bins=$(tar tzf "$tgz" | grep -c '^shed-machine-rc$')
            { [ "$entries" = "1" ] && [ "$bins" = "1" ]; } || { echo "::error::$tgz must contain exactly the shed-machine-rc binary and nothing else"; tar tzf "$tgz"; exit 1; }
          done
          for os in darwin linux; do
            for arch in amd64 arm64; do
              ls "dist/shed-machine-rc_${os}_${arch}.tar.gz" >/dev/null || { echo "::error::missing dist/shed-machine-rc_${os}_${arch}.tar.gz"; exit 1; }
            done
          done
          # (ii) per-arch shed-machine-rc .debs, named to match apt-charliek's glob.
          ls dist/shed-machine-rc_*_amd64.deb dist/shed-machine-rc_*_arm64.deb
          # (iii) ALL FOUR shed-host-agent archives (now Rust) carry the binary AND
          # the example config.
          workdir="$(mktemp -d)"
          for os in darwin linux; do
            for arch in amd64 arm64; do
              tgz="dist/shed-host-agent_${os}_${arch}.tar.gz"
              ls "$tgz" >/dev/null || { echo "::error::missing $tgz"; exit 1; }
              tar tzf "$tgz" | grep -qx 'shed-host-agent' || { echo "::error::$tgz missing shed-host-agent binary"; tar tzf "$tgz"; exit 1; }
              tar tzf "$tgz" | grep -qx 'extensions.example.yaml' || { echo "::error::$tgz missing extensions.example.yaml"; tar tzf "$tgz"; exit 1; }
            done
          done
          # Runtime check for the DARWIN binaries. macos-latest is arm64 (Apple
          # Silicon) with no guaranteed Rosetta, so only the NATIVE arm64 binary is
          # executed (`version` — catches a present-but-broken cross-build that
          # passes `tar tzf`); the x86_64 one is validated structurally with `file`
          # (never executed, so no Rosetta dependency). Assert the arm64 binary
          # keeps its linker ad-hoc signature (matches the Go baseline — no explicit
          # codesign step; a future zig that drops it fails loudly here, pre-tag).
          tar xzf dist/shed-host-agent_darwin_arm64.tar.gz -C "$workdir" shed-host-agent
          arm64_out="$("$workdir/shed-host-agent" version)"
          echo "darwin/arm64: $arm64_out"
          case "$arm64_out" in shed-host-agent\ *) ;; *) echo "::error::darwin/arm64 version output unexpected: $arm64_out"; exit 1;; esac
          codesign -dv "$workdir/shed-host-agent" 2>&1 | grep -q 'Signature=adhoc' || { echo "::error::arm64 shed-host-agent lost its ad-hoc signature"; codesign -dv "$workdir/shed-host-agent" 2>&1; exit 1; }
          rm -f "$workdir/shed-host-agent"
          tar xzf dist/shed-host-agent_darwin_amd64.tar.gz -C "$workdir" shed-host-agent
          amd64_file="$(file "$workdir/shed-host-agent")"
          echo "$amd64_file" | grep -q 'Mach-O.*x86_64' || { echo "::error::darwin/amd64 is not a well-formed x86_64 Mach-O: $amd64_file"; exit 1; }
          echo "darwin/amd64: $amd64_file"
          # (iv) rollback insurance: the detached Go ids still compiled.
          python3 - <<'PY'
          import json,sys
          arts=json.load(open('dist/artifacts.json'))
          seen={}
          for a in arts:
              ex=a.get('extra') or {}
              if a.get('type')=='Binary' and ex.get('ID') in ('shed-host-agent-darwin','shed-host-agent-linux'):
                  seen.setdefault(ex['ID'],set()).add(f"{a.get('goos')}/{a.get('goarch')}")
          want={'shed-host-agent-darwin':{'darwin/amd64','darwin/arm64'},'shed-host-agent-linux':{'linux/amd64','linux/arm64'}}
          if {k:seen.get(k) for k in want}!={k:v for k,v in want.items()}:
              print(f"::error::Go rollback builds missing from artifacts.json: got {seen}");sys.exit(1)
          print("Go rollback ids present:",{k:sorted(v) for k,v in seen.items()})
          PY
          rm -rf "$workdir"
          echo "release snapshot artifacts OK"

  # ---- desktop / crates legs (imported from shed-desktop's ci.yml) ----------

  swift:
    name: swift · build · test · e2e
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
      - name: Swift toolchain
        run: swift --version
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc --version && cargo --version
      - name: Build (Rust core + Swift)
        # `make build` runs scripts/build-core.sh (staticlib + UniFFI bindings +
        # xcframework) before `swift build` — the .binaryTarget path must exist.
        run: make build
      - name: Rust core — test + clippy
        run: make core-test core-lint
      - name: Swift unit tests
        run: make test
      - name: Bundle
        run: ./scripts/bundle.sh debug
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Hermetic E2E (Rust core — default)
        # Default-on since M0: with no flag the Rust shed-core backs reads/
        # lifecycle/create. Headless GUI launch via `open`; the screenshot op
        # renders in-process so no screen-recording TCC grant is needed.
        # wait_alive asserts identify.core=rust, and a Rust-adapter construction
        # failure now fails the host loudly (no silent Swift fallback), so a
        # false-green can't slip through. Slower CI gets a wider wait budget.
        run: SHED_DESKTOP_TEST_TIMEOUT_SCALE=4 uv run --group test pytest tools/shedtest -q
      - name: Hermetic E2E (Swift fallback — SHED_DESKTOP_RUST_CORE=0)
        # The rollback escape hatch (kept ≥2 releases): the legacy Swift URLSession
        # path. wait_alive asserts identify.core=swift, so the fallback stays
        # reachable and green.
        run: SHED_DESKTOP_RUST_CORE=0 SHED_DESKTOP_TEST_TIMEOUT_SCALE=4 uv run --group test pytest tools/shedtest -q
      - name: M0 ship-gates (arm64 + cold-launch + golden cross-backend byte-diff)
        # The deferred Phase-1 safety nets for the default flip: arm64-only Mach-Os,
        # a cold-launch budget, and a BYTE-IDENTICAL Rust-vs-Swift IPC payload diff
        # (the cross-backend parity guard). Runs against the debug bundle here for a
        # continuous per-PR guard; `make m0-gates` runs the same checks on a release
        # bundle for the pre-ship size budget. A slower CI runner gets a wider
        # cold-launch budget.
        #
        # Size budget is a wider 70 MB here because this measures the *unstripped
        # debug* bundle, whose size tracks the CI Swift/Xcode toolchain (the same
        # branch is ~52 MB locally). The shipped artifact is the *release* bundle,
        # tightly gated at 20 MB by `make m0-gates` — this coarse debug tripwire only
        # needs to catch an explosion, not shave megabytes.
        run: >
          SHED_DESKTOP_TEST_TIMEOUT_SCALE=4
          SHED_DESKTOP_COLD_LAUNCH_BUDGET_S=30
          SHED_DESKTOP_SIZE_BUDGET_MB=70
          uv run --group test python tools/shedtest/m0_ship_gates.py
      - name: Real-launch smoke
        # Non-test launch on a fresh runner (undetermined notification auth) —
        # exercises the real SystemNotificationPresenter path the hermetic suite
        # can't reach. Regression guard for the v0.0.2 SIGTRAP (issue #2).
        run: ./scripts/smoke-real-launch.sh
      - name: Launch/reopen window smoke
        # Real launch path the hermetic suite gates off: a user launch opens the
        # dashboard and reopening the running app reaches it. Guards issue #4.
        run: ./scripts/smoke-launch-window.sh

  core-linux:
    name: core-linux (${{ matrix.arch }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' }}
    # Both arches on CI: ubuntu-latest was already x86_64; the arm64 leg (free on
    # public repos) covers the .deb's other target. Runs cargo directly on the
    # runner (not Docker) — same as the old repo, and faster.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustc --version && cargo --version
      - name: C toolchain (ring's crypto backend needs build-essential)
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: shed-core — test + clippy (Linux)
        # Scoped to -p shed-core so the macOS-only shed-core-ffi (uniffi) is never
        # dragged in. --all-targets runs the pinned-TLS verifier + redirect/
        # non-https fail-closed tests here; the e2e's plain-HTTP mock never
        # exercises the pin/token paths, so they stay cargo-only on Linux.
        run: |
          cargo test -p shed-core --all-targets --locked
          cargo clippy -p shed-core --all-targets --locked -- -D warnings

  # The Go-vs-Rust host-agent differential leg (Phase 3 leg 3a.1). One Linux job
  # covers BOTH the standalone Rust daemon's build+test+clippy (so it can't Mac-dev
  # bit-rot — it persists as the 3a.2 headless fallback) AND the hermetic
  # differential harness that spawns both daemon binaries and asserts equal
  # wire-visible output. Go + Rust + Python on one runner (the "third pytest suite").
  host-agent-diff:
    name: host-agent-diff (Go vs Rust)
    needs: changes
    if: ${{ needs.changes.outputs.hostagent == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustc --version && cargo --version
      - name: C toolchain (ring's crypto backend needs build-essential)
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - uses: astral-sh/setup-uv@v6
      - name: Rust host-agent — test + clippy (Linux)
        working-directory: crates
        run: |
          cargo test -p shed-host-agent --all-targets --locked
          cargo clippy -p shed-host-agent --all-targets --locked -- -D warnings
      - name: Go-vs-Rust differential + golden runners
        # Builds both daemon binaries (conftest) and runs the pytest differential
        # + the Go and Rust golden-fixture runners.
        run: make test-host-agent-diff

  deb:
    name: deb
    needs: changes
    # The shipped .deb builds from the Tauri client, so a desktop/tauri/**-only
    # change must rebuild + revalidate it (alongside crates/packaging/linux).
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.packaging == 'true' || needs.changes.outputs.tauri == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustc --version && cargo --version
      - name: Tauri (WebKitGTK) build deps + nfpm
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update && sudo apt-get install -y nfpm
      - name: Node (the Vite/React frontend bundle)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/tauri/ui/package-lock.json
      - name: Frontend bundle (generate_context! needs tauri/ui/dist)
        run: cd tauri/ui && npm ci && npm run build
      - name: Build the Tauri .deb
        # build-deb.sh cargo-builds directly on the runner (not Docker) — same as
        # the old repo. Its SCRIPT_DIR is absolute, so `desktop` working-dir +
        # a relative invocation resolve REPO_ROOT=desktop, CRATES_DIR=crates.
        run: ./linux/scripts/build-deb.sh 0.0.1-ci
      - name: Install-validate in a clean container
        # apt-installs the .deb (resolving its runtime deps) in a fresh ubuntu:24.04
        # and asserts the binary launches under Xvfb + answers identify, the bundled
        # shedctl drives it, and the polkit action is present.
        run: |
          # shellcheck disable=SC2012  # controlled out/ dir, glob is safe
          ./linux/scripts/validate-deb.sh "$(ls -t out/shed-desktop_*.deb | head -1)"

  tauri-linux:
    name: tauri-linux
    needs: changes
    if: ${{ needs.changes.outputs.tauri == 'true' || needs.changes.outputs.harness == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The Docker legs' Make prereq (tauri-ui-build) runs `npm run build` on the
      # HOST, so the frontend deps must be installed here first (same as old repo).
      - name: Node (the Vite/React frontend bundle)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/tauri/ui/package-lock.json
      - name: Frontend deps
        run: cd desktop/tauri/ui && npm ci
      # The Tauri crate's Linux-only approval-seam tests (polkit/libnotify gate is
      # fail-closed: never Approved without a real auth). Docker (ubuntu:24.04),
      # same image as the render gate below; no display needed.
      - name: Tauri crate tests (Linux)
        run: make -C desktop tauri-test-linux
      # The render gate: builds the frontend + the Tauri app and runs the
      # --target tauri hermetic e2e on WebKitGTK 2.44 under Xvfb (the pinned
      # WebView = the real CSS/render gate). GitHub runners allow privileged
      # docker run for the WebKitGTK web-process sandbox.
      - name: Tauri render gate + hermetic E2E (WebKitGTK)
        run: make -C desktop tauri-build-linux

  tauri-mac:
    name: tauri-mac
    needs: changes
    if: ${{ needs.changes.outputs.tauri == 'true' || needs.changes.outputs.harness == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustc --version && cargo --version
      - name: Node (the Vite/React frontend bundle)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/tauri/ui/package-lock.json
      - name: Frontend deps
        run: cd desktop/tauri/ui && npm ci
      - name: Tauri clippy (standalone workspace)
        run: make -C desktop tauri-lint
      - uses: astral-sh/setup-uv@v6
      - name: Hermetic Tauri E2E (macOS WKWebView)
        # A wider timeout scale buys headroom on a shared CI runner (as the swift
        # + tauri-linux legs do). WKWebView needs no Xvfb; the mac screenshot op is
        # TCC-gated so it's skipped here (the WebKitGTK leg is the screenshot gate).
        run: SHED_TAURI_TEST_TIMEOUT_SCALE=4 make -C desktop e2e-tauri

  docs-build:
    name: docs build
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - run: uv sync --group docs
      - run: uv run mkdocs build

  # Single required check for the `main` ruleset. `if: always()` + an explicit
  # per-job result scan is load-bearing: with the path-filter above, a leg that
  # doesn't apply is `skipped`, and a plain `needs:` gate would itself skip —
  # leaving the required check unreported and the PR unmergeable forever. Here
  # skipped counts as pass; only failure/cancelled fails the gate.
  ci-success:
    name: ci-success
    if: always()
    needs: [changes, test, lint, plugin, release-snapshot, swift, core-linux, host-agent-diff, deb, tauri-linux, tauri-mac, docs-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require no job failed (skipped-by-filter counts as pass)
        run: |
          results="${{ needs.changes.result }} ${{ needs.test.result }} ${{ needs.lint.result }} ${{ needs.plugin.result }} ${{ needs.release-snapshot.result }} ${{ needs.swift.result }} ${{ needs.core-linux.result }} ${{ needs.host-agent-diff.result }} ${{ needs.deb.result }} ${{ needs.tauri-linux.result }} ${{ needs.tauri-mac.result }} ${{ needs.docs-build.result }}"
          echo "job results: ${results}"
          for r in ${results}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::a required CI job did not pass (${results})"; exit 1 ;;
            esac
          done
          echo "all required jobs passed (success or skipped-by-filter)"
