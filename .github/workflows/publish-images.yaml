name: Publish Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.2.3)"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-vz:
    name: Publish VZ Images
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION_BARE="${VERSION#v}"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "bare=${VERSION_BARE}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build shed-agent (linux/arm64)
        run: |
          GOOS=linux GOARCH=arm64 go build \
            -ldflags "-s -w \
              -X github.com/charliek/shed/internal/version.Version=${{ steps.version.outputs.bare }} \
              -X github.com/charliek/shed/internal/version.GitCommit=${{ steps.version.outputs.sha }} \
              -X github.com/charliek/shed/internal/version.BuildDate=${{ steps.version.outputs.date }}" \
            -o vz/shed-agent \
            ./cmd/shed-agent

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push shed-vz-base
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --target shed-vz-base \
            -t ghcr.io/charliek/shed-vz-base:${{ steps.version.outputs.tag }} \
            --label "org.opencontainers.image.version=${{ steps.version.outputs.bare }}" \
            --label "org.opencontainers.image.revision=${{ steps.version.outputs.sha }}" \
            --push \
            vz/

  publish-fc:
    name: Publish FC Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION_BARE="${VERSION#v}"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "bare=${VERSION_BARE}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build shed-agent (linux/amd64)
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w \
              -X github.com/charliek/shed/internal/version.Version=${{ steps.version.outputs.bare }} \
              -X github.com/charliek/shed/internal/version.GitCommit=${{ steps.version.outputs.sha }} \
              -X github.com/charliek/shed/internal/version.BuildDate=${{ steps.version.outputs.date }}" \
            -o firecracker/shed-agent \
            ./cmd/shed-agent

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push shed-fc-base
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target shed-fc-base \
            -t ghcr.io/charliek/shed-fc-base:${{ steps.version.outputs.tag }} \
            --label "org.opencontainers.image.version=${{ steps.version.outputs.bare }}" \
            --label "org.opencontainers.image.revision=${{ steps.version.outputs.sha }}" \
            --push \
            firecracker/
