name: Publish Images and Release

# Single source-of-truth for tag-driven publishing, for ALL release
# components (the manifest-selected release model — see RELEASING.md):
#
#   release-plan                    (~10 s)   which components does this tag
#                                             ship? (ship_server /
#                                             ship_host_agent /
#                                             ship_desktop, plus
#                                             ship_goreleaser = either of the
#                                             first two). Fails LOUDLY on
#                                             a re-dispatched pre-retirement
#                                             tag whose own release-plan.sh
#                                             says ship_machine_rc=true (the
#                                             component was retired, plan 010).
#                                             When ship_desktop, it also runs
#                                             the desktop signing gate: a
#                                             STABLE tag without all six Apple
#                                             secrets fails here, before
#                                             anything publishes. When
#                                             ship_server on a tag push, the
#                                             server signing gate likewise
#                                             requires the four Developer ID
#                                             secrets (plan 028 D4)
#
#   Server component (ship_server):
#   0. server-signing-preflight     (~1 min)  tag push only: imports the
#                                             Developer ID cert and signs +
#                                             verifies a scratch binary, so a
#                                             bad cert/password/identity/team
#                                             or timestamp fails before any
#                                             image publishes; every image job
#                                             needs it
#   1. publish-build-tools          (~2 min)  shed-build-tools image
#   2. publish-vz, publish-fc       (~10 min) runtime images, need (1)
#   3. smoke                        (~1 min)  reusable smoke-linux gate
#                                             (no needs — runs in parallel
#                                             with the image chain)
#
#   Goreleaser components (ship_goreleaser — server, host-agent):
#   4. release                      (~5 min)  one goreleaser invocation PER
#                                             SHIPPING component (config order
#                                             server → host-agent,
#                                             .goreleaser.<component>.yaml) +
#                                             the apt-charliek publish
#                                             dispatch — fires only on
#                                             tag-push; on server tags gated
#                                             on (1)-(3), helper-only tags run
#                                             it with the image chain skipped
#
#   Desktop component (ship_desktop):
#   5. desktop-release-create                 gh release create — runs only
#                                             when NO goreleaser component
#                                             ships (else the first shipping
#                                             goreleaser invocation creates
#                                             the release + its body)
#   6. desktop-macos                          Tauri DMG + notarize + Sparkle
#                                             appcast — the default macOS
#                                             client as of 0.9.0; runs on
#                                             every ship_desktop tag, stable
#                                             and prerelease alike (the
#                                             former STABLE-only Swift
#                                             release job retired).
#   7. desktop-linux (matrix)                 shed-desktop .deb per arch
#   8. desktop-apt-dispatch                   apt-charliek dispatch (skips
#                                             prerelease *-* tags)
#
# The server chain keeps its strict ordering (the v0.5.2-era race fix: the
# apt-charliek dispatch must not publish a deb before its referenced
# ghcr images exist). The desktop chain orders uploads strictly AFTER
# goreleaser on combined tags: whichever goreleaser invocation runs first
# creates the release + owns the notes (`mode: keep-existing` — later
# invocations and desktop jobs only add assets, never touch the body). On a
# stable tag the body is the tag's curated CHANGELOG section
# (scripts/release/changelog-section.sh), whichever job creates the release.
#
# Skipped-needs audit (every desktop job — and now `release` itself —
# needs skippable jobs, so each carries an explicit `!cancelled() && …`
# or `always() && …` guard: a skipped upstream must not block, a FAILED
# upstream must, and a user-cancelled run must publish nothing). Traced
# per scenario (tag push; "helper" = host-agent with ship_server false):
#
#   job                      | server tag  | helper-only tag | desktop-only tag | combined (srv+desk)
#   -------------------------|-------------|-----------------|------------------|--------------------
#   release-plan             | run         | run             | run              | run
#   server-signing-preflight | run         | skip (ship)     | skip (ship)      | run
#   publish-build-tools      | run         | skip (ship)     | skip (ship)      | run
#   publish-vz/publish-fc    | run         | skip (needs)    | skip (needs)     | run
#   smoke                    | run         | skip (ship)     | skip (ship)      | run
#   release                  | run         | run (images     | skip (if:        | run
#                            |             |   skipped ok)   |   ship_goreleaser)|
#   desktop-release-create   | skip (ship) | skip (ship)     | run              | skip (goreleaser)
#   desktop-macos            | skip (ship) | skip (ship)     | run, after       | run, after
#                            |             |                 |   create ok      |   goreleaser ok
#   desktop-linux            |             |                 |   (see below)    |   (see below)
#   desktop-apt-dispatch     | skip (needs)| skip (needs)    | run              | run
#
#   A helper+desktop tag behaves like the combined column, except the
#   image chain skips (ship_server=false) while `release` still runs
#   (ship_goreleaser) — so desktop-release-create stays skipped and the
#   goreleaser invocation that runs first owns the release + notes.
#
#   The `release` job's own STEPS are gated per component, so a host-agent-only
#   tag runs the job with only the host-agent goreleaser invocation: the server
#   goreleaser step skips, the shed-server apt dispatch skips, and NO rootfs
#   images are published (the whole image chain is ship_server-gated).
#   (An `sx` component ran the same shape until plan 016 sunset it.)
#
# desktop-macos (Tauri) is the only mac desktop job as of 0.9.0: it runs on
# every ship_desktop tag, stable and prerelease alike — its `if:` is
# byte-identical to desktop-linux's, no prerelease/stable split at the job
# level. (Before 0.9.0 there was a second, mutually exclusive Swift job that
# owned STABLE tags only; it's retired — Swift sources stay for a later
# demolition.) The prerelease/stable split lives solely in
# update-appcast.py, which is unchanged: it emits the beta channel iff the
# tag has a `-`. desktop-linux + desktop-apt-dispatch are unaffected by that
# axis (the .deb builds on both; apt-dispatch's own *-* guard already skips
# prereleases).
#
#   Failure propagation: release-plan fails → everything skips (loud, by
#   design — includes the no-manifest-matches tag). On a server-shipping
#   tag, a failed server-signing-preflight skips all three image jobs (see
#   the truth table above publish-build-tools), and a failed/cancelled/
#   skipped preflight or image job blocks `release` (its `if:` requires all
#   five `== 'success'` when ship_server — stricter than `!= 'failure'` on
#   purpose: cancellation must not ship), which leaves
#   desktop-release-create skipped (ship_goreleaser=true) —
#   desktop-macos/linux then run but fail fast at `gh release upload`
#   (no release exists); re-run the failed job and the rerun restores
#   the full chain (`replace_existing_artifacts: true` makes goreleaser
#   re-runs replace their own assets). A FAILED `release` or
#   `desktop-release-create` skips desktop-macos / desktop-linux via the
#   `!= 'failure'` guards. A user-cancelled run publishes nothing
#   (`!cancelled()` on release/desktop-release-create).
#
# workflow_dispatch republishes re-run the image-publish chain (when
# ship_server) and, for desktop-shipping tags, the desktop asset jobs —
# both idempotent (--clobber uploads, appcast dedupe) **for tags at or
# after v0.9.0**. Before that the mac client was the Swift app, so
# republishing an older tag would overwrite its Swift DMG with a Tauri
# one and re-sign that version's appcast entry: same input, different
# client. desktop-macos guards against it and fails loudly. The `release` job
# stays gated on tag-push events so manual republishes never cut a new
# GitHub Release or re-push formulas/debs. Desktop jobs DO run on a
# dispatch of a desktop-shipping tag (release is skipped, not failed);
# desktop-release-create re-runs only for desktop-only tags and is
# idempotent (reuses the existing release). Dispatching a PRE-MIGRATION
# tag runs that tag's old two-output release-plan.sh — the shim in the
# release-plan step maps legacy ship_go to the goreleaser components so
# image republishes of old tags keep working.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.2.3)"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Which components does this tag ship? A component ships iff its version
  # manifest equals the tag (server: .claude-plugin/plugin.json; host-agent:
  # crates/shed-host-agent/VERSION; desktop:
  # desktop/VERSION, with the crates/tauri surfaces lockstep-verified).
  # scripts/release/release-plan.sh fails loudly when NO manifest matches
  # (forgotten update-version.sh run) and cross-checks the CHANGELOG's
  # **Ships:** line on stable tags, which fails this job and skips the
  # entire workflow — a silent no-op release is impossible.
  release-plan:
    name: Release plan
    runs-on: ubuntu-latest
    outputs:
      ship_server: ${{ steps.plan.outputs.ship_server }}
      ship_host_agent: ${{ steps.plan.outputs.ship_host_agent }}
      ship_desktop: ${{ steps.plan.outputs.ship_desktop }}
      # true iff either of server/host-agent — computed in the script
      # (bash-tested) so workflow expressions never re-derive it.
      ship_goreleaser: ${{ steps.plan.outputs.ship_goreleaser }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}

      - name: Compute the release plan
        id: plan
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            echo "::error::Version must start with 'v' (example: v1.2.3)"
            exit 1
          fi
          # stdout is exactly the ship_* key=value lines; diagnostics go
          # to stderr (still visible in the log).
          scripts/release/release-plan.sh "$VERSION" > plan.out
          # Old-tag guard (plan 010): the machine-rc component is RETIRED —
          # this workflow (from the dispatching ref) has no machine-rc jobs.
          # A POST-migration, PRE-retirement tag's own release-plan.sh (from
          # the checked-out tag) can still emit ship_machine_rc=true;
          # silently ignoring it would be exactly the silent-no-ship failure
          # the exit-1 guard exists to prevent. Scope by event: on a tag
          # PUSH (the only event whose `release` job builds goreleaser
          # artifacts) fail loudly; on a workflow_dispatch image republish
          # the `release` job never runs anyway (tag-push gated), so a hard
          # fail would only break the documented image-recovery path for
          # every pre-retirement tag — warn loudly and continue instead.
          if grep -q '^ship_machine_rc=true' plan.out; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::tag ${VERSION} ships the RETIRED machine-rc component and this workflow cannot build it. Build shed-machine-rc from the tag's own workflow (its ref carries the machine-rc jobs) or accept the gap. See RELEASING.md."
              exit 1
            fi
            echo "::warning::tag ${VERSION} planned ship_machine_rc=true, but the machine-rc component is retired — this dispatch republishes images only (the release job is tag-push gated) and no machine-rc artifact is affected. See RELEASING.md."
          fi
          # Legacy-tag shim: this workflow file comes from the DISPATCHING
          # ref (main), but the script above comes from the CHECKED-OUT tag.
          # A workflow_dispatch republish of a pre-migration tag therefore
          # runs the old two-output script (ship_go/ship_desktop only). Old
          # ship_go shipped every Go artifact together — map it so image
          # republishes of old tags keep working. (No ship_machine_rc
          # mapping: this workflow has no machine-rc jobs to feed, and
          # pre-migration goreleaser artifacts only ever republish from the
          # tag's own workflow.)
          if grep -q '^ship_go=' plan.out && ! grep -q '^ship_server=' plan.out; then
            # Strict true|false capture — immune to trailing whitespace/CRLF
            # in the legacy script's output (a stray '\r' would otherwise
            # poison every downstream == 'true' comparison).
            go_val="$(sed -n 's/^ship_go=\(true\|false\).*/\1/p' plan.out | head -1)"
            {
              echo "ship_server=${go_val}"
              echo "ship_host_agent=${go_val}"
              echo "ship_goreleaser=${go_val}"
            } >> plan.out
          fi
          cat plan.out
          cat plan.out >> "$GITHUB_OUTPUT"

      # The desktop signing gate (plan 026 §3.11, shed#402): a STABLE desktop
      # tag must ship a Developer ID signed, notarized Mac build, so it fails
      # closed here, in the job every other job needs, BEFORE anything
      # publishes. (desktop-macos needs `release`, so by its first step the
      # images, brew/apt artifacts and the GitHub release would already be out.)
      # A prerelease passes with an ad-hoc note: the rc rehearsal path. Each
      # flag is a presence boolean built from this workflow's own secrets — the
      # same six CAN_NOTARIZE reads in desktop-macos — so no secret value ever
      # reaches the script. desktop-macos re-runs the gate after its checkout
      # as a backstop. release-scripts-test.sh asserts both invocations, their
      # six flags, this step's ship_desktop condition and its position, and
      # EXECUTES both steps' scripts (this fallback's version test included).
      - name: Desktop signing gate (a stable desktop tag fails closed)
        if: steps.plan.outputs.ship_desktop == 'true'
        env:
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/release/desktop-signing-gate.sh ]; then
            # Only a manual dispatch checks out a tag older than its workflow,
            # and the tags that predate the gate are the pre-0.9.0 ones (v0.8.0
            # and v0.8.1 ship desktop). Those alone skip it, so their image
            # republish keeps working: desktop-macos refuses a pre-0.9.0 mac
            # republish at its first step. Only a bare v0.0.Z-v0.8.Z tag
            # qualifies, no suffix of any kind. Anything else without the gate
            # fails closed.
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] \
              && [[ "${TAG}" =~ ^v0\.[0-8]\.(0|[1-9][0-9]*)$ ]]; then
              echo "::warning::${TAG} predates scripts/release/desktop-signing-gate.sh (a pre-0.9.0 tag); skipping the gate for this dispatch (desktop-macos refuses a pre-0.9.0 mac republish)."
              exit 0
            fi
            echo "::error::scripts/release/desktop-signing-gate.sh is missing from ${TAG}'s checkout; only a workflow_dispatch of a pre-0.9.0 tag may run without it."
            exit 1
          fi
          scripts/release/desktop-signing-gate.sh "${TAG}" \
            --has MACOS_CERTIFICATE_P12_BASE64=${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }} \
            --has MACOS_CERTIFICATE_PASSWORD=${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }} \
            --has SHED_DESKTOP_DEVELOPER_ID_IDENTITY=${{ secrets.SHED_DESKTOP_DEVELOPER_ID_IDENTITY != '' }} \
            --has APPLE_ID=${{ secrets.APPLE_ID != '' }} \
            --has APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID != '' }} \
            --has APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}

      # The server signing gate (plan 028 D4, #304): a server tag must ship a
      # Developer ID signed ShedServer.app, so the four secrets the server's
      # signing reads must exist; missing ones fail here, before anything
      # publishes. Any tag fails closed, prerelease included: the release job
      # has no ad hoc server path. Presence booleans only, as for the desktop
      # gate. Tag push only: `release`, the one job that signs, runs only on a
      # tag push, and a tag push runs this workflow from the tag's own commit,
      # so the script is always in the checkout. A workflow_dispatch republish
      # (this file from main, an older tag checked out) signs nothing, so it
      # skips this step and needs no missing-script fallback.
      # release-scripts-test.sh asserts this step's condition, its four flags
      # and its position (right after the desktop gate), and executes it.
      - name: Server signing gate (a server tag fails closed)
        if: steps.plan.outputs.ship_server == 'true' && github.event_name == 'push'
        env:
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          scripts/release/server-signing-gate.sh "${TAG}" \
            --has MACOS_CERTIFICATE_P12_BASE64=${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }} \
            --has MACOS_CERTIFICATE_PASSWORD=${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }} \
            --has SHED_DESKTOP_DEVELOPER_ID_IDENTITY=${{ secrets.SHED_DESKTOP_DEVELOPER_ID_IDENTITY != '' }} \
            --has APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID != '' }}

  # Plan 028 D4 (#304): prove the server's Developer ID signing works before
  # anything publishes. The gate above only knows the secrets exist; this job
  # imports the certificate into a throwaway keychain, signs a scratch copy of
  # a small Mach-O exactly as the release hook signs shed-server (identifier,
  # entitlements, --timestamp), and runs the hook's own required checks
  # (macos-server-app.sh --verify: Developer ID authority, Team ID, secure
  # timestamp, designated requirement, entitlements). A bad certificate,
  # password, identity string, team or timestamp server fails here, and every
  # image job needs this one.
  #
  # Tag push only, like the gate: a workflow_dispatch image republish never
  # runs `release`, so it needs no signing, and an older tag's checkout may
  # lack the scripts. The image jobs therefore accept a SKIPPED preflight only
  # off a tag push. The truth table, for the three image jobs:
  #
  #   event    | ships server | preflight         | publish-build-tools, publish-vz, publish-fc
  #   ---------|--------------|-------------------|---------------------------------------------
  #   push     | yes          | success           | run (vz/fc after build-tools succeeds)
  #   push     | yes          | failure/cancelled | skip: nothing publishes, so `release` skips
  #   push     | yes          | skipped (*)       | skip: fail closed
  #   push     | no           | skipped           | skip (ship_server)
  #   dispatch | yes          | skipped           | run: an image republish needs no signing
  #   dispatch | no           | skipped           | skip (ship_server)
  #   either   | (release-plan failed) skipped     | skip (release-plan must succeed)
  #
  #   (*) unreachable with this `if:`; if an edit ever skipped the preflight on
  #   a tag push, the images would not publish rather than publish unproven.
  #
  # `release` also lists this job and, when ship_server, requires it to be
  # 'success'; a host-agent-only or desktop-only tag never looks at it.
  server-signing-preflight:
    name: Server signing preflight
    needs: release-plan
    if: needs.release-plan.outputs.ship_server == 'true' && github.event_name == 'push'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}
          persist-credentials: false

      # The same import as desktop-macos's, into this job's own keychain.
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/cert.p12"' EXIT
          kc="$RUNNER_TEMP/shed-server-signing.keychain-db"
          kp="$(openssl rand -base64 24)"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc"
          # The identity (certificate + key) must be in THIS keychain, so a failed
          # import fails here. Its trust is checked after signing (--verify).
          ids="$(security find-identity -p codesigning "$kc")"
          if ! grep -Eq '^ *[1-9][0-9]* identities found' <<<"$ids"; then
            echo "::error::no codesigning identity was imported into $kc"
            exit 1
          fi
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      # A copy of /usr/bin/true stands in for shed-server: a small Mach-O that
      # every runner has. It is signed the way macos-server-app.sh signs the
      # real binary, then checked by that script's own --verify.
      - name: Sign and verify a scratch binary (Developer ID, timestamped)
        env:
          SHED_SERVER_SIGNING: required
          SHED_SERVER_SIGN_IDENTITY: ${{ secrets.SHED_DESKTOP_DEVELOPER_ID_IDENTITY }}
          SHED_SERVER_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/server-signing-preflight/shed-server"
          mkdir -p "$(dirname "$scratch")"
          cp /usr/bin/true "$scratch"
          case "$(file -b "$scratch")" in
            *Mach-O*) ;;
            *) echo "::error::/usr/bin/true is not a Mach-O on this runner: $(file -b "$scratch")"; exit 1 ;;
          esac
          codesign --force --sign "$SHED_SERVER_SIGN_IDENTITY" \
            --identifier ai.stridelabs.shed-server \
            --entitlements internal/vz/entitlements.plist \
            --timestamp "$scratch"
          scripts/release/macos-server-app.sh --verify "$scratch"

      - name: Delete signing keychain
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/cert.p12"
          kc="$RUNNER_TEMP/shed-server-signing.keychain-db"
          if [ -f "$kc" ]; then
            security delete-keychain "$kc"
          fi

  publish-build-tools:
    name: Publish shed-build-tools
    needs: [release-plan, server-signing-preflight]
    # Explicit status checks, not GitHub's implicit success(): a SKIPPED
    # preflight (a workflow_dispatch republish) must not block the images, but
    # a failed one must, and so must a preflight skipped on a tag push (the
    # truth table above server-signing-preflight). A failed release-plan (the
    # signing gates included) skips the image chain; a cancelled run publishes
    # nothing.
    if: >-
      !cancelled() &&
      needs.release-plan.result == 'success' &&
      needs.release-plan.outputs.ship_server == 'true' &&
      (needs.server-signing-preflight.result == 'success' ||
       (github.event_name != 'push' && needs.server-signing-preflight.result == 'skipped'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            echo "::error::Version must start with 'v' (example: v1.2.3)"
            exit 1
          fi
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build + push the build-tools image first. The publish-vz /
      # publish-fc jobs need:tag to be on ghcr before they start so
      # they can `FROM` / `docker run` it during image build. See
      # docs/reference/build-tools.md for the versioning model.
      #
      # Build for both amd64 (used by publish-fc, runs on ubuntu-latest
      # x86_64) and arm64 (used by publish-vz, runs on ubuntu-24.04-arm).
      # docker buildx handles the multi-arch manifest.
      - name: Build and push shed-build-tools
        uses: docker/build-push-action@v6
        with:
          context: build-tools
          file: build-tools/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/charliek/shed-build-tools:${{ steps.version.outputs.tag }}
            ghcr.io/charliek/shed-build-tools:latest

  publish-vz:
    name: Publish VZ Images
    # Gated on ship_server through publish-build-tools: unless it succeeded,
    # this skips. The preflight is checked again here, directly, with the same
    # skipped-vs-failed rule as publish-build-tools (the truth table above
    # server-signing-preflight): a dispatch republish's skipped preflight
    # passes, a failed one, or one skipped on a tag push, blocks. `!cancelled()`
    # rather than the implicit success(), which a skipped preflight would fail.
    needs: [publish-build-tools, server-signing-preflight]
    if: >-
      !cancelled() &&
      needs.publish-build-tools.result == 'success' &&
      (needs.server-signing-preflight.result == 'success' ||
       (github.event_name != 'push' && needs.server-signing-preflight.result == 'skipped'))
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            echo "::error::Version must start with 'v' (example: v1.2.3)"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} does not exist"
            exit 1
          fi
          VERSION_BARE="${VERSION#v}"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "bare=${VERSION_BARE}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build shed binaries
        run: |
          LDFLAGS="-s -w \
            -X github.com/charliek/shed/internal/version.Version=${{ steps.version.outputs.bare }} \
            -X github.com/charliek/shed/internal/version.GitCommit=${{ steps.version.outputs.sha }} \
            -X github.com/charliek/shed/internal/version.BuildDate=${{ steps.version.outputs.date }}"
          # In-VM binaries staged into the Dockerfile build context.
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o vz/shed-agent ./cmd/shed-agent
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o vz/shed-firstboot ./cmd/shed-firstboot
          # Guest extension binaries + /etc overlay staged into the same context.
          # Same stamps as shed-agent above — bare version, not git-describe's
          # v-prefixed form (one rootfs, one version convention).
          VERSION="${{ steps.version.outputs.bare }}" \
          GIT_COMMIT="${{ steps.version.outputs.sha }}" \
          BUILD_DATE="${{ steps.version.outputs.date }}" \
            ./scripts/stage-guest-binaries.sh vz arm64
          # Host-side CLI used to drive OCI conversion + push.
          mkdir -p bin
          go build -ldflags "$LDFLAGS" -o bin/shed ./cmd/shed

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shed-overlay initramfs
        run: |
          ./scripts/build-initramfs.sh \
            --backend vz \
            --platform linux/arm64 \
            --output /tmp/shed-initrd-vz.img

      - name: Build OCI images (base, extensions, full)
        run: |
          # Local OCI store; shed image build writes here, shed image
          # push streams from here to ghcr.io.
          #
          # --platform is set explicitly (belt-and-suspenders): even if
          # CLI inference regresses, the runner is arm64 and these
          # images must boot on Apple Silicon.
          #
          # --source-ref pins the manifest's io.shed.source-ref
          # annotation to the registry ref we're about to push to, so
          # the remote server's resolveImage cache-hit check matches
          # on subsequent `shed create` pulls.
          mkdir -p /tmp/oci-store-vz
          # SHED_INSTALL_SHA busts BuildKit's content-blind bind-mount cache
          # when the staged agent/service files change (#227). Belt-and-
          # suspenders on a cold CI runner, but keeps the published layer's
          # cache key honest and matters if a shared buildx cache is enabled.
          install_sha="$(./scripts/install-input-sha.sh vz/)"
          echo "SHED_INSTALL_SHA=${install_sha}"
          for variant in base extensions full; do
            echo "=== building shed-vz-${variant} ==="
            ./bin/shed image build \
              --target "shed-vz-${variant}" \
              -n "${variant}" \
              --platform linux/arm64 \
              --source-ref "ghcr.io/charliek/shed-vz-${variant}:${{ steps.version.outputs.tag }}" \
              --initramfs /tmp/shed-initrd-vz.img \
              --output-dir /tmp/oci-store-vz \
              --build-arg "SHED_INSTALL_SHA=${install_sha}" \
              -f vz/Dockerfile \
              vz/
          done

      - name: Push OCI images to ghcr.io
        run: |
          # Server config is needed by shed image push to locate the
          # OCI store; minimal stub pointing at the build output.
          cat > /tmp/publish-server.yaml <<YAML
          name: publish
          http_port: 0
          ssh_port: 0
          default_backend: vz
          vz:
            vfkit_path: vfkit
            images_dir: /tmp/oci-store-vz
            instance_dir: /tmp/oci-store-vz/instances
            socket_dir: /tmp/oci-store-vz/sockets
            default_cpus: 2
            default_memory_mb: 1024
            default_disk_gb: 1
            console_port: 1024
            notify_port: 1026
            tcp_proxy_port: 1028
            start_timeout: 60s
            stop_timeout: 10s
          YAML
          for variant in base extensions full; do
            echo "=== pushing shed-vz-${variant}:${{ steps.version.outputs.tag }} ==="
            ./bin/shed -c /tmp/publish-server.yaml image push \
              "${variant}" \
              "ghcr.io/charliek/shed-vz-${variant}:${{ steps.version.outputs.tag }}"
          done

  publish-fc:
    name: Publish FC Images
    # Gated exactly like publish-vz (see its comment).
    needs: [publish-build-tools, server-signing-preflight]
    if: >-
      !cancelled() &&
      needs.publish-build-tools.result == 'success' &&
      (needs.server-signing-preflight.result == 'success' ||
       (github.event_name != 'push' && needs.server-signing-preflight.result == 'skipped'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            echo "::error::Version must start with 'v' (example: v1.2.3)"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} does not exist"
            exit 1
          fi
          VERSION_BARE="${VERSION#v}"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "bare=${VERSION_BARE}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build shed binaries
        run: |
          LDFLAGS="-s -w \
            -X github.com/charliek/shed/internal/version.Version=${{ steps.version.outputs.bare }} \
            -X github.com/charliek/shed/internal/version.GitCommit=${{ steps.version.outputs.sha }} \
            -X github.com/charliek/shed/internal/version.BuildDate=${{ steps.version.outputs.date }}"
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o firecracker/shed-agent ./cmd/shed-agent
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o firecracker/shed-firstboot ./cmd/shed-firstboot
          # Guest extension binaries + /etc overlay staged into the same context.
          VERSION="${{ steps.version.outputs.bare }}" \
          GIT_COMMIT="${{ steps.version.outputs.sha }}" \
          BUILD_DATE="${{ steps.version.outputs.date }}" \
            ./scripts/stage-guest-binaries.sh firecracker amd64
          mkdir -p bin
          go build -ldflags "$LDFLAGS" -o bin/shed ./cmd/shed

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shed-overlay initramfs
        run: |
          ./scripts/build-initramfs.sh \
            --backend firecracker \
            --platform linux/amd64 \
            --output /tmp/shed-initrd-fc.img

      - name: Build OCI images (base, extensions, full)
        run: |
          # See VZ job for rationale on --platform, --source-ref, and
          # SHED_INSTALL_SHA (#227 bind-mount cache-bust).
          mkdir -p /tmp/oci-store-fc
          install_sha="$(./scripts/install-input-sha.sh firecracker/)"
          echo "SHED_INSTALL_SHA=${install_sha}"
          for variant in base extensions full; do
            echo "=== building shed-fc-${variant} ==="
            ./bin/shed image build \
              --target "shed-fc-${variant}" \
              -n "${variant}" \
              --platform linux/amd64 \
              --source-ref "ghcr.io/charliek/shed-fc-${variant}:${{ steps.version.outputs.tag }}" \
              --initramfs /tmp/shed-initrd-fc.img \
              --output-dir /tmp/oci-store-fc \
              --build-arg "SHED_INSTALL_SHA=${install_sha}" \
              -f firecracker/Dockerfile \
              firecracker/
          done

      - name: Push OCI images to ghcr.io
        run: |
          cat > /tmp/publish-server.yaml <<YAML
          name: publish
          http_port: 0
          ssh_port: 0
          default_backend: firecracker
          firecracker:
            images_dir: /tmp/oci-store-fc
            instance_dir: /tmp/oci-store-fc/instances
            socket_dir: /tmp/oci-store-fc/sockets
            default_cpus: 2
            default_memory_mb: 1024
            default_disk_gb: 1
            console_port: 1024
            notify_port: 1026
            vsock_base_cid: 100
            bridge_name: shed-br0
            bridge_cidr: 172.30.0.1/24
            tap_prefix: shed-tap
            start_timeout: 60s
            stop_timeout: 10s
          YAML
          for variant in base extensions full; do
            echo "=== pushing shed-fc-${variant}:${{ steps.version.outputs.tag }} ==="
            ./bin/shed -c /tmp/publish-server.yaml image push \
              "${variant}" \
              "ghcr.io/charliek/shed-fc-${variant}:${{ steps.version.outputs.tag }}"
          done

  # Install-only smoke against the same commit. Gate the release on
  # this so a binary that can't even run cleanly on a fresh runner
  # doesn't ship — same regression class that broke v0.5.1. Note it
  # deliberately has no `needs` beyond release-plan: it runs in
  # parallel with the image chain (its gate on `release` is via that
  # job's needs).
  smoke:
    needs: release-plan
    if: needs.release-plan.outputs.ship_server == 'true'
    uses: ./.github/workflows/smoke-linux.yml

  # goreleaser + apt-charliek dispatches — one goreleaser invocation per
  # SHIPPING component (.goreleaser.{server,host-agent}.yaml, fixed
  # order). Only fires on tag-push events (not manual workflow_dispatch
  # republishes).
  #
  # The `if:` below is load-bearing; read it with these rules in mind:
  # * `!cancelled()` (NOT the implicit success()) lets the job evaluate
  #   over SKIPPED needs — on a helper-only tag (host-agent
  #   without server) the whole image chain skips and this job must still run. `always()` would be wrong: a user-cancelled run must publish
  #   nothing.
  # * GHA outputs are STRINGS and any non-empty string is truthy, so
  #   every comparison is an explicit == / != against 'true'.
  # * On a server-shipping tag the five upstream jobs must be exactly
  #   'success' — stricter than `!= 'failure'` on purpose: a cancelled or
  #   skipped image job must block the release (the v0.5.2-era race fix:
  #   apt-charliek must never index a deb whose referenced ghcr images
  #   don't exist), and so must a preflight that did not prove the
  #   Developer ID signing works (plan 028 D4). A host-agent-only tag skips
  #   the preflight with the rest of the server chain and never looks at it.
  release:
    name: Build and Release
    needs: [release-plan, server-signing-preflight, publish-build-tools, publish-vz, publish-fc, smoke]
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.release-plan.result == 'success' &&
      needs.release-plan.outputs.ship_goreleaser == 'true' &&
      (needs.release-plan.outputs.ship_server != 'true' ||
       (needs.server-signing-preflight.result == 'success' &&
        needs.publish-build-tools.result == 'success' &&
        needs.publish-vz.result == 'success' &&
        needs.publish-fc.result == 'success' &&
        needs.smoke.result == 'success'))
    # macos-latest: the shipped shed-host-agent is Rust (builder: rust / cargo
    # zigbuild — cross-builds the linux targets from macOS via zig). The Go
    # twin (cmd/shed-host-agent) was sunset (plan
    # 006-mtls-cleanup-hostagent-sunset.md). This mirrors the ci.yml
    # release-snapshot job so the snapshot is a faithful dry-run. The
    # image-publish jobs above keep their linux runners.
    runs-on: macos-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Sequential-invocation guard: goreleaser's git dirty-check runs on
      # every invocation, so before-hooks must not mutate tracked files
      # (none of the split configs run `go mod tidy` any more — assert the
      # tag is tidy instead) and the server config's generated
      # packaging/server.yaml.generated must stay gitignored or invocation
      # #2 would abort on a dirty tree.
      - name: Assert tidy go.mod + gitignored generated packaging
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          git check-ignore -q packaging/server.yaml.generated

      # The old inline "Verify plugin.json matches tag" step is gone: the
      # release-plan job owns manifest gating now (this job only runs when
      # release-plan already proved at least one goreleaser component's
      # manifest == tag, i.e. ship_goreleaser).

      - name: Run Tests
        run: go test ./...

      - name: Run Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1

      # Mint a release-bot App token scoped to charliek/homebrew-tap for
      # GoReleaser's `brews:` step (formula push). The App must be
      # installed on homebrew-tap (verify via sanity-check-app.yml).
      # Replaces the legacy HOMEBREW_TAP_TOKEN PAT — GoReleaser is
      # token-source-agnostic; it just uses HOMEBREW_TAP_TOKEN from the
      # env for git authentication.
      - name: Mint a homebrew-tap App token
        id: tap
        uses: actions/create-github-app-token@v3
        with:
          client-id:      ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_KEY }}
          owner:        charliek
          repositories: homebrew-tap
          # Defense-in-depth: explicit permission floor on the minted
          # token so a future widening of the App's installation perms
          # doesn't silently broaden what this token can do. GoReleaser
          # only needs contents:write on the tap repo (to push the
          # formula).
          permission-contents: write

      # The curated release body (plan 026 §3.11): the tag's own CHANGELOG
      # section, written OUTSIDE the checkout (goreleaser's dirty check would
      # refuse an untracked file in the tree). release-plan.sh's Ships check
      # already proved that section exists, through the same extractor.
      # Goreleaser components are stable-only, so this job never sees a
      # prerelease; the `*-*` arm keeps goreleaser's own changelog there, as
      # before.
      - name: Curated release notes (the tag's CHANGELOG section)
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${TAG}" in
            *-*)
              echo "::notice::${TAG} is a prerelease; goreleaser writes its own changelog body."
              echo "args=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              NOTES="${RUNNER_TEMP}/release-notes.md"
              scripts/release/changelog-section.sh "${TAG}" > "${NOTES}"
              echo "release body for ${TAG}: $(wc -l < "${NOTES}" | tr -d ' ') lines, starting:"
              head -n 5 "${NOTES}"
              echo "args=--release-notes=${NOTES}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # One invocation per SHIPPING component, fixed order server →
      # host-agent. Both configs use release.mode keep-existing +
      # replace_existing_artifacts, so whichever runs FIRST creates the GH
      # release and later invocations only add their assets. The FIRST one
      # therefore takes `--release-notes` (the curated CHANGELOG section above)
      # as the release body: server when it ships, else host-agent. A later
      # invocation's own changelog never replaces it (keep-existing).
      # Skipping a component means its artifacts are never built — no
      # release asset exists for apt-charliek's asset scan to index, and
      # its brew formula is never pushed (the published formula stays at
      # the component's last-shipped version).
      #
      # The server's darwin shed-server and ShedServer.app are Developer ID
      # signed by the build hook (plan 028 D4, #304), so the certificate is
      # imported right before the server invocation, the same import as
      # desktop-macos's. It adds the keychain to the user search list, which
      # is where the hook's `codesign --sign <identity>` finds the identity.
      # The keychain is deleted right after the server invocation (below), and
      # every step that runs third-party build code (the Rust toolchain
      # install, the host-agent invocation) comes after that delete.
      - name: Import Developer ID certificate
        if: success() && needs.release-plan.outputs.ship_server == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/cert.p12"' EXIT
          kc="$RUNNER_TEMP/shed-server-signing.keychain-db"
          kp="$(openssl rand -base64 24)"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc"
          # The identity (certificate + key) must be in THIS keychain, so a failed
          # import fails here. Its trust is checked after signing (--verify).
          ids="$(security find-identity -p codesigning "$kc")"
          if ! grep -Eq '^ *[1-9][0-9]* identities found' <<<"$ids"; then
            echo "::error::no codesigning identity was imported into $kc"
            exit 1
          fi
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Run GoReleaser (server)
        if: success() && needs.release-plan.outputs.ship_server == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          # Pinned to match the CI release-snapshot job so the snapshot is a
          # faithful proof of what the release runs (was `latest`).
          version: v2.15.3
          args: release --clean -f .goreleaser.server.yaml ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GoReleaser reads HOMEBREW_TAP_TOKEN from this env var (see the
          # split configs: brews[].repository.token). Feed it the
          # App-minted token instead of a PAT (one mint, reused by both
          # invocations — token TTL 1h, the job runs well under it).
          HOMEBREW_TAP_TOKEN: ${{ steps.tap.outputs.token }}
          # Read by scripts/release/macos-server-app.sh, the shed-server build
          # hook: `required` makes it sign with this identity and refuse
          # anything but a timestamped Developer ID signature from this team,
          # so an unsigned or ad hoc ShedServer.app can never ship.
          SHED_SERVER_SIGNING: required
          SHED_SERVER_SIGN_IDENTITY: ${{ secrets.SHED_DESKTOP_DEVELOPER_ID_IDENTITY }}
          SHED_SERVER_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Right after the server invocation, whatever its outcome. No third-party
      # build code runs while the certificate is imported: the two steps that
      # run it, the Rust toolchain install (`cargo install` runs dependency
      # build scripts, `brew install` formula code) and the host-agent
      # invocation (cargo zigbuild runs build.rs), come after this delete.
      # What runs before it is trusted at the release workflow's level: the
      # actions this job uses, and the repo's own code (tests, lint, release
      # notes, the server build) with the go.sum-pinned modules the shipped
      # binaries link. A no-op when the server did not ship (nothing was
      # imported). If the delete itself fails, the later steps' success()
      # skips them.
      - name: Delete signing keychain
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/cert.p12"
          kc="$RUNNER_TEMP/shed-server-signing.keychain-db"
          if [ -f "$kc" ]; then
            security delete-keychain "$kc"
          fi

      # Rust + cross tooling for `builder: rust` (mirrors release-snapshot).
      # goreleaser's rust builder shells out to `cargo zigbuild`, needing zig +
      # cargo-zigbuild; it auto-runs `rustup target add`, but pre-adding fails
      # fast if a target is unavailable. The build env SHED_HOST_AGENT_VERSION=
      # {{ .Version }} lives in .goreleaser.host-agent.yaml, so it applies
      # identically to the snapshot and this release — no per-job version
      # munging.
      # Only needed when the RUST component ships (the server config is pure Go)
      # — skipping saves ~3 min on server-only tags.
      # It runs here, after the signing keychain is deleted, not up front: its
      # `cargo install` runs dependency build scripts, which must not run while
      # the certificate is imported (plan 028, #304). ci.yml's release-snapshot
      # installs it first; that job imports no certificate, so its order there
      # does not matter.
      - name: Rust toolchain + zig cross tooling
        if: success() && needs.release-plan.outputs.ship_host_agent == 'true'
        run: |
          # Kept byte-identical to ci.yml's release-snapshot step (see the note
          # there): explicit rustfmt+clippy (rust-toolchain.toml declares them),
          # and cargo-zigbuild pinned to the validated version. zig is brew-current;
          # a zig bump is a loud failure caught by release-snapshot pre-tag.
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin \
                            aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu
          brew install zig
          cargo install --locked --version 0.23.0 cargo-zigbuild

      - name: Run GoReleaser (host-agent)
        if: success() && needs.release-plan.outputs.ship_host_agent == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.3
          # The release body only when this is the first shipping invocation
          # (no server): otherwise server already created the release.
          args: release --clean -f .goreleaser.host-agent.yaml ${{ needs.release-plan.outputs.ship_server != 'true' && steps.notes.outputs.args || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap.outputs.token }}

      # Mint a release-bot App token scoped to charliek/apt-charliek for
      # the publish dispatches. The App must be installed on apt-charliek
      # (verify via sanity-check-app.yml). Replaces the legacy
      # APT_DISPATCH_TOKEN PAT. Only minted when the deb-shipping component
      # is in the plan (server — host-agent has no deb; the retired
      # machine-rc's and the sunset sx's apt entries stay frozen at their
      # last-shipped release, i.e. none for sx, which never shipped).
      # NOTE: the dispatch is a freshness nudge only — apt-charliek
      # re-scans every tracked package's release ASSETS on every publish
      # run and ignores the dispatch payload for correctness, which is
      # exactly why unshipped components must produce no assets at all.
      - name: Mint an apt-charliek App token
        if: success() && needs.release-plan.outputs.ship_server == 'true'
        id: apt
        uses: actions/create-github-app-token@v3
        with:
          client-id:      ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_KEY }}
          owner:        charliek
          repositories: apt-charliek
          # POST /repos/.../dispatches requires contents:write.
          permission-contents: write

      - name: Trigger apt-charliek publish (shed-server)
        if: success() && needs.release-plan.outputs.ship_server == 'true'
        env:
          GH_TOKEN: ${{ steps.apt.outputs.token }}
        run: |
          # Retry the dispatch a few times — a transient network/API
          # blip shouldn't fail the release after GoReleaser already
          # succeeded. apt-charliek's publish workflow is idempotent so
          # a missed dispatch self-heals on the next release, but we
          # still want to flag genuinely persistent failures.
          for attempt in 1 2 3; do
            # Capture stderr so a real install-state failure (App not
            # installed on apt-charliek, scoped-perms mismatch, etc.)
            # is diagnosable from the workflow log without re-running.
            if gh api repos/charliek/apt-charliek/dispatches \
              --method POST \
              -f event_type=publish \
              -F "client_payload[package]=shed-server" \
              -F "client_payload[tag]=${{ github.ref_name }}" 2>&1; then
              echo "::notice::Watch apt publish at https://github.com/charliek/apt-charliek/actions"
              exit 0
            fi
            echo "::warning::dispatch attempt $attempt failed; sleeping $((attempt * 5))s"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::apt-charliek dispatch failed after 3 attempts — check the stderr above for the API error"
              exit 1
            fi
            sleep $((attempt * 5))
          done

  # ---- Desktop component (ported from shed-desktop's release.yml) -----------

  # Desktop-only tags need a GitHub Release to upload into; whenever ANY
  # goreleaser component ships, the first goreleaser invocation owns release
  # creation + the release body (mode: keep-existing — a pre-created
  # release would freeze this job's body, so this job must NOT run then).
  # Runs ONLY when ship_desktop && !ship_goreleaser. A stable tag's body is
  # its curated CHANGELOG section; a prerelease gets a placeholder.
  # Idempotent: reuses an existing release (e.g. a workflow_dispatch
  # republish of a desktop-only tag). `!cancelled()` (not `always()`): a
  # user-cancelled run must not create releases.
  desktop-release-create:
    name: Create desktop-only release
    needs: [release-plan, release]
    if: >-
      !cancelled() &&
      needs.release-plan.result == 'success' &&
      needs.release-plan.outputs.ship_desktop == 'true' &&
      needs.release-plan.outputs.ship_goreleaser != 'true' &&
      needs.release.result == 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}
          # No git push here (gh uses GH_TOKEN from env); don't leave the
          # checkout credential available to later steps.
          persist-credentials: false
      # The old repo's tag==VERSION==Cargo gate lived here; release-plan owns
      # that gate now (ship_desktop implies the lockstep check passed).
      - name: Create the release if absent (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — reusing it"
          else
            case "$TAG" in
              *-*)
                # Prerelease tags (the Tauri beta track) must not become the
                # repo's "latest" release, and have no CHANGELOG section.
                gh release create "$TAG" --title "$TAG" --prerelease \
                  --notes "Release $TAG — assets are uploading."
                ;;
              *)
                # A stable tag's body is its curated CHANGELOG section (plan
                # 026 §3.11), the same extractor release-plan.sh's Ships check
                # read. desktop-macos appends the notarization line after it.
                NOTES="${RUNNER_TEMP}/release-notes.md"
                scripts/release/changelog-section.sh "$TAG" > "$NOTES"
                gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
                ;;
            esac
          fi

  # macOS (Tauri app): the default macOS client as of 0.9.0 — runs on every
  # ship_desktop tag, stable and prerelease alike (the Swift release job that
  # used to own stable tags is retired; Swift sources stay for a later
  # demolition — see the follow-up ticket). Bundle (Sparkle.framework via
  # fetch-sparkle) → notarize+staple when the six Apple secrets exist
  # (CAN_NOTARIZE; a stable tag requires all six, enforced by the desktop
  # signing gate) → upload → EdDSA-sign for the Sparkle appcast → bot-push
  # docs/appcast.xml to main. Skip-safe gating: a skipped `release`
  # (desktop-only tag) or skipped `desktop-release-create` (combined tag)
  # must not block; a FAILED one must. This job's `if:` is byte-identical to
  # desktop-linux's — there is no prerelease/stable split left at the job
  # level. update-appcast.py is unchanged: it still emits the beta channel
  # iff the tag has a `-`. The `inputs.version ||` half keeps a
  # workflow_dispatch republish routing on the dispatched version, not the
  # branch ref_name.
  desktop-macos:
    name: Desktop macOS Tauri DMG + appcast
    needs: [release-plan, release, desktop-release-create]
    if: >-
      always() &&
      needs.release-plan.result == 'success' &&
      needs.release-plan.outputs.ship_desktop == 'true' &&
      needs.release.result != 'failure' &&
      needs.release.result != 'cancelled' &&
      needs.desktop-release-create.result != 'failure' &&
      needs.desktop-release-create.result != 'cancelled'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}
      # Sign + notarize only when the FULL six-secret prerequisite set is
      # present, else an ad-hoc (Gatekeeper-blocked) DMG. The identity
      # reaches the build step only when this is true. Only a PRERELEASE can
      # get here with it false: the desktop signing gate (release-plan, and
      # the backstop step below) refuses a stable tag without all six.
      CAN_NOTARIZE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.SHED_DESKTOP_DEVELOPER_ID_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
    steps:
      # The macOS client changed implementation at 0.9.0 (Swift -> Tauri), so a
      # republish is only idempotent for tags at or after it. Dispatching an
      # OLDER stable tag would build that tag's Tauri target and `--clobber` the
      # Swift DMG its users already installed, then replace that version's
      # appcast signature — same input, different client. Refuse instead: the
      # image-publish jobs are separate and still do their work, and a loud
      # failure here is the point (silently shipping a different app to an
      # existing release is the outcome worth failing over).
      - name: Guard — republishing a pre-0.9.0 tag's mac assets is not idempotent
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          # Only a manual dispatch can name an old tag; a tag push is always "now".
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "::notice::tag push for ${TAG} — guard not applicable."
            exit 0
          fi
          OLDEST="$(printf '%s\n0.9.0\n' "${VER%%-*}" | sort -V | head -1)"
          if [ "${VER%%-*}" != "0.9.0" ] && [ "${OLDEST}" = "${VER%%-*}" ]; then
            echo "::error::${TAG} predates the 0.9.0 Swift->Tauri promotion. Republishing"
            echo "::error::its mac assets would overwrite a Swift DMG with a Tauri one and"
            echo "::error::re-sign that version's appcast entry. Re-run the image jobs alone,"
            echo "::error::or cut a new tag — do not republish this one's desktop assets."
            exit 1
          fi
          echo "::notice::${TAG} is at or after the promotion — republish is idempotent."

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}
          # Don't persist GITHUB_TOKEN creds, so the appcast bot push
          # authenticates as the App token (and docs.yml runs).
          persist-credentials: false

      # Backstop for the release-plan job's desktop signing gate (plan 026
      # §3.11): the same script and the same six presence flags, before any
      # build, so this job can never build an ad-hoc DMG and push a STABLE
      # appcast entry for it. CAN_NOTARIZE (this job's env) is unchanged: a
      # prerelease still builds ad-hoc without the secrets. No fallback for a missing
      # script: this job's first step already refused every pre-0.9.0 dispatch.
      - name: Desktop signing gate (backstop, before any build)
        run: |
          scripts/release/desktop-signing-gate.sh "${TAG}" \
            --has MACOS_CERTIFICATE_P12_BASE64=${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }} \
            --has MACOS_CERTIFICATE_PASSWORD=${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }} \
            --has SHED_DESKTOP_DEVELOPER_ID_IDENTITY=${{ secrets.SHED_DESKTOP_DEVELOPER_ID_IDENTITY != '' }} \
            --has APPLE_ID=${{ secrets.APPLE_ID != '' }} \
            --has APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID != '' }} \
            --has APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}

      - name: Rust toolchain
        # The Tauri workspace (the sparkle-updater crate's build.rs + the shed-core
        # path-deps) compiles during the bundle step; install the toolchain first.
        run: |
          rustup toolchain install stable --profile minimal
          rustc --version && cargo --version

      - name: Node (the Vite/React frontend bundle)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/tauri/ui/package-lock.json

      - name: Frontend deps (tauri CLI + the beforeBuildCommand bundle)
        # bundle-tauri-mac.sh runs the tauri CLI from ui/node_modules, and the
        # tauri build's beforeBuildCommand rebuilds the frontend dist.
        run: cd desktop/tauri/ui && npm ci

      # Inert until all six Apple secrets exist; imports the Developer ID cert into
      # a throwaway keychain so codesign (in bundle-tauri-mac.sh) + notarization use
      # it.
      - name: Import Developer ID certificate
        if: env.CAN_NOTARIZE == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/cert.p12"' EXIT
          kc="$RUNNER_TEMP/shed-desktop-signing.keychain-db"
          kp="$(openssl rand -base64 24)"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      # tauri-dmg-mac = fetch-sparkle (make prereq) + bundle-tauri-mac.sh (ordered
      # Sparkle re-sign) + make-dmg.sh. Identity reaches the script only when
      # CAN_NOTARIZE, else the ad-hoc path (and make-dmg keeps the FIRST-LAUNCH
      # note). DMG name is ShedDesktop-<VERSION>.dmg where VERSION = desktop/VERSION
      # (== TAG#v by the release-plan lockstep check).
      - name: Build + bundle + DMG (Tauri)
        env:
          SHED_DESKTOP_DEVELOPER_ID_IDENTITY: ${{ env.CAN_NOTARIZE == 'true' && secrets.SHED_DESKTOP_DEVELOPER_ID_IDENTITY || '' }}
        run: make -C desktop tauri-dmg-mac

      - name: Unit tests (Tauri workspace)
        # The unit tests for THIS artifact — the Tauri standalone workspace
        # (no build-core.sh here).
        run: make -C desktop tauri-test

      # Notarize + staple BEFORE the upload + appcast signing (stapling rewrites the
      # DMG bytes, so sign_update must run against the stapled file). Gated on
      # CAN_NOTARIZE; notarize.sh also self-guards on the APPLE_* creds.
      - name: Notarize + staple (skipped without credentials)
        if: env.CAN_NOTARIZE == 'true'
        working-directory: desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./scripts/notarize.sh "build/ShedDesktop-${TAG#v}.dmg"

      - name: Detect DMG notarization status
        id: dmg_notarized
        working-directory: desktop
        run: |
          if xcrun stapler validate "build/ShedDesktop-${TAG#v}.dmg" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the DMG (+ notarization notes on desktop-only releases)
        # When any goreleaser component ships, goreleaser owns the notes; on
        # a desktop-only release, APPEND the guidance.
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZED: ${{ steps.dmg_notarized.outputs.value }}
          SHIP_GORELEASER: ${{ needs.release-plan.outputs.ship_goreleaser }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          gh release upload "$TAG" "desktop/build/ShedDesktop-${VER}.dmg" --clobber
          if [ "${SHIP_GORELEASER}" = "true" ]; then
            echo "combined release — goreleaser owns the notes; skipping the notes edit."
            exit 0
          fi
          if [ "${NOTARIZED}" = "true" ]; then
            NOTES="Notarized Developer ID build (auto-updates via Sparkle). Drag to /Applications and open normally."
          else
            NOTES="Ad-hoc signed build (auto-updates via Sparkle). Not notarized yet — see FIRST-LAUNCH.txt in the DMG for the one-time Gatekeeper step."
          fi
          BODY="$(gh release view "$TAG" --json body --jq '.body')"
          if printf '%s' "${BODY}" | grep -qF "${NOTES}"; then
            echo "notes already carry the notarization line — leaving them as-is."
          else
            printf '%s\n\n%s\n' "${BODY}" "${NOTES}" | gh release edit "$TAG" --notes-file -
          fi

      # ---- Sparkle appcast: sign the DMG + publish the feed as the release bot ----
      - name: Mint release-bot token (self-repo, appcast push)
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id:    ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key:  ${{ secrets.RELEASE_BOT_APP_KEY }}
          owner:        charliek
          repositories: shed
          permission-contents: write

      - name: Sign DMG + append appcast entry
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_ED_PRIVATE_KEY}" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is unset — can't sign the appcast entry."
            exit 1
          fi
          VER="${TAG#v}"
          DMG="desktop/build/ShedDesktop-${VER}.dmg"
          test -s "${DMG}" || { echo "::error::${DMG} missing — the DMG step must run first."; exit 1; }
          # sign_update comes from fetch-sparkle's dist (staged into the
          # Tauri src-tauri by the bundle step), not a SwiftPM artifacts path.
          SIGN_UPDATE="desktop/tauri/src-tauri/.sparkle-dist/bin/sign_update"
          [ -x "${SIGN_UPDATE}" ] || { echo "::error::${SIGN_UPDATE} not found (fetch-sparkle must run in the build step)."; exit 1; }
          W="$(mktemp -d)"; chmod 700 "$W"; trap 'rm -rf "$W"' EXIT
          printf '%s' "${SPARKLE_ED_PRIVATE_KEY}" | base64 --decode > "${W}/key"
          "${SIGN_UPDATE}" --ed-key-file "${W}/key" "${DMG}" > "${W}/sign.txt"
          rm -f "${W}/key"
          cat "${W}/sign.txt"
          # The appcast lives on main; the tag was cut from main, so the untracked
          # desktop/build/ + gitignored desktop/tauri/src-tauri/.sparkle-dist/
          # artifacts survive the checkout. update-appcast.py runs FROM THE REPO ROOT
          # (its SHED_DESKTOP_APPCAST default is cwd-relative) and emits the beta
          # channel iff the tag has a `-`.
          git fetch origin main
          git checkout main
          SHED_DESKTOP_VERSION="${VER}" SHED_DESKTOP_TAG="${TAG}" \
            SHED_DESKTOP_SIGN_FILE="${W}/sign.txt" \
            SHED_DESKTOP_APPCAST="docs/appcast.xml" \
            SHED_DESKTOP_REPO="charliek/shed" \
            python3 desktop/scripts/update-appcast.py
          xmllint --noout docs/appcast.xml

      - name: Push signed appcast to main as release-bot
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          BOT_SLUG: ${{ steps.bot-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          if git diff --quiet docs/appcast.xml; then
            echo "::notice::docs/appcast.xml unchanged for ${TAG} — nothing to push."
            exit 0
          fi
          bot_id="$(gh api "/users/${BOT_SLUG}[bot]" --jq '.id')"
          git config user.name  "${BOT_SLUG}[bot]"
          git config user.email "${bot_id}+${BOT_SLUG}[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          staged="$(git diff --cached --name-only)"
          if [ "${staged}" != "docs/appcast.xml" ]; then
            echo "::error::unexpected staged paths beyond docs/appcast.xml:"; echo "${staged}"; exit 1
          fi
          git commit -m "chore(appcast): publish ${TAG}"
          TOKEN_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git push "${TOKEN_URL}" HEAD:main; then
              echo "::notice::Appcast pushed — docs.yml redeploys Pages → feed live."
              exit 0
            fi
            echo "::warning::push attempt ${attempt} failed; rebasing onto origin/main"
            git fetch "${TOKEN_URL}" main
            git rebase FETCH_HEAD || { echo "::error::rebase conflict on docs/appcast.xml"; exit 1; }
          done
          echo "::error::push failed after 3 attempts."; exit 1

  # ---- Linux: the shed-desktop .deb, per native arch, → the same Release ----
  desktop-linux:
    name: Desktop Linux .deb (${{ matrix.arch }})
    needs: [release-plan, release, desktop-release-create]
    # Same skip-safe composition as desktop-macos (see that job's comment).
    if: >-
      always() &&
      needs.release-plan.result == 'success' &&
      needs.release-plan.outputs.ship_desktop == 'true' &&
      needs.release.result != 'failure' &&
      needs.release.result != 'cancelled' &&
      needs.desktop-release-create.result != 'failure' &&
      needs.desktop-release-create.result != 'cancelled'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}
          # This job runs npm ci + cargo build (untrusted dependency code) before
          # `gh release upload` (GH_TOKEN from env, not the git credential) — don't
          # leave the checkout credential available for those steps to exfiltrate.
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Tauri (WebKitGTK) build deps
        # The shipped .deb is built from the Tauri client (React/WebKitGTK) on
        # the shared shed-core — so its build deps, not GTK4/libadwaita.
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Node (the Vite/React frontend bundle)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/tauri/ui/package-lock.json
      - name: Frontend bundle (generate_context! needs tauri/ui/dist)
        run: cd tauri/ui && npm ci && npm run build
      - name: Install nfpm (pinned, digest-verified)
        # Downloaded to a FILE with retries (a retry after a partial body must
        # never feed `tar` duplicate bytes, as a curl | tar pipe would), then
        # checked against an IN-TREE digest per arch — never a fetched
        # checksums file. The digests were read once from nfpm v2.46.3's
        # checksums.txt and cross-checked against the downloaded tarballs
        # (plan 026 §3.11). A version bump moves NFPM_VERSION and both
        # digests together.
        run: |
          set -euo pipefail
          NFPM_VERSION=2.46.3
          case "${{ matrix.arch }}" in
            amd64) NA=x86_64; NFPM_SHA256=9170d25ea056d7329def38134b2bcad98d02d221f8331610dcd619e84d28c565 ;;
            arm64) NA=arm64;  NFPM_SHA256=7871d72bb1035924eab56031f962ae3f004b1f7695151789ef018bdbc507a2fa ;;
            *) echo "::error::unsupported arch ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          TARBALL="${RUNNER_TEMP}/nfpm_${NFPM_VERSION}_Linux_${NA}.tar.gz"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors -o "${TARBALL}" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${NA}.tar.gz"
          echo "${NFPM_SHA256}  ${TARBALL}" | sha256sum -c -
          sudo tar -xzf "${TARBALL}" -C /usr/local/bin nfpm
          GOT="$(nfpm --version 2>&1)"
          if ! grep -qxE "GitVersion:[[:space:]]+v?${NFPM_VERSION}" <<<"${GOT}"; then
            echo "::error::nfpm --version does not report ${NFPM_VERSION}:" >&2
            echo "${GOT}" >&2
            exit 1
          fi
          echo "nfpm ${NFPM_VERSION} installed (sha256 ${NFPM_SHA256})"
      - name: Assert the runner arch matches the matrix
        # Runner-label availability isn't provable by actionlint; fail loudly here
        # rather than silently ship an amd64 .deb labelled arm64.
        run: |
          HAVE="$(dpkg --print-architecture)"
          if [ "$HAVE" != "${{ matrix.arch }}" ]; then
            echo "::error::runner arch $HAVE != matrix ${{ matrix.arch }}" >&2
            exit 1
          fi
      - name: Build the .deb
        run: ./linux/scripts/build-deb.sh "${TAG#v}"
      - name: Install-validate the .deb (per arch)
        # The release matrix is where the arm64 .deb is built AND
        # install-validated in a clean container (launch on WebKitGTK →
        # identify=tauri, bundled shedctl drives it, polkit action present) —
        # the arm64 runtime-dep proof. Docker is available on the GitHub
        # ubuntu runners.
        run: |
          # shellcheck disable=SC2012  # controlled out/ dir, glob is safe
          ./linux/scripts/validate-deb.sh "$(ls -t out/shed-desktop_*.deb | head -1)"
      - name: Upload the .deb to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/*.deb --clobber

  # ---- Tell charliek/apt-charliek to pull the new shed-desktop .deb ----
  # Skips prereleases (X.Y.Z-suffix tags — the rc-rehearsal path). Plain
  # Runs after the shed-desktop .deb is uploaded (desktop-linux), so the
  # re-collect it triggers actually finds the asset — the Go-side release job
  # dispatches apt earlier, before this deb exists, so that collect can't index
  # shed-desktop. Needs the explicit `always()`-composition because desktop-linux
  # runs via `if: always()` over a (correctly) skipped desktop-release-create on
  # combined tags; a plain `success()` gate gets poisoned by that transitive skip
  # and the job wrongly skips. Runs iff desktop shipped AND its .deb built.
  desktop-apt-dispatch:
    name: Dispatch apt-charliek (shed-desktop)
    needs: [release-plan, desktop-linux]
    if: >-
      always() &&
      needs.release-plan.outputs.ship_desktop == 'true' &&
      needs.desktop-linux.result == 'success'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Decide whether to dispatch
        id: guard
        run: |
          case "${TAG}" in
            *-*) echo "::notice::${TAG} is a prerelease — skipping apt-charliek dispatch."
                 echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "skip=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Mint an apt-charliek App token
        if: steps.guard.outputs.skip == 'false'
        id: apt
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_KEY }}
          owner: charliek
          repositories: apt-charliek
          # POST /repos/.../dispatches requires contents:write.
          permission-contents: write
      - name: Trigger apt-charliek publish (shed-desktop)
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.apt.outputs.token }}
        run: |
          # Same idempotent-with-retry pattern as the release job's dispatches.
          for attempt in 1 2 3; do
            if gh api repos/charliek/apt-charliek/dispatches \
              --method POST \
              -f event_type=publish \
              -F "client_payload[package]=shed-desktop" \
              -F "client_payload[tag]=${TAG}" 2>&1; then
              echo "::notice::Watch apt publish at https://github.com/charliek/apt-charliek/actions"
              exit 0
            fi
            echo "::warning::dispatch attempt $attempt failed; sleeping $((attempt * 5))s"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::apt-charliek dispatch failed after 3 attempts — check the stderr above for the API error"
              exit 1
            fi
            sleep $((attempt * 5))
          done

# The earlier sync-version job that checked out main, ran
# scripts/set-version.sh, and pushed the bumped
# .claude-plugin/plugin.json back to main is REMOVED in this
# migration. Plugin.json bumping is now LOCAL via
# scripts/release/update-version.sh (the cc-plugins:release-workflows
# convention's source-tree-bump-local rule). The release skill runs
# update-version.sh before tagging, so main always has plugin.json at
# the released tag's version before the workflow even fires. The
# release-plan job's manifest check is the cross-check that replaces
# sync-version's after-the-fact bump.
