name: Publish Images and Release

# Single source-of-truth for tag-driven publishing. Each tag push
# walks through:
#
#   1. publish-build-tools         (~2 min)   shed-build-tools image
#   2. publish-vz, publish-fc      (~10 min)  runtime images, need (1)
#   3. smoke                       (~1 min)   reusable smoke-linux gate
#   4. release                     (~5 min)   goreleaser + apt-charliek dispatch
#                                              — fires only on tag-push, gated on (1)-(3)
#
# Strict ordering eliminates the v0.5.2-era race where the
# apt-charliek dispatch could publish a binary before its referenced
# ghcr images existed (the binary's hard-fail on missing
# io.shed.rootfs.erofs.digest then surfaced as a confusing "image
# was built with pre-v0.5.2 tooling" message during the few-minute
# window between deb-published and image-published).
#
# workflow_dispatch republishes only re-run the image-publish chain;
# the `release` job is gated on tag-push events so manual republishes
# don't accidentally cut a new GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.2.3)"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-build-tools:
    name: Publish shed-build-tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            echo "::error::Version must start with 'v' (example: v1.2.3)"
            exit 1
          fi
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build + push the build-tools image first. The publish-vz /
      # publish-fc jobs need:tag to be on ghcr before they start so
      # they can `FROM` / `docker run` it during image build. See
      # docs/reference/build-tools.md for the versioning model.
      #
      # Build for both amd64 (used by publish-fc, runs on ubuntu-latest
      # x86_64) and arm64 (used by publish-vz, runs on ubuntu-24.04-arm).
      # docker buildx handles the multi-arch manifest.
      - name: Build and push shed-build-tools
        uses: docker/build-push-action@v6
        with:
          context: build-tools
          file: build-tools/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/charliek/shed-build-tools:${{ steps.version.outputs.tag }}
            ghcr.io/charliek/shed-build-tools:latest

  publish-vz:
    name: Publish VZ Images
    needs: publish-build-tools
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            echo "::error::Version must start with 'v' (example: v1.2.3)"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} does not exist"
            exit 1
          fi
          VERSION_BARE="${VERSION#v}"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "bare=${VERSION_BARE}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build shed binaries
        run: |
          LDFLAGS="-s -w \
            -X github.com/charliek/shed/internal/version.Version=${{ steps.version.outputs.bare }} \
            -X github.com/charliek/shed/internal/version.GitCommit=${{ steps.version.outputs.sha }} \
            -X github.com/charliek/shed/internal/version.BuildDate=${{ steps.version.outputs.date }}"
          # In-VM binaries staged into the Dockerfile build context.
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o vz/shed-agent ./cmd/shed-agent
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o vz/shed-firstboot ./cmd/shed-firstboot
          # Host-side CLI used to drive OCI conversion + push.
          mkdir -p bin
          go build -ldflags "$LDFLAGS" -o bin/shed ./cmd/shed

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shed-overlay initramfs
        run: |
          ./scripts/build-initramfs.sh \
            --backend vz \
            --platform linux/arm64 \
            --output /tmp/shed-initrd-vz.img

      - name: Build OCI images (base, extensions, full)
        run: |
          # Local OCI store; shed image build writes here, shed image
          # push streams from here to ghcr.io.
          #
          # --platform is set explicitly (belt-and-suspenders): even if
          # CLI inference regresses, the runner is arm64 and these
          # images must boot on Apple Silicon.
          #
          # --source-ref pins the manifest's io.shed.source-ref
          # annotation to the registry ref we're about to push to, so
          # the remote server's resolveImage cache-hit check matches
          # on subsequent `shed create` pulls.
          mkdir -p /tmp/oci-store-vz
          for variant in base extensions full; do
            echo "=== building shed-vz-${variant} ==="
            ./bin/shed image build \
              --target "shed-vz-${variant}" \
              -n "${variant}" \
              --platform linux/arm64 \
              --source-ref "ghcr.io/charliek/shed-vz-${variant}:${{ steps.version.outputs.tag }}" \
              --initramfs /tmp/shed-initrd-vz.img \
              --output-dir /tmp/oci-store-vz \
              -f vz/Dockerfile \
              vz/
          done

      - name: Push OCI images to ghcr.io
        run: |
          # Server config is needed by shed image push to locate the
          # OCI store; minimal stub pointing at the build output.
          cat > /tmp/publish-server.yaml <<YAML
          name: publish
          http_port: 0
          ssh_port: 0
          default_backend: vz
          vz:
            vfkit_path: vfkit
            images_dir: /tmp/oci-store-vz
            instance_dir: /tmp/oci-store-vz/instances
            socket_dir: /tmp/oci-store-vz/sockets
            default_cpus: 2
            default_memory_mb: 1024
            default_disk_gb: 1
            console_port: 1024
            notify_port: 1026
            tcp_proxy_port: 1028
            start_timeout: 60s
            stop_timeout: 10s
          YAML
          for variant in base extensions full; do
            echo "=== pushing shed-vz-${variant}:${{ steps.version.outputs.tag }} ==="
            ./bin/shed -c /tmp/publish-server.yaml image push \
              "${variant}" \
              "ghcr.io/charliek/shed-vz-${variant}:${{ steps.version.outputs.tag }}"
          done

  publish-fc:
    name: Publish FC Images
    needs: publish-build-tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            echo "::error::Version must start with 'v' (example: v1.2.3)"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} does not exist"
            exit 1
          fi
          VERSION_BARE="${VERSION#v}"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "bare=${VERSION_BARE}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build shed binaries
        run: |
          LDFLAGS="-s -w \
            -X github.com/charliek/shed/internal/version.Version=${{ steps.version.outputs.bare }} \
            -X github.com/charliek/shed/internal/version.GitCommit=${{ steps.version.outputs.sha }} \
            -X github.com/charliek/shed/internal/version.BuildDate=${{ steps.version.outputs.date }}"
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o firecracker/shed-agent ./cmd/shed-agent
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o firecracker/shed-firstboot ./cmd/shed-firstboot
          mkdir -p bin
          go build -ldflags "$LDFLAGS" -o bin/shed ./cmd/shed

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shed-overlay initramfs
        run: |
          ./scripts/build-initramfs.sh \
            --backend firecracker \
            --platform linux/amd64 \
            --output /tmp/shed-initrd-fc.img

      - name: Build OCI images (base, extensions, full)
        run: |
          # See VZ job for rationale on --platform and --source-ref.
          mkdir -p /tmp/oci-store-fc
          for variant in base extensions full; do
            echo "=== building shed-fc-${variant} ==="
            ./bin/shed image build \
              --target "shed-fc-${variant}" \
              -n "${variant}" \
              --platform linux/amd64 \
              --source-ref "ghcr.io/charliek/shed-fc-${variant}:${{ steps.version.outputs.tag }}" \
              --initramfs /tmp/shed-initrd-fc.img \
              --output-dir /tmp/oci-store-fc \
              -f firecracker/Dockerfile \
              firecracker/
          done

      - name: Push OCI images to ghcr.io
        run: |
          cat > /tmp/publish-server.yaml <<YAML
          name: publish
          http_port: 0
          ssh_port: 0
          default_backend: firecracker
          firecracker:
            images_dir: /tmp/oci-store-fc
            instance_dir: /tmp/oci-store-fc/instances
            socket_dir: /tmp/oci-store-fc/sockets
            default_cpus: 2
            default_memory_mb: 1024
            default_disk_gb: 1
            console_port: 1024
            notify_port: 1026
            vsock_base_cid: 100
            bridge_name: shed-br0
            bridge_cidr: 172.30.0.1/24
            tap_prefix: shed-tap
            start_timeout: 60s
            stop_timeout: 10s
          YAML
          for variant in base extensions full; do
            echo "=== pushing shed-fc-${variant}:${{ steps.version.outputs.tag }} ==="
            ./bin/shed -c /tmp/publish-server.yaml image push \
              "${variant}" \
              "ghcr.io/charliek/shed-fc-${variant}:${{ steps.version.outputs.tag }}"
          done

  # Install-only smoke against the same commit. Gate the release on
  # this so a binary that can't even run cleanly on a fresh runner
  # doesn't ship — same regression class that broke v0.5.1.
  smoke:
    uses: ./.github/workflows/smoke-linux.yml

  # goreleaser + apt-charliek dispatch. Only fires on tag-push
  # events (not manual workflow_dispatch republishes), and only
  # after the build-tools image, runtime images, and smoke have all
  # gone green. By that point apt-charliek pulling down the new
  # deb finds every referenced ghcr image already published.
  release:
    name: Build and Release
    needs: [publish-build-tools, publish-vz, publish-fc, smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Tag/manifest invariant check — the local-bump flow's safety net.
      # Replaces the deleted sync-version job's contract: instead of
      # fixing plugin.json drift after the fact in CI, fail the release
      # if the tagged commit's plugin.json doesn't match the tag. Cheap
      # server-side check; the maintainer reruns
      # /release-workflows:release against a corrected tag rather than
      # shipping mismatched bytes.
      - name: Verify plugin.json matches tag
        run: |
          set -euo pipefail
          expect="${GITHUB_REF_NAME#v}"
          # Use jq to anchor to the top-level .version field; a regex
          # would also (incorrectly) match a future nested "version"
          # field (e.g. in a future "dependencies" block). jq is
          # preinstalled on ubuntu-latest and fails loudly on malformed
          # JSON.
          got="$(jq -r '.version' .claude-plugin/plugin.json)"
          if [ "${got}" != "${expect}" ]; then
            echo "::error::plugin.json .version=${got} != tag=${expect}. Re-run /release-workflows:release after correcting."
            exit 1
          fi

      - name: Run Tests
        run: go test ./...

      - name: Run Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1

      # Mint a release-bot App token scoped to charliek/homebrew-tap for
      # GoReleaser's `brews:` step (formula push). The App must be
      # installed on homebrew-tap (verify via sanity-check-app.yml).
      # Replaces the legacy HOMEBREW_TAP_TOKEN PAT — GoReleaser is
      # token-source-agnostic; it just uses HOMEBREW_TAP_TOKEN from the
      # env for git authentication.
      - name: Mint a homebrew-tap App token
        id: tap
        uses: actions/create-github-app-token@v3
        with:
          client-id:      ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_KEY }}
          owner:        charliek
          repositories: homebrew-tap
          # Defense-in-depth: explicit permission floor on the minted
          # token so a future widening of the App's installation perms
          # doesn't silently broaden what this token can do. GoReleaser
          # only needs contents:write on the tap repo (to push the
          # formula).
          permission-contents: write

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GoReleaser reads HOMEBREW_TAP_TOKEN from this env var (see
          # .goreleaser.yaml: brews[].repository.token). Feed it the
          # App-minted token instead of a PAT.
          HOMEBREW_TAP_TOKEN: ${{ steps.tap.outputs.token }}

      # Mint a release-bot App token scoped to charliek/apt-charliek for
      # the publish dispatch. The App must be installed on apt-charliek
      # (verify via sanity-check-app.yml). Replaces the legacy
      # APT_DISPATCH_TOKEN PAT.
      - name: Mint an apt-charliek App token
        if: success()
        id: apt
        uses: actions/create-github-app-token@v3
        with:
          client-id:      ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_KEY }}
          owner:        charliek
          repositories: apt-charliek
          # POST /repos/.../dispatches requires contents:write.
          permission-contents: write

      - name: Trigger apt-charliek publish
        if: success()
        env:
          GH_TOKEN: ${{ steps.apt.outputs.token }}
        run: |
          # Retry the dispatch a few times — a transient network/API
          # blip shouldn't fail the release after GoReleaser already
          # succeeded. apt-charliek's publish workflow is idempotent so
          # a missed dispatch self-heals on the next release, but we
          # still want to flag genuinely persistent failures.
          for attempt in 1 2 3; do
            # Capture stderr so a real install-state failure (App not
            # installed on apt-charliek, scoped-perms mismatch, etc.)
            # is diagnosable from the workflow log without re-running.
            if gh api repos/charliek/apt-charliek/dispatches \
              --method POST \
              -f event_type=publish \
              -F "client_payload[package]=shed-server" \
              -F "client_payload[tag]=${{ github.ref_name }}" 2>&1; then
              echo "::notice::Watch apt publish at https://github.com/charliek/apt-charliek/actions"
              exit 0
            fi
            echo "::warning::dispatch attempt $attempt failed; sleeping $((attempt * 5))s"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::apt-charliek dispatch failed after 3 attempts — check the stderr above for the API error"
              exit 1
            fi
            sleep $((attempt * 5))
          done

# The earlier sync-version job that checked out main, ran
# scripts/set-version.sh, and pushed the bumped
# .claude-plugin/plugin.json back to main is REMOVED in this
# migration. Plugin.json bumping is now LOCAL via
# scripts/release/update-version.sh (the cc-plugins:release-workflows
# convention's source-tree-bump-local rule). The release skill runs
# update-version.sh before tagging, so main always has plugin.json at
# the released tag's version before the workflow even fires. The
# inline "Verify plugin.json matches tag" step above is the cross-check
# that replaces sync-version's after-the-fact bump.
